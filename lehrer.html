<style>
/* Layout: teacher console in the site's formal style — dark band header, KPI strip, class table, topic bars, per-student detail. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --ink:#16181d; --muted:#5d636e; --line:#dcdfe5;
  --band:#121316; --band-ink:#ffffff; --band-muted:#a9adb5; --gold:#c9900a; --flag-red:#d0102b; --flag-gold:#f2b705;
  --ok:#1e7f4f; --ok-bg:#e1f2e8; --bad:#c0392b; --bad-bg:#fbe6e3; --warn:#b7791f;
  --f-ui:"IBM Plex Sans Arabic","Golos Text",system-ui,sans-serif; --f-de:"Golos Text",system-ui,sans-serif;
  --f-disp:"Source Serif 4","IBM Plex Sans Arabic",Georgia,serif; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --surface:#17191d; --surface-2:#20232a; --ink:#eceef2; --muted:#9aa0aa; --line:#2b2f37;
  --band:#08090a; --gold:#f0b429; --ok:#4cc38a; --ok-bg:#15291f; --bad:#f07a6c; --bad-bg:#33201e; --warn:#f0b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17191d; --surface-2:#20232a; --ink:#eceef2; --muted:#9aa0aa; --line:#2b2f37;
  --band:#08090a; --gold:#f0b429; --ok:#4cc38a; --ok-bg:#15291f; --bad:#f07a6c; --bad-bg:#33201e; --warn:#f0b45a; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.3rem}
h3{font-size:1rem}
.de{font-family:var(--f-de);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,#000 0 33.3%,var(--flag-red) 33.3% 66.6%,var(--flag-gold) 66.6%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.top-in,.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.top img{width:42px;height:42px;border-radius:50%}
.top b{font-family:var(--f-disp);font-size:1.1rem;display:block}
.top small{color:var(--band-muted);font-size:.78rem}
.top .sp{flex:1}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:6px 12px;font-size:.85rem}
.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:var(--r);font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;color:var(--muted);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--f-disp);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
th button{background:none;border:0;padding:0;color:inherit;font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-de)}
.name{font-weight:600}
.acc{display:flex;align-items:center;gap:8px;min-width:120px}
.acc .bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.acc .bar i{display:block;height:100%}
.acc span{font-family:var(--f-de);font-variant-numeric:tabular-nums;font-size:.85rem;min-width:3.2em}
.g{background:var(--ok)}.m{background:var(--warn)}.l{background:var(--bad)}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.search{width:100%;max-width:260px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.topics{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:.88rem}
.trow .de{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .acc{min-width:0}
.list{display:flex;flex-direction:column}
.li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.li:first-child{border-top:0}
.li .q{font-family:var(--f-de);direction:ltr;text-align:left;font-weight:600}
.li small{color:var(--muted)}
.bad-t{color:var(--bad)}.ok-t{color:var(--ok)}
.letter{white-space:pre-wrap;font-family:var(--f-de);direction:ltr;text-align:left;background:var(--surface-2);border-radius:var(--r);padding:12px;margin:6px 0 0;line-height:1.6;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.88rem}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:600}
.days{display:flex;align-items:flex-end;gap:4px;height:70px;direction:ltr}
.days div{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px}
.daysl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);direction:ltr;font-family:var(--f-de)}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login input[type=password]{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:1.05rem}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:10px 12px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.cta{width:100%;min-height:260px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:var(--f-de);font-size:.98rem;line-height:1.6;resize:vertical}
.cta.small{min-height:90px;font-family:var(--f-ui)}
.diffv{white-space:normal;line-height:1.9}
del{color:var(--bad);background:var(--bad-bg);border-radius:3px;padding:0 2px}
ins{color:var(--ok);background:var(--ok-bg);text-decoration:none;border-radius:3px;padding:0 2px;font-weight:600}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:10px 14px;font-weight:600}
.grid2>*,.kpis>*{min-width:0}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const accBar=(p,n)=>n?`<div class="acc"><div class="bar"><i class="${cls(p)}" style="width:${p}%"></i></div><span>${p}%</span></div>`:`<span class="muted">—</span>`;

function parse(raw){
  return raw.map(r=>({t:new Date(r[0]),name:String(r[1]||"").trim(),section:String(r[2]||""),topic:String(r[3]||""),q:String(r[4]||""),a:String(r[5]||""),ok:r[6]==="✓"?true:r[6]==="✗"?false:null,right:String(r[7]||""),tries:String(r[8]||""),lang:String(r[9]||""),dev:String(r[10]||"")}))
   .filter(r=>r.name&&r.section!=="Test"&&!isNaN(r.t));
}
const isAnswer=r=>r.ok!==null&&(r.section==="Quiz"||r.section==="Satzbau"||(r.section==="Prüfung"&&r.topic.includes(" · ")));
const isPractice=r=>r.ok!==null&&(r.section==="Quiz"||r.section==="Satzbau"||r.section==="Hören");
const isWriting=r=>(r.section==="Schreiben"||r.section==="Prüfung-Schreiben")&&r.right.startsWith("W:");
const widOf=r=>r.right.slice(2);
// word-level diff (LCS) for the correction preview
function wdiff(a,b){
  const tok=x=>String(x).replace(/\r/g,"").replace(/\n/g," \n ").split(/ +/).filter(w=>w!=="");
  const A=tok(a),B=tok(b),n=A.length,m=B.length;
  if(n*m>250000)return esc(b).replace(/\n/g,"<br>");
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;const w=(x,tag)=>x==="\n"?"<br>":tag?`<${tag}>${esc(x)}</${tag}>`:esc(x);
  while(i<n&&j<m){if(A[i]===B[j]){out.push(w(A[i]));i++;j++}else if(L[i+1][j]>=L[i][j+1])out.push(w(A[i++],"del"));else out.push(w(B[j++],"ins"))}
  while(i<n)out.push(w(A[i++],"del"));while(j<m)out.push(w(B[j++],"ins"));
  return out.join(" ").replace(/ ?<br> ?/g,"<br>");
}
const isExam=r=>r.section==="Prüfung"&&!r.topic.includes(" · ");
const keyOf=n=>n.toLowerCase().replace(/\s+/g," ");

function inRange(r){return STATE.range===0||r.t>=Date.now()-STATE.range*864e5}
function students(rows){
  const m=new Map();
  rows.forEach(r=>{const k=keyOf(r.name);let s=m.get(k);if(!s){s={key:k,name:r.name,rows:[],last:r.t};m.set(k,s)}s.rows.push(r);if(r.t>=s.last){s.last=r.t;s.name=r.name}});
  return [...m.values()].map(s=>{
    const ans=s.rows.filter(isPractice),ok=ans.filter(r=>r.ok).length;
    const exams=s.rows.filter(isExam);
    const bestExam=exams.reduce((b,r)=>{const m=/\((\d+)%\)/.exec(r.a);return m?Math.max(b,+m[1]):b},-1);
    const quizzes=s.rows.filter(r=>r.section==="Quiz-Ergebnis").length;
    const by={};ans.forEach(r=>{const t=r.topic||"—";(by[t]=by[t]||{n:0,ok:0});by[t].n++;if(r.ok)by[t].ok++});
    const weak=Object.entries(by).filter(([,v])=>v.n>=3).map(([t,v])=>({t,p:pct(v.ok,v.n),n:v.n})).sort((a,b)=>a.p-b.p)[0];
    return Object.assign(s,{n:ans.length,ok,acc:pct(ok,ans.length),exams,bestExam,quizzes,by,weak});
  });
}

async function load(){
  STATE.loading=true;STATE.err="";render();
  try{
    const res=await fetch(ENDPOINT+"?action=data&key="+encodeURIComponent(KEY),{cache:"no-store"});
    const j=await res.json();
    if(!j.ok){STATE.err=j.error==="key"?"كلمة السر غلط.":"صار خطأ بقراية البيانات.";if(j.error==="key"){KEY="";forget()}}
    else{ROWS=parse(j.rows);FB={};(j.fb||[]).forEach(f=>{FB[f[0]]={t:f[1],points:f[2],comment:f[3]}});STATE.loaded=new Date()}
  }catch(e){STATE.err="ما قدرت أوصل للجدول. تأكّد من الإنترنت وجرّب كمان مرة."}
  STATE.loading=false;render();
}

function vWritings(){

    <div class="list">${show.map(r=>{const f=FB[widOf(r)];return `<div class="li" data-corr="${esc(widOf(r))}" style="cursor:pointer"><div class="row between"><b>${esc(r.name)}</b>${f?`<span class="pill ok" dir="ltr">${f.points!==""?esc(f.points)+" / 20":"✓"}</span>`:'<span class="pill bad">صحّح ←</span>'}</div><small><span class="de">${esc(r.topic)}</span> · ${ltr(esc(fmtDT(r.t)))} · ${ltr(esc(r.tries))}</small></div>`}).join("")}</div></section>`;

function vStudent(s){

  const ans=all.filter(isPractice);
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const e=new Date(d);e.setDate(e.getDate()+1);days.push(ans.filter(r=>r.t>=d&&r.t<e).length)}
  const mx=Math.max(1,...days);
  const topics=Object.entries(st.by).map(([t,v])=>({t,p:pct(v.ok,v.n),n:v.n})).sort((a,b)=>a.p-b.p);

        <section class="sheet"><div class="row between" style="margin-bottom:6px"><h3>الأخطاء</h3>
          <select id="tf" class="search" style="max-width:220px"><option value="">كل المواضيع</option>${topics.map(x=>`<option value="${esc(x.t)}"${STATE.topicFilter===x.t?" selected":""}>${esc(x.t)}</option>`).join("")}</select></div>

        </section>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px">
        <section class="sheet"><h3 style="margin-bottom:10px">النشاط آخر 14 يوم</h3>

        </section>
        <section class="sheet"><h3 style="margin-bottom:12px">المواضيع</h3>
          ${topics.length?`<div class="topics">${topics.map(x=>`<div class="trow"><span class="de" title="${esc(x.t)}">${esc(x.t)} <small class="muted">(${x.n})</small></span>${accBar(x.p,x.n)}</div>`).join("")}</div>`:`<p class="muted">لسا ما في أجوبة.</p>`}

function render(){
  const app=$("app");
  $("refresh").hidden=$("logout").hidden=!KEY||!STATE.loaded;
  if(!KEY){app.innerHTML=vLogin();const pw=$("pw");if(pw)pw.focus();return}
  if(STATE.loading&&!STATE.loaded){app.innerHTML=`<p class="empty">عم حمّل البيانات…</p>`;return}
  if(STATE.err&&!STATE.loaded){app.innerHTML=`<p class="err">${esc(STATE.err)}</p><button class="btn" id="retry">جرّب كمان مرة</button>`;return}
  if(STATE.corr){const r=ROWS.find(x=>isWriting(x)&&widOf(x)===STATE.corr);if(r){app.innerHTML=vCorr(r);return}STATE.corr=null}
  if(STATE.sel){const s=students(ROWS).find(x=>x.key===STATE.sel);if(s){app.innerHTML=vStudent(s);return}STATE.sel=null}
  app.innerHTML=(STATE.toast?`<p class="toast">${esc(STATE.toast)}</p>`:"")+vDash();
}
document.addEventListener("submit",e=>{
  if(e.target.id!=="loginF")return;e.preventDefault();
  const v=$("pw").value.trim();if(!v)return;KEY=v;
  try{if($("remember").checked)localStorage.setItem("lmm-teacher",v);else sessionStorage.setItem("lmm-teacher",v)}catch(err){}
  load();
});
document.addEventListener("click",e=>{
  const t=e.target;
  const r=t.closest("[data-range]");if(r){STATE.range=+r.dataset.range;render();return}
  const so=t.closest("[data-sort]");if(so){STATE.sort=so.dataset.sort;render();return}
  const co=t.closest("[data-corr]");if(co){STATE.back=STATE.sel;STATE.corr=co.dataset.corr;STATE.cErr="";render();window.scrollTo(0,0);return}
  if(t.closest("#cSend")){sendCorr(t.closest("#cSend").dataset.wid);return}
  const st=t.closest("[data-stu]");if(st){STATE.sel=st.dataset.stu;STATE.topicFilter="";render();window.scrollTo(0,0);return}
  if(t.closest("[data-back]")){if(STATE.corr){STATE.corr=null}else STATE.sel=null;render();window.scrollTo(0,0);return}
  if(t.closest("#retry")||t.closest("#refresh")){load();return}
  if(t.closest("#logout")){KEY="";forget();ROWS=[];STATE.loaded=null;STATE.sel=null;render();return}
});
function sendCorr(wid){
  const r=ROWS.find(x=>isWriting(x)&&widOf(x)===wid);if(!r)return;
  const corrected=$("cText").value.trim(),comment=$("cNote").value.trim(),points=$("cPts").value;
  if(!corrected){STATE.cErr="النص المصحّح فاضي.";render();return}
  const btn=$("cSend");btn.disabled=true;btn.textContent="عم يبعت…";
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"feedback",key:KEY,wid,name:r.name,dev:r.dev,topic:r.topic,original:r.a,corrected,comment,points})})
    .then(()=>{FB[wid]={t:new Date().toISOString(),points,comment};STATE.corr=null;STATE.toast="انبعت التصحيح لـ "+r.name+" ✓";render();window.scrollTo(0,0);setTimeout(()=>{STATE.toast="";render()},3500)})
    .catch(()=>{STATE.cErr="ما انبعت. تأكّد من الإنترنت وجرّب كمان مرة.";render()});
}
document.addEventListener("input",e=>{
  if(e.target.id==="cText"){const r=ROWS.find(x=>isWriting(x)&&widOf(x)===STATE.corr);if(r)$("cPrev").innerHTML=wdiff(r.a,e.target.value);return}if(e.target.id==="q"){STATE.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("q");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{if(e.target.id==="tf"){STATE.topicFilter=e.target.value;render()}});
render();if(KEY)load();
})();
</script>
