{id:"wechsel", de:"Wechselpräpositionen: wo? / wohin?",
 n:{ar:"حروف الجر المتغيّرة: wo؟ ولا wohin؟",uk:"Прийменники з двома відмінками: wo? / wohin?",tr:"Değişken edatlar: wo? / wohin?",en:"Two-way prepositions: wo? / wohin?"},
 tip:{ar:"**wo?** (وين؟، ما في حركة) ← Dativ: in **der** Schweiz. **wohin?** (لوين؟، في حركة) ← Akkusativ: in **die** Schweiz.",uk:"**wo?** (де?, без руху) → Dativ: in **der** Schweiz. **wohin?** (куди?, є рух) → Akkusativ: in **die** Schweiz.",tr:"**wo?** (nerede?, hareket yok) → Dativ: in **der** Schweiz. **wohin?** (nereye?, hareket var) → Akkusativ: in **die** Schweiz.",en:"**wo?** (where?, no movement) → Dativ: in **der** Schweiz. **wohin?** (where to?, movement) → Akkusativ: in **die** Schweiz."},
 rules:{
  ar:["هدول الـ 9 حروف بياخدو **Dativ أو Akkusativ**: **in, an, auf, über, unter, vor, hinter, neben, zwischen**.","اسأل حالك: **wo?** (وين؟) ولا **wohin?** (لوين؟)","**wo?** = الشي موجود بمكانه، ما في حركة ← **Dativ**: Ich wohne in **der** Stadt.","**wohin?** = في حركة لمكان تاني ← **Akkusativ**: Ich fahre in **die** Stadt.","اختصارات: in dem ← **im**، in das ← **ins**، an dem ← **am**، an das ← **ans**."],
  uk:["Ці 9 прийменників вживаються з **Dativ або Akkusativ**: **in, an, auf, über, unter, vor, hinter, neben, zwischen**.","Запитайте себе: **wo?** (де?) чи **wohin?** (куди?)","**wo?** — предмет перебуває на місці, руху немає → **Dativ**: Ich wohne in **der** Stadt.","**wohin?** — є рух до іншого місця → **Akkusativ**: Ich fahre in **die** Stadt.","Скорочення: in dem → **im**, in das → **ins**, an dem → **am**, an das → **ans**."],
  tr:["Bu 9 edat **Dativ veya Akkusativ** alır: **in, an, auf, über, unter, vor, hinter, neben, zwischen**.","Kendinize sorun: **wo?** (nerede?) mi, **wohin?** (nereye?) mi?","**wo?** = bir yerde bulunma, hareket yok → **Dativ**: Ich wohne in **der** Stadt.","**wohin?** = başka bir yere hareket var → **Akkusativ**: Ich fahre in **die** Stadt.","Kısaltmalar: in dem → **im**, in das → **ins**, an dem → **am**, an das → **ans**."],
  en:["These 9 prepositions take **Dativ or Akkusativ**: **in, an, auf, über, unter, vor, hinter, neben, zwischen**.","Ask yourself: **wo?** (where?) or **wohin?** (where to?)","**wo?** = something is in a place, no movement → **Dativ**: Ich wohne in **der** Stadt.","**wohin?** = movement to another place → **Akkusativ**: Ich fahre in **die** Stadt.","Short forms: in dem → **im**, in das → **ins**, an dem → **am**, an das → **ans**."]},
 tables:[{cap:"in + …",rows:[["","wo? → Dativ","wohin? → Akkusativ"],["der Park","im Park","in den Park"],["die Schweiz","in der Schweiz","in die Schweiz"],["das Kino","im Kino","ins Kino"],["die Berge (Pl.)","in den Bergen","in die Berge"]]}],
 ex:[
  ["Ich bin seit drei Jahren in der Schweiz.",{ar:"أنا بسويسرا من تلات سنين.",uk:"Я вже три роки у Швейцарії.",tr:"Üç yıldır İsviçre'deyim.",en:"I've been in Switzerland for three years."}],
  ["Ich bin vor drei Jahren in die Schweiz gekommen.",{ar:"إجيت على سويسرا من تلات سنين.",uk:"Я приїхав до Швейцарії три роки тому.",tr:"Üç yıl önce İsviçre'ye geldim.",en:"I came to Switzerland three years ago."}],
  ["Das Buch liegt auf dem Tisch.",{ar:"الكتاب موجود على الطاولة.",uk:"Книжка лежить на столі.",tr:"Kitap masanın üstünde duruyor.",en:"The book is on the table."}],
  ["Ich lege das Buch auf den Tisch.",{ar:"بحط الكتاب على الطاولة.",uk:"Я кладу книжку на стіл.",tr:"Kitabı masanın üstüne koyuyorum.",en:"I'm putting the book on the table."}]]},

{id:"praep", de:"Verben mit Präpositionen",
 n:{ar:"أفعال مع حروف جر (+ wo- / da-)",uk:"Дієслова з прийменниками (+ wo- / da-)",tr:"Edatlı fiiller (+ wo- / da-)",en:"Verbs with prepositions (+ wo- / da-)"},
 tip:{ar:"احفظ الفعل مع حرف الجر والحالة: warten auf + Akk.",uk:"Вчи дієслово разом із прийменником і відмінком: warten auf + Akk.",tr:"Fiili edatı ve hâliyle birlikte ezberle: warten auf + Akk.",en:"Learn the verb together with its preposition and case: warten auf + Akk."},
 rules:{
  ar:["أفعال كتير بتجي مع **حرف جر ثابت**، ولازم تنحفظ سوا: warten **auf**، sich freuen **auf / über**، denken **an**.","حرف الجر بيحدّد الحالة: auf + Akk: Ich warte **auf den** Bus. / mit + Dat: Ich spreche **mit dem** Chef.","سؤال عن شي (مش شخص): **wo(r) + حرف الجر**: **Worauf** wartest du? **Woran** denkst du?","جواب بدون تكرار الشي: **da(r) + حرف الجر**: Ich warte **darauf**. Ich denke **daran**.","عن **شخص** منستعمل حرف الجر + ضمير: **Auf wen** wartest du? – **Auf ihn**."],
  uk:["Багато дієслів мають **сталий прийменник**, їх треба вчити разом: warten **auf**, sich freuen **auf / über**, denken **an**.","Прийменник визначає відмінок: auf + Akk: Ich warte **auf den** Bus. / mit + Dat: Ich spreche **mit dem** Chef.","Питання про річ (не людину): **wo(r) + прийменник**: **Worauf** wartest du? **Woran** denkst du?","Відповідь без повтору: **da(r) + прийменник**: Ich warte **darauf**. Ich denke **daran**.","Про **людину** — прийменник + займенник: **Auf wen** wartest du? – **Auf ihn**."],
  tr:["Birçok fiil **sabit bir edatla** kullanılır ve birlikte ezberlenmelidir: warten **auf**, sich freuen **auf / über**, denken **an**.","Edat hâli belirler: auf + Akk: Ich warte **auf den** Bus. / mit + Dat: Ich spreche **mit dem** Chef.","Bir şey (kişi değil) için soru: **wo(r) + edat**: **Worauf** wartest du? **Woran** denkst du?","Tekrar etmeden cevap: **da(r) + edat**: Ich warte **darauf**. Ich denke **daran**.","**Kişi** için edat + zamir: **Auf wen** wartest du? – **Auf ihn**."],
  en:["Many verbs have a **fixed preposition** and must be learned together: warten **auf**, sich freuen **auf / über**, denken **an**.","The preposition decides the case: auf + acc.: Ich warte **auf den** Bus. / mit + dat.: Ich spreche **mit dem** Chef.","Asking about a thing (not a person): **wo(r) + preposition**: **Worauf** wartest du? **Woran** denkst du?","Answering without repeating it: **da(r) + preposition**: Ich warte **darauf**. Ich denke **daran**.","For a **person**, use preposition + pronoun: **Auf wen** wartest du? – **Auf ihn**."]},
 ex:[
  ["Ich freue mich auf das Wochenende.",{ar:"متحمّس للويكند.",uk:"Я з нетерпінням чекаю на вихідні.",tr:"Hafta sonunu dört gözle bekliyorum.",en:"I'm looking forward to the weekend."}],
  ["Worüber hast du dich geärgert? – Über den Lärm.",{ar:"من شو عصّبت؟ – من الضجة.",uk:"Через що ти розсердився? – Через шум.",tr:"Neye kızdın? – Gürültüye.",en:"What were you annoyed about? – The noise."}],
  ["Er kümmert sich um seine Mutter.",{ar:"هو بيهتم بإمّه.",uk:"Він піклується про свою маму.",tr:"Annesiyle ilgileniyor.",en:"He takes care of his mother."}]]},

{id:"zuinf", de:"zu + Infinitiv, um … zu, damit",
 n:{ar:"zu + Infinitiv و um … zu و damit",uk:"zu + інфінітив, um … zu, damit",tr:"zu + mastar, um … zu, damit",en:"zu + infinitive, um … zu, damit"},
 tip:{ar:"zu + Infinitiv بالآخر. um … zu = لكي (نفس الفاعل)، damit = لكي (فاعل مختلف).",uk:"zu + інфінітив у кінці. um … zu — щоб (той самий підмет), damit — щоб (інший підмет).",tr:"zu + mastar sonda. um … zu: -mek için (aynı özne), damit: -sın diye (farklı özne).",en:"zu + infinitive at the end. um … zu = in order to (same subject), damit = so that (different subject)."},
 rules:{
  ar:["بعد أفعال وتعابير معيّنة منستعمل **zu + Infinitiv** بالآخر: Ich habe keine Zeit, **zu kochen**. / Es ist wichtig, Deutsch **zu lernen**.","أفعال شائعة: versuchen، vergessen، anfangen، aufhören، vorhaben، Lust haben، Zeit haben.","مع الأفعال المنفصلة zu بيدخل بالنص: an**zu**rufen، ein**zu**kaufen.","**um … zu** = لكي (لما الفاعل نفسه): Ich lerne Deutsch, **um** hier **zu arbeiten**.","**damit** = لكي (لما الفاعل مختلف): Ich spreche langsam, **damit** du mich **verstehst**."],
  uk:["Після деяких дієслів і виразів вживається **zu + інфінітив** у кінці: Ich habe keine Zeit, **zu kochen**. / Es ist wichtig, Deutsch **zu lernen**.","Часті дієслова: versuchen, vergessen, anfangen, aufhören, vorhaben, Lust haben, Zeit haben.","У відокремлюваних дієсловах zu стоїть усередині: an**zu**rufen, ein**zu**kaufen.","**um … zu** = щоб (той самий підмет): Ich lerne Deutsch, **um** hier **zu arbeiten**.","**damit** = щоб (інший підмет): Ich spreche langsam, **damit** du mich **verstehst**."],
  tr:["Bazı fiil ve ifadelerden sonra sonda **zu + mastar** kullanılır: Ich habe keine Zeit, **zu kochen**. / Es ist wichtig, Deutsch **zu lernen**.","Sık kullanılan fiiller: versuchen, vergessen, anfangen, aufhören, vorhaben, Lust haben, Zeit haben.","Ayrılabilen fiillerde zu ortaya girer: an**zu**rufen, ein**zu**kaufen.","**um … zu** = -mek için (aynı özne): Ich lerne Deutsch, **um** hier **zu arbeiten**.","**damit** = -sın diye (farklı özne): Ich spreche langsam, **damit** du mich **verstehst**."],
  en:["After certain verbs and phrases we use **zu + infinitive** at the end: Ich habe keine Zeit, **zu kochen**. / Es ist wichtig, Deutsch **zu lernen**.","Common verbs: versuchen, vergessen, anfangen, aufhören, vorhaben, Lust haben, Zeit haben.","With separable verbs zu goes in the middle: an**zu**rufen, ein**zu**kaufen.","**um … zu** = in order to (same subject): Ich lerne Deutsch, **um** hier **zu arbeiten**.","**damit** = so that (different subject): Ich spreche langsam, **damit** du mich **verstehst**."]},
 ex:[
  ["Ich habe vergessen, dich anzurufen.",{ar:"نسيت اتصل فيك.",uk:"Я забув тобі зателефонувати.",tr:"Seni aramayı unuttum.",en:"I forgot to call you."}],
  ["Ich lerne Deutsch, um eine gute Stelle zu finden.",{ar:"بتعلّم ألماني لحتى لاقي شغل منيح.",uk:"Я вчу німецьку, щоб знайти хорошу роботу.",tr:"İyi bir iş bulmak için Almanca öğreniyorum.",en:"I'm learning German in order to find a good job."}],
  ["Ich erkläre es noch einmal, damit alle es verstehen.",{ar:"بشرحها كمان مرة لحتى الكل يفهمها.",uk:"Я поясню ще раз, щоб усі зрозуміли.",tr:"Herkes anlasın diye bir kez daha açıklıyorum.",en:"I'll explain it again so that everyone understands."}]]}
];

{id:"beschwerde", formal:true, groups:["anrede_f","einleitung","problem","bitte","erreichbar","schluss","gruss"],

 task:{de:"Sie haben vor drei Monaten bei der Firma Computech einen neuen Laptop gekauft. Jetzt ist er kaputt. Sie erreichen bei der Firma telefonisch niemanden, deshalb schreiben Sie eine E-Mail.",

  tr:"Üç ay önce Computech firmasından yeni bir dizüstü bilgisayar aldınız. Şimdi bozuldu. Firmaya telefonla ulaşamıyorsunuz, bu yüzden bir e-posta yazıyorsunuz.",
  en:"Three months ago you bought a new laptop from the company Computech. Now it is broken. You can't reach anyone by phone, so you write an email."},
 points:[
  {de:"Grund für Ihr Schreiben",ar:"سبب الكتابة",uk:"Причина листа",tr:"Yazma nedeniniz",en:"Reason for writing"},
  {de:"Garantie",ar:"الكفالة",uk:"Гарантія",tr:"Garanti",en:"Warranty"},
  {de:"Reparatur oder neuer Laptop",ar:"تصليح ولا لابتوب جديد",uk:"Ремонт чи новий ноутбук",tr:"Tamir mi, yeni bilgisayar mı",en:"Repair or a new laptop"},
  {de:"Wie Sie erreichbar sind",ar:"كيف يتواصلوا معك",uk:"Як з вами зв'язатися",tr:"Size nasıl ulaşılabileceği",en:"How they can reach you"}],
 sample:"Sehr geehrte Damen und Herren,\n\nich möchte Ihnen mitteilen, dass ich vor drei Monaten bei Ihnen einen neuen Laptop gekauft habe. Leider ist der Laptop jetzt kaputt: Er geht nicht mehr an. Ich habe Sie mehrmals angerufen, aber niemanden erreicht.\n\nDer Laptop hat zwei Jahre Garantie, also ist er noch in der Garantiezeit. Deshalb möchte ich Sie bitten, ihn kostenlos zu reparieren. Wenn eine Reparatur nicht möglich ist, möchte ich einen neuen Laptop bekommen.\n\nSie erreichen mich per E-Mail oder unter der Nummer 079 123 45 67, am besten nachmittags.\n\nIch freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"حضرات السيدات والسادة،\n\nبحب بلّغكم إني اشتريت من عندكم لابتوب جديد من 3 شهور. للأسف اللابتوب هلأ خربان: ما عاد يشتغل. اتصلت فيكم كذا مرة بس ما رد حدا.\n\nاللابتوب عليه كفالة سنتين، يعني لسا بفترة الكفالة. لهيك بطلب منكم تصلّحوه ببلاش. وإذا التصليح مش ممكن، بدي آخد لابتوب جديد.\n\nفيكم تتواصلوا معي بالإيميل أو عالرقم 079 123 45 67، أحسن شي بعد الضهر.\n\nبانتظار ردكم.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановні пані та панове,\n\nхочу повідомити вам, що три місяці тому купив у вас новий ноутбук. На жаль, тепер він зламався: він більше не вмикається. Я кілька разів телефонував вам, але ні до кого не додзвонився.\n\nНа ноутбук два роки гарантії, тож гарантія ще діє. Тому прошу вас безкоштовно його відремонтувати. Якщо ремонт неможливий, я хотів би отримати новий ноутбук.\n\nЗі мною можна зв'язатися електронною поштою або за номером 079 123 45 67, найкраще після обіду.\n\nЧекаю на вашу відповідь.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın yetkililer,\n\nüç ay önce sizden yeni bir dizüstü bilgisayar aldığımı bildirmek istiyorum. Maalesef bilgisayar şimdi bozuk: Artık açılmıyor. Sizi birkaç kez aradım ama kimseye ulaşamadım.\n\nBilgisayarın iki yıl garantisi var, yani hâlâ garanti süresi içinde. Bu yüzden onu ücretsiz tamir etmenizi rica ediyorum. Tamir mümkün değilse, yeni bir bilgisayar almak istiyorum.\n\nBana e-postayla veya 079 123 45 67 numarasından, en iyi öğleden sonra ulaşabilirsiniz.\n\nCevabınızı bekliyorum.\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Sir or Madam,\n\nI would like to inform you that I bought a new laptop from you three months ago. Unfortunately, the laptop is now broken: it no longer switches on. I called you several times but couldn't reach anyone.\n\nThe laptop has a two-year warranty, so it is still under warranty. I would therefore like to ask you to repair it free of charge. If a repair is not possible, I would like to receive a new laptop.\n\nYou can reach me by email or on 079 123 45 67, ideally in the afternoon.\n\nI look forward to your reply.\n\nKind regards\nMuayad Jamal"}},

{id:"absage", formal:true, groups:["anrede_f","entschuldigung","vorschlag","bitte","schluss","gruss"],
 t:{de:"Termin absagen und verschieben",ar:"إلغاء موعد وتأجيله",uk:"Скасувати й перенести прийом",tr:"Randevu iptali ve erteleme",en:"Cancelling and moving an appointment"},
 task:{de:"Sie haben morgen um 9 Uhr einen Termin bei Ihrer Ärztin, Frau Dr. Keller. Sie können nicht kommen. Schreiben Sie eine E-Mail an die Praxis.",
  ar:"عندك بكرا الساعة 9 موعد عند دكتورتك، الدكتورة كيلر. ما بتقدر تروح. اكتب إيميل للعيادة.",
  uk:"Завтра о 9:00 у вас прийом у вашої лікарки, доктора Келлер. Ви не можете прийти. Напишіть e-mail до кабінету.",

  en:"You have an appointment with your doctor, Dr Keller, tomorrow at 9. You can't go. Write an email to the practice."},
 points:[
  {de:"Sich entschuldigen",ar:"تعتذر",uk:"Вибачитися",tr:"Özür dilemek",en:"Apologise"},
  {de:"Grund nennen",ar:"تذكر السبب",uk:"Назвати причину",tr:"Nedeni belirtmek",en:"Give the reason"},
  {de:"Neuen Termin vorschlagen",ar:"تقترح موعد جديد",uk:"Запропонувати новий час",tr:"Yeni randevu önermek",en:"Suggest a new appointment"},
  {de:"Um Antwort bitten",ar:"تطلب رد",uk:"Попросити відповісти",tr:"Cevap istemek",en:"Ask for a reply"}],
 sample:"Sehr geehrte Frau Dr. Keller,\n\nleider kann ich morgen um 9 Uhr nicht zu meinem Termin kommen, weil ich kurzfristig arbeiten muss. Es tut mir sehr leid.\n\nKönnten wir einen neuen Termin vereinbaren? Ich hätte am Donnerstag oder am Freitag Zeit, am besten am Vormittag.\n\nBitte geben Sie mir kurz Bescheid, ob das möglich ist.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"الدكتورة كيلر المحترمة،\n\nللأسف ما بقدر إجي بكرا الساعة 9 على موعدي، لأنه لازم اشتغل بشكل مفاجئ. آسف كتير.\n\nفينا نحدد موعد جديد؟ بيكون عندي وقت يوم الخميس أو الجمعة، أحسن شي قبل الضهر.\n\nخبّروني لو سمحتوا إذا هاد ممكن.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановна пані докторко Келлер,\n\nна жаль, я не зможу прийти завтра о 9:00 на прийом, бо мені терміново треба працювати. Мені дуже шкода.\n\nЧи могли б ми домовитися про новий час? Я маю час у четвер або в п'ятницю, найкраще зранку.\n\nБудь ласка, повідомте мені, чи це можливо.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın Dr. Keller,\n\nmaalesef yarın saat 9'daki randevuma gelemeyeceğim, çünkü kısa süre önce çalışmam gerektiği ortaya çıktı. Çok üzgünüm.\n\nYeni bir randevu ayarlayabilir miyiz? Perşembe veya cuma günü vaktim var, en iyisi öğleden önce.\n\nBunun mümkün olup olmadığını bana kısaca bildirir misiniz?\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Dr Keller,\n\nunfortunately I can't come to my appointment tomorrow at 9 because I have to work at short notice. I am very sorry.\n\nCould we arrange a new appointment? I would have time on Thursday or Friday, ideally in the morning.\n\nPlease let me know whether that is possible.\n\nKind regards\nMuayad Jamal"}},

  {de:"Fragen, was Sie mitbringen können",ar:"تسأل شو فيك تجيب معك",uk:"Запитати, що принести",tr:"Ne getirebileceğinizi sormak",en:"Ask what you can bring"},
  {de:"Sagen, dass Sie später kommen",ar:"تقول إنك رح تتأخر شوي",uk:"Сказати, що прийдете пізніше",tr:"Biraz geç geleceğinizi söylemek",en:"Say that you'll come later"}],
 sample:"Liebe Sara,\n\nvielen Dank für deine Einladung! Ich komme sehr gern zu deiner Party am Samstag.\n\nSoll ich etwas mitbringen? Ich könnte zum Beispiel einen Salat oder einen Kuchen machen.\n\nLeider muss ich bis 18 Uhr arbeiten, deshalb komme ich etwas später, so gegen 19 Uhr.\n\nIch freue mich schon sehr!\n\nLiebe Grüße\nMuayad",
 sampleT:{
  ar:"عزيزتي سارة،\n\nشكراً كتير على عزيمتك! أكيد رح إجي على حفلتك يوم السبت.\n\nبدّك جيب شي معي؟ مثلاً بقدر أعمل سلطة أو كيكة.\n\nللأسف لازم اشتغل لحد الساعة 6، لهيك رح إجي متأخر شوي، تقريباً الساعة 7.\n\nمتحمّس كتير!\n\nسلامات\nمؤيد",
  uk:"Люба Саро,\n\nдуже дякую за запрошення! Я з радістю прийду на твою вечірку в суботу.\n\nМені щось принести? Наприклад, я міг би зробити салат або спекти пиріг.\n\nНа жаль, я працюю до 18:00, тому прийду трохи пізніше, десь о 19:00.\n\nДуже чекаю!\n\nОбіймаю\nМуаяд",
  tr:"Sevgili Sara,\n\ndavetin için çok teşekkürler! Cumartesi günkü partine seve seve geleceğim.\n\nBir şey getireyim mi? Örneğin bir salata ya da kek yapabilirim.\n\nMaalesef saat 18'e kadar çalışmam gerekiyor, bu yüzden biraz geç geleceğim, saat 19 gibi.\n\nŞimdiden çok heyecanlıyım!\n\nSevgiler\nMuayad",
  en:"Dear Sara,\n\nthank you very much for your invitation! I'd love to come to your party on Saturday.\n\nShall I bring something? I could make a salad or a cake, for example.\n\nUnfortunately I have to work until 6 pm, so I'll come a bit later, around 7.\n\nI'm really looking forward to it!\n\nLove\nMuayad"}},

{id:"information", formal:true, groups:["anrede_f","einleitung","bitte","schluss","gruss"],
 t:{de:"Bitte um Informationen: Deutschkurs",ar:"طلب معلومات: كورس ألماني",uk:"Запит інформації: курс німецької",tr:"Bilgi isteme: Almanca kursu",en:"Asking for information: German course"},
 task:{de:"Sie möchten einen Deutschkurs B1 besuchen. Schreiben Sie eine E-Mail an die Sprachschule.",
  ar:"بدك تسجّل بكورس ألماني B1. اكتب إيميل لمدرسة اللغة.",
  uk:"Ви хочете відвідувати курс німецької B1. Напишіть e-mail до мовної школи.",
  tr:"B1 seviyesinde bir Almanca kursuna katılmak istiyorsunuz. Dil okuluna bir e-posta yazın.",
  en:"You want to attend a B1 German course. Write an email to the language school."},
 points:[
  {de:"Sich kurz vorstellen",ar:"تعرّف عن حالك باختصار",uk:"Коротко представитися",tr:"Kendinizi kısaca tanıtmak",en:"Briefly introduce yourself"},
  {de:"Nach den Kurszeiten fragen",ar:"تسأل عن أوقات الكورس",uk:"Запитати про розклад",tr:"Kurs saatlerini sormak",en:"Ask about course times"},
  {de:"Nach dem Preis fragen",ar:"تسأل عن السعر",uk:"Запитати про ціну",tr:"Fiyatı sormak",en:"Ask about the price"},
  {de:"Nach der Prüfung fragen",ar:"تسأل عن الامتحان",uk:"Запитати про іспит",tr:"Sınavı sormak",en:"Ask about the exam"}],
 sample:"Sehr geehrte Damen und Herren,\n\nmein Name ist Muayad Jamal und ich wohne seit einem Jahr in der Schweiz. Ich habe Ihre Anzeige im Internet gelesen und interessiere mich für Ihren Deutschkurs B1.\n\nKönnten Sie mir bitte sagen, an welchen Tagen und um wie viel Uhr der Kurs stattfindet? Ich arbeite tagsüber, deshalb wäre ein Abendkurs ideal für mich.\n\nAußerdem möchte ich wissen, wie viel der Kurs kostet und ob man am Ende eine Prüfung machen kann.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"حضرات السيدات والسادة،\n\nاسمي مؤيد جمال وساكن بسويسرا من سنة. قريت إعلانكم عالإنترنت وأنا مهتم بكورس الألماني B1 عندكم.\n\nممكن تقولولي بأي أيام وأي ساعة الكورس؟ أنا بشتغل بالنهار، لهيك كورس بالمسا بيكون مثالي إلي.\n\nوكمان بدي اعرف قديش سعر الكورس وإذا فيني اعمل امتحان بالآخر.\n\nشكراً سلفاً.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановні пані та панове,\n\nмене звати Муаяд Джамаль, я живу у Швейцарії вже рік. Я прочитав ваше оголошення в інтернеті й цікавлюся вашим курсом німецької B1.\n\nЧи не могли б ви сказати, в які дні та о котрій годині відбувається курс? Я працюю вдень, тому вечірній курс був би для мене ідеальним.\n\nКрім того, я хотів би знати, скільки коштує курс і чи можна в кінці скласти іспит.\n\nЗаздалегідь дякую.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın yetkililer,\n\nadım Muayad Jamal, bir yıldır İsviçre'de yaşıyorum. İnternetteki ilanınızı okudum ve B1 Almanca kursunuzla ilgileniyorum.\n\nKursun hangi günlerde ve saat kaçta yapıldığını söyleyebilir misiniz lütfen? Gündüz çalışıyorum, bu yüzden akşam kursu benim için ideal olur.\n\nAyrıca kursun ne kadar olduğunu ve sonunda sınava girilip girilemeyeceğini öğrenmek istiyorum.\n\nŞimdiden teşekkür ederim.\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Sir or Madam,\n\nmy name is Muayad Jamal and I have been living in Switzerland for a year. I read your advertisement online and I am interested in your B1 German course.\n\nCould you please tell me on which days and at what time the course takes place? I work during the day, so an evening course would be ideal for me.\n\nI would also like to know how much the course costs and whether you can take an exam at the end.\n\nThank you in advance.\n\nKind regards\nMuayad Jamal"}},

{id:"vermieter", formal:true, groups:["anrede_f","problem","bitte","erreichbar","schluss","gruss"],
 t:{de:"Nachricht an den Vermieter: Heizung kaputt",ar:"رسالة لصاحب البيت: التدفئة خربانة",uk:"Лист орендодавцю: не працює опалення",tr:"Ev sahibine mesaj: Kalorifer bozuk",en:"Message to the landlord: heating broken"},
 task:{de:"In Ihrer Wohnung funktioniert die Heizung seit drei Tagen nicht. Schreiben Sie eine E-Mail an Ihren Vermieter, Herrn Keller.",
  ar:"التدفئة بشقتك ما عم تشتغل من 3 أيام. اكتب إيميل لصاحب البيت، السيد كيلر.",
  uk:"У вашій квартирі вже три дні не працює опалення. Напишіть e-mail своєму орендодавцю, пану Келлеру.",
  tr:"Dairenizde kalorifer üç gündür çalışmıyor. Ev sahibiniz Bay Keller'e bir e-posta yazın.",
  en:"The heating in your flat hasn't worked for three days. Write an email to your landlord, Mr Keller."},
 points:[
  {de:"Problem beschreiben",ar:"توصف المشكلة",uk:"Описати проблему",tr:"Sorunu anlatmak",en:"Describe the problem"},
  {de:"Seit wann?",ar:"من إيمتى؟",uk:"Відколи?",tr:"Ne zamandan beri?",en:"Since when?"},
  {de:"Um schnelle Reparatur bitten",ar:"تطلب تصليح سريع",uk:"Попросити швидко відремонтувати",tr:"Hızlı tamir rica etmek",en:"Ask for a quick repair"},
  {de:"Sagen, wann Sie zu Hause sind",ar:"تقول إيمتى بتكون بالبيت",uk:"Сказати, коли ви вдома",tr:"Ne zaman evde olduğunuzu söylemek",en:"Say when you are at home"}],
 sample:"Sehr geehrter Herr Keller,\n\nich wohne in der Wohnung im 2. Stock an der Bahnhofstrasse 12. Leider funktioniert die Heizung seit drei Tagen nicht mehr. Es ist sehr kalt in der Wohnung, besonders in der Nacht.\n\nIch möchte Sie bitten, die Heizung so schnell wie möglich reparieren zu lassen.\n\nIch bin jeden Tag ab 17 Uhr zu Hause, am Samstag den ganzen Tag. Sie erreichen mich unter der Nummer 079 123 45 67.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"السيد كيلر المحترم،\n\nأنا ساكن بالشقة بالطابق التاني بشارع Bahnhofstrasse رقم 12. للأسف التدفئة ما عم تشتغل من 3 أيام. الشقة باردة كتير، خصوصاً بالليل.\n\nبطلب منك تبعت حدا يصلّح التدفئة بأسرع وقت.\n\nأنا بالبيت كل يوم من الساعة 5 المسا، ويوم السبت طول النهار. فيك تتصل فيي عالرقم 079 123 45 67.\n\nشكراً سلفاً.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановний пане Келлер,\n\nя живу в квартирі на 2-му поверсі на Bahnhofstrasse, 12. На жаль, уже три дні не працює опалення. У квартирі дуже холодно, особливо вночі.\n\nПрошу вас якнайшвидше організувати ремонт опалення.\n\nЯ щодня вдома з 17:00, а в суботу — цілий день. Зі мною можна зв'язатися за номером 079 123 45 67.\n\nЗаздалегідь дякую.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın Bay Keller,\n\nBahnhofstrasse 12 numarada, 2. kattaki dairede oturuyorum. Maalesef kalorifer üç gündür çalışmıyor. Daire çok soğuk, özellikle geceleri.\n\nKaloriferi mümkün olan en kısa sürede tamir ettirmenizi rica ediyorum.\n\nHer gün saat 17'den sonra evdeyim, cumartesi ise bütün gün. Bana 079 123 45 67 numarasından ulaşabilirsiniz.\n\nŞimdiden teşekkür ederim.\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Mr Keller,\n\nI live in the flat on the 2nd floor at Bahnhofstrasse 12. Unfortunately, the heating hasn't worked for three days. It is very cold in the flat, especially at night.\n\nI would like to ask you to have the heating repaired as quickly as possible.\n\nI am at home every day from 5 pm, and all day on Saturday. You can reach me on 079 123 45 67.\n\nThank you in advance.\n\nKind regards\nMuayad Jamal"}},

{id:"meinung", formal:false, groups:["meinung"],
 t:{de:"Meinung im Forum: Smart Home",ar:"رأيك بالمنتدى: البيت الذكي",uk:"Думка на форумі: розумний будинок",tr:"Forumda görüş: Akıllı ev",en:"Forum opinion: smart homes"},
 task:{de:"Im Forum wird diskutiert: «Smart Home – ist das eine gute Idee?» Schreiben Sie Ihre Meinung (ca. 80 Wörter).",
  ar:"بالمنتدى عم يناقشوا: «البيت الذكي، فكرة منيحة؟» اكتب رأيك (حوالي 80 كلمة).",
  uk:"На форумі обговорюють: «Розумний будинок — це добра ідея?» Напишіть свою думку (близько 80 слів).",
  tr:"Forumda tartışılıyor: «Akıllı ev iyi bir fikir mi?» Görüşünüzü yazın (yaklaşık 80 kelime).",
  en:"A forum is discussing: 'Smart homes – a good idea?' Write your opinion (about 80 words)."},
 points:[
  {de:"Ihre Meinung",ar:"رأيك",uk:"Ваша думка",tr:"Görüşünüz",en:"Your opinion"},
  {de:"Ein Vorteil",ar:"إيجابية وحدة",uk:"Одна перевага",tr:"Bir avantaj",en:"One advantage"},
  {de:"Ein Nachteil",ar:"سلبية وحدة",uk:"Один недолік",tr:"Bir dezavantaj",en:"One disadvantage"},
  {de:"Ein Beispiel oder Ihre Erfahrung",ar:"مثال أو تجربتك",uk:"Приклад або ваш досвід",tr:"Bir örnek ya da deneyiminiz",en:"An example or your experience"}],
 sample:"Ich finde Smart Homes interessant, aber ich bin auch skeptisch.\n\nEinerseits ist die Technik sehr praktisch. Man kann zum Beispiel die Heizung per Handy steuern und so Energie sparen.\n\nAndererseits sind die Geräte oft teuer. Außerdem mache ich mir Sorgen um meine Daten, denn ich weiß nicht, wer sie bekommt.\n\nMeiner Meinung nach braucht man nicht so viel Technik, um gemütlich zu wohnen. Deshalb würde ich nur ein paar smarte Geräte kaufen.",
 sampleT:{
  ar:"بلاقي البيوت الذكية شي مثير للاهتمام، بس عندي شكوك كمان.\n\nمن جهة، التكنولوجيا عملية كتير. مثلاً فيك تتحكّم بالتدفئة بالموبايل وهيك بتوفّر طاقة.\n\nومن جهة تانية، الأجهزة غالباً غالية. وكمان أنا قلقان على بياناتي، لأني ما بعرف مين بياخدها.\n\nبرأيي ما بيلزم هالقد تكنولوجيا لتعيش براحة. لهيك كنت رح اشتري بس كم جهاز ذكي.",
  uk:"Я вважаю розумні будинки цікавими, але ставлюся до них і скептично.\n\nЗ одного боку, техніка дуже практична. Наприклад, можна керувати опаленням через телефон і так економити енергію.\n\nЗ іншого боку, пристрої часто дорогі. Крім того, я хвилююся за свої дані, бо не знаю, хто їх отримує.\n\nНа мою думку, щоб жити затишно, не потрібно стільки техніки. Тому я купив би лише кілька розумних пристроїв.",
  tr:"Akıllı evleri ilginç buluyorum, ama biraz da şüpheliyim.\n\nBir yandan teknoloji çok pratik. Örneğin kaloriferi telefonla kontrol edip böylece enerji tasarrufu yapabilirsiniz.\n\nÖte yandan cihazlar genellikle pahalı. Ayrıca verilerim konusunda endişeleniyorum, çünkü onları kimin aldığını bilmiyorum.\n\nBence rahat yaşamak için bu kadar teknolojiye gerek yok. Bu yüzden sadece birkaç akıllı cihaz alırdım.",
  en:"I find smart homes interesting, but I'm also sceptical.\n\nOn the one hand, the technology is very practical. For example, you can control the heating with your phone and save energy that way.\n\nOn the other hand, the devices are often expensive. I'm also worried about my data, because I don't know who gets it.\n\nIn my opinion you don't need so much technology to live comfortably. That's why I would only buy a few smart devices."}}
];

  {type:"rf", title:"Lesen 1", head:"Ein neues Leben in Bern",
   text:"Hallo zusammen! Vor einem Jahr bin ich mit meinem Mann und unseren zwei Kindern von Damaskus nach Bern gezogen. Am Anfang war alles sehr schwierig: Wir haben kaum Deutsch gesprochen und kannten niemanden. Zum Glück hat uns unsere Nachbarin, Frau Keller, viel geholfen. Sie hat uns gezeigt, wie man den Müll trennt und wo man günstig einkaufen kann.\n\nNach drei Monaten habe ich mit einem Deutschkurs angefangen. Der Kurs findet viermal pro Woche am Vormittag statt, deshalb kann ich ihn besuchen, während die Kinder in der Schule sind. Mein Mann arbeitet in einer Bäckerei und hat leider keine Zeit für einen Kurs. Er lernt abends mit einer App.\n\nInzwischen fühlen wir uns hier wohl. Die Kinder sprechen schon besser Deutsch als wir und korrigieren uns oft – das finden sie natürlich lustig. Mein nächstes Ziel ist die B1-Prüfung im Frühling. Danach möchte ich eine Ausbildung als Pflegefachfrau machen.\n\nSamira",

    ["Hallo Karim, hier ist Sandra. Ich kann heute Abend leider nicht ins Kino kommen, mein Sohn ist krank. Können wir am Freitag gehen?","Warum kommt Sandra nicht ins Kino?",["Ihr Sohn ist krank.","Sie muss arbeiten.","Das Kino ist geschlossen."]],

   tr:{ar:"زميلك بالشغل ماركو (بتحكي معه بـ du) عم يغيّر شغله وينتقل على مدينة تانية. عزمك بإيميل على حفلة الوداع يوم الجمعة بالليل، وإنت ما فيك تروح. رد على ماركو بإيميل.",uk:"Ваш колега Марко (ви з ним на «ти») змінює роботу й переїжджає в інше місто. Він запросив вас листом на прощальну вечірку в п’ятницю ввечері. Ви не можете прийти. Дайте Марко відповідь листом.",tr:"İş arkadaşınız Marco (onunla «du» diye konuşuyorsunuz) iş değiştiriyor ve başka bir şehre taşınıyor. Sizi e-postayla cuma akşamki veda partisine davet etti. Gelemiyorsunuz. Marco'ya e-postayla cevap verin.",en:"Your colleague Marco (you use “du” with him) is changing jobs and moving to another city. He invited you by email to his farewell party on Friday evening. You can't come. Reply to Marco by email."},

  {type:"rf", title:"Lesen 1", head:"Mein Arbeitstag als Velokurier",
   text:"Ich heiße Jonas, bin 27 Jahre alt und arbeite seit zwei Jahren als Velokurier in Zürich. Mein Arbeitstag beginnt um halb acht. Zuerst hole ich in der Zentrale mein Handy und die Liste mit den Aufträgen ab. Meistens bringe ich Dokumente zu Anwälten und Banken, manchmal auch Medikamente zu Apotheken.\n\nBei schönem Wetter liebe ich meinen Job: Ich bin den ganzen Tag draußen und brauche kein Fitnessstudio. Im Winter ist es aber oft hart, besonders wenn es schneit. Dann fahre ich langsamer, weil die Straßen gefährlich sind.\n\nDer Lohn ist nicht besonders hoch, aber ich kann meine Arbeitszeit selbst planen. Am Mittwoch arbeite ich nie, denn an diesem Tag studiere ich Informatik an einer Fernhochschule. In zwei Jahren möchte ich mein Studium abschließen und als Programmierer arbeiten.",

  {type:"mc", title:"Lesen 2", head:"Neue Regeln für die Waschküche",
   text:"Liebe Mieterinnen und Mieter,\n\nab dem 1. November gelten in unserem Haus neue Regeln für die Waschküche. Jede Wohnung hat einen festen Waschtag. Den Plan finden Sie ab sofort im Eingang neben den Briefkästen. Wer an einem anderen Tag waschen möchte, muss sich vorher in die Liste an der Tür der Waschküche eintragen.\n\nBitte reinigen Sie nach dem Waschen die Maschine und das Sieb. Zwischen 22 und 7 Uhr darf die Waschküche nicht benutzt werden, damit die Nachbarn nicht gestört werden. Wenn eine Maschine kaputt ist, melden Sie das bitte sofort dem Hauswart, Herrn Gashi.\n\nVielen Dank für Ihr Verständnis!\nIhre Hausverwaltung",

  {type:"gap", title:"Sprachbausteine",
   text:"Sehr geehrte Damen und Herren,\n\nich habe Ihre Anzeige im Internet gelesen und interessiere mich {1} den Deutschkurs B1. Ich lebe seit acht Monaten in Basel und möchte mein Deutsch verbessern, {2} ich eine Stelle als Verkäuferin suche.\n\nKönnten Sie mir bitte sagen, {3} der Kurs genau beginnt? Ich arbeite am Vormittag, {4} kann ich nur am Abend kommen. Außerdem möchte ich wissen, {5} viel der Kurs kostet.\n\nIch {6} mich gern auch für die Prüfung am Ende des Kurses anmelden. Ist es möglich, die Prüfung direkt in Ihrer Schule {7} machen? {8} Sie noch Informationen von mir brauchen, schreiben Sie mir bitte.\n\nVielen Dank {9} Voraus.\n\nMit freundlichen {10}\nElif Yilmaz",

  {type:"listen", title:"Hören",

    ["Hallo, hier ist Ahmed von der Firma Sauber. Ich komme morgen nicht um 8, sondern erst um 11 Uhr, um die Fenster zu putzen. Ist das in Ordnung?","Wann kommt Ahmed morgen?",["um 11 Uhr","um 8 Uhr","um 10 Uhr"]],
    ["Willkommen im Hallenbad! Heute ist das große Becken wegen Reinigung geschlossen. Das Kinderbecken und die Sauna sind normal geöffnet.","Was ist heute geschlossen?",["das große Becken","die Sauna","das Kinderbecken"]],
    ["Hier ist das Einwohneramt. Für Ihren neuen Ausweis brauchen wir noch ein aktuelles Foto. Bitte bringen Sie es bis Ende der Woche vorbei.","Was fehlt noch für den Ausweis?",["ein Foto","eine Unterschrift","eine Gebühr"]],
    ["Hallo Maria, ich bin's, Tom. Ich stehe gerade im Supermarkt. Brauchen wir noch Milch? Und soll ich Brot kaufen oder hast du schon welches?","Wo ist Tom gerade?",["im Supermarkt","zu Hause","in der Bäckerei"]]]},

{

  {type:"rf", title:"Lesen 1", head:"Zurück in die Ausbildung – mit 38",
   text:"Vor sechs Jahren bin ich mit meiner Familie aus Syrien in die Schweiz gekommen. In meiner Heimat war ich Elektriker und hatte ein eigenes kleines Geschäft. Hier wurde mein Diplom leider nicht anerkannt. Deshalb habe ich zuerst in einem Lager gearbeitet und Pakete sortiert. Die Arbeit war körperlich anstrengend, aber ich war froh, dass ich überhaupt eine Stelle hatte und meine Familie nicht vom Sozialamt abhängig war.\n\nMein Chef im Lager hat bald gemerkt, dass ich mich mit Technik gut auskenne. Wenn eine Maschine kaputt war, hat er oft mich gerufen. Eines Tages hat er mich gefragt, warum ich nicht als Elektriker arbeite. Ich habe ihm erklärt, dass ich dafür einen Schweizer Abschluss brauche. Er hat mir dann von der Möglichkeit erzählt, eine verkürzte Lehre für Erwachsene zu machen.\n\nAm Anfang hatte ich große Zweifel. Ich bin 38 Jahre alt und sitze jetzt zwei Tage pro Woche mit 17-Jährigen in der Berufsschule. Die Theorie war nicht das Problem, aber die Fachwörter auf Deutsch waren sehr schwierig. Ich habe mir für jedes neue Wort eine Karteikarte gemacht und jeden Abend eine halbe Stunde gelernt. Meine Frau hat mich dabei immer unterstützt, obwohl sie selbst Teilzeit arbeitet und sich um die Kinder kümmert.\n\nInzwischen bin ich im zweiten Lehrjahr. Die jungen Kollegen in der Klasse fragen mich oft um Rat, wenn sie bei der praktischen Arbeit nicht weiterwissen. Das macht mich stolz. Natürlich verdiene ich während der Lehre weniger als im Lager, aber mein Arbeitgeber zahlt mir einen Teil meines alten Lohns weiter. Nächsten Sommer habe ich die Abschlussprüfung. Mein Ziel ist es, in einigen Jahren wieder ein eigenes Geschäft zu eröffnen – diesmal in der Schweiz.\n\nTarek",
   items:[
    ["Tarek konnte in der Schweiz sofort als Elektriker arbeiten.",false],
    ["Tarek war froh über die Stelle im Lager, weil er selbst Geld verdient hat.",true],
    ["Die Idee mit der Lehre kam von Tareks Chef.",true],
    ["In der Berufsschule hatte Tarek vor allem mit der Theorie Probleme.",false],
    ["Die jüngeren Mitschüler fragen Tarek bei der praktischen Arbeit um Hilfe.",true],
    ["Während der Lehre verdient Tarek gleich viel wie früher im Lager.",false]]},
  {type:"mc", title:"Lesen 2", head:"Gärtnern mitten in der Stadt",
   text:"Wer in der Stadt wohnt, hat meistens keinen eigenen Garten. Trotzdem wollen immer mehr Menschen ihr eigenes Gemüse anbauen. In vielen Schweizer Städten gibt es deshalb sogenannte Gemeinschaftsgärten: Flächen, die von mehreren Personen oder Familien zusammen bewirtschaftet werden.\n\nEiner dieser Gärten liegt in Basel, direkt neben einem ehemaligen Güterbahnhof. Vor fünf Jahren war hier nur eine leere Fläche aus Beton. Heute wachsen auf rund 2000 Quadratmetern Tomaten, Salat, Kräuter und sogar Kartoffeln. Etwa 80 Personen aus 25 Ländern machen mit. «Viele kommen nicht nur wegen des Gemüses», erzählt die Projektleiterin Sandra Frei. «Für manche ist der Garten der einzige Ort, wo sie regelmäßig Kontakt zu ihren Nachbarn haben.» Besonders für ältere Menschen, die allein leben, und für neu zugezogene Familien sei das wichtig.\n\nWer mitmachen möchte, braucht keine Erfahrung. Jedes neue Mitglied bekommt in den ersten Wochen eine Patin oder einen Paten, die oder der die wichtigsten Arbeiten erklärt. Pro Jahr zahlt man einen Beitrag von 60 Franken; Werkzeuge, Samen und Wasser sind inklusive. Außerdem muss jedes Mitglied pro Monat mindestens vier Stunden bei gemeinsamen Arbeiten helfen, zum Beispiel beim Kompost oder beim Reparieren der Wege.\n\nNicht alle Anwohner waren am Anfang begeistert. Einige hatten Angst vor Lärm und Unordnung. Inzwischen hat sich die Situation beruhigt: Der Garten schließt um 21 Uhr, und einmal im Jahr lädt das Team die ganze Nachbarschaft zu einem Erntefest ein. Die Stadt unterstützt das Projekt seit letztem Jahr finanziell. Ganz sicher ist die Zukunft aber nicht: Auf dem Gelände sollen in sieben Jahren neue Wohnungen gebaut werden. Frau Frei hofft, dass der Garten dann einen neuen Platz in der Nähe bekommt.",
   items:[
    ["Was war vor fünf Jahren an der Stelle des Gartens?",["eine leere Fläche aus Beton","ein Parkhaus","ein privater Garten"]],
    ["Warum kommen laut Sandra Frei viele Leute in den Garten?",["Sie suchen Kontakt zu anderen Menschen.","Sie können dort billig Gemüse kaufen.","Sie finden dort eine bezahlte Arbeit."]],
    ["Was bekommen neue Mitglieder?",["eine Person, die ihnen am Anfang hilft","Werkzeuge für ihren Garten zu Hause","einen Gartenkurs bei der Stadt"]],

  {type:"gap", title:"Sprachbausteine",
   text:"Sehr geehrte Damen und Herren,\n\nich habe Ihre Anzeige im «Stadtanzeiger» gelesen und interessiere mich {1} den Deutschkurs B1 am Abend. Leider steht in der Anzeige nicht, {2} der Kurs genau beginnt. Könnten Sie mir {3} sagen, wie viele Personen in einer Gruppe sind?\n\nIch arbeite in einem Restaurant und habe nur am Montag und Dienstag frei. {4} wäre ein Kurs an diesen Tagen ideal für mich. Ich habe schon einen A2-Kurs besucht, {5} habe ich noch Probleme mit der Grammatik. {6} meiner Arbeit spreche ich zwar viel Deutsch, aber meistens nur kurze Sätze.\n\nAußerdem möchte ich wissen, {7} man den Kurs in Raten bezahlen kann. Der Kurs kostet 890 Franken, und das ist für mich zu viel Geld {8} einmal. Gibt es vielleicht eine Ermäßigung für Personen, {9} wenig verdienen?\n\nIch {10} mich sehr über eine baldige Antwort freuen. Sie erreichen mich jeden Tag {11} 9 und 11 Uhr unter der Nummer 079 345 12 89. Vielen Dank {12} Voraus.\n\nFreundliche Grüße\nAmina Rahimi",

  {type:"listen", title:"Hören 1",
   items:[
    ["Liebe Fahrgäste, wegen Bauarbeiten zwischen Olten und Aarau fallen heute ab 20 Uhr alle Züge auf dieser Strecke aus. Bitte benutzen Sie die Ersatzbusse. Diese fahren direkt vor dem Bahnhofgebäude ab, auf der Seite der Post. Rechnen Sie mit etwa 25 Minuten längerer Fahrzeit. Fahrgäste in Richtung Bern sind nicht betroffen.","Was sollen Fahrgäste nach Aarau ab 20 Uhr tun?",["den Bus vor dem Bahnhof nehmen","über Zürich fahren","25 Minuten am Gleis warten"]],
    ["Grüezi Frau Lopez, hier spricht Herr Wenger von der Garage Central. Ihr Auto ist fertig, wir haben die Bremsen gewechselt. Leider mussten wir auch die Batterie ersetzen, deshalb wird die Rechnung etwas höher als besprochen: ungefähr 480 statt 350 Franken. Sie können das Auto heute bis 18 Uhr oder morgen ab 7 Uhr abholen. Am Samstag haben wir geschlossen.","Warum kostet die Reparatur mehr als geplant?",["Die Batterie musste auch ersetzt werden.","Die Bremsen waren teurer als gedacht.","Das Auto musste länger in der Garage bleiben."]],
    ["Und nun eine Information für alle Eltern: Ab dem neuen Schuljahr können Kinder in der Stadt Luzern auch am Mittwochnachmittag in der Tagesschule betreut werden. Bisher war das nur am Montag, Dienstag und Donnerstag möglich. Die Anmeldung ist ab sofort online möglich, spätestens aber bis Ende Mai. Die Kosten hängen vom Einkommen der Eltern ab.","Was ist neu?",["Die Kinder können auch am Mittwochnachmittag betreut werden.","Die Betreuung in der Tagesschule ist jetzt gratis.","Man kann sich nur noch online anmelden."]],
    ["Sehr geehrte Kundinnen und Kunden, wegen eines technischen Problems können Sie an den Kassen 3 bis 6 im Moment nur bar bezahlen. An den Kassen 1 und 2 und an den Self-Checkout-Kassen funktioniert die Kartenzahlung normal. Wir entschuldigen uns für die Unannehmlichkeiten.","Wo kann man im Moment mit Karte bezahlen?",["an den Kassen 1 und 2","an den Kassen 3 bis 6","nur an der Information"]],
    ["Hoi Daniel, hier ist Mirjam. Du, wegen Samstag: Das Grillfest findet auf jeden Fall statt, auch wenn das Wetter schlecht ist – dann sitzen wir einfach in der Garage. Könntest du statt Salat lieber Getränke mitbringen? Salat haben wir schon genug, Lea bringt zwei Schüsseln. Und komm doch schon um fünf statt um sechs, dann kannst du Marco beim Aufbauen helfen.","Was soll Daniel mitbringen?",["Getränke","Salat","einen Grill"]]]},
  {type:"listen", inst:"listen2", title:"Hören 2",
   items:[
    [[["A","Praxis Doktor Steiner, Imhof, guten Tag."],["B","Guten Tag, hier ist Yilmaz. Ich habe morgen um neun Uhr einen Termin, aber mein Sohn ist krank geworden und ich kann ihn nicht allein lassen."],["A","Möchten Sie den Termin verschieben? Ich hätte am Donnerstag um 16 Uhr oder nächste Woche am Montag um halb zehn etwas frei."],["B","Donnerstag ist schlecht, da arbeite ich bis 17 Uhr. Dann lieber Montag."],["A","Gut, dann Montag um 9 Uhr 30. Bringen Sie bitte Ihre neue Versicherungskarte mit."]],"Wann ist der neue Termin?",["am Montag um 9.30 Uhr","am Donnerstag um 16 Uhr","morgen um 9 Uhr"]],
    [[["A","Sag mal, gehst du am Freitag auch zum Teamessen?"],["B","Eigentlich schon, aber ich weiß noch nicht, wie ich danach nach Hause komme. Der letzte Bus fährt schon um elf."],["A","Ich fahre mit dem Auto. Ich kann dich mitnehmen, du wohnst ja fast auf meinem Weg."],["B","Echt? Das wäre super, vielen Dank!"]],"Wie kommt die Person B nach dem Essen nach Hause?",["Die Kollegin nimmt sie im Auto mit.","Sie nimmt den letzten Bus.","Sie fährt mit ihrem eigenen Auto."]],
    [[["A","Grüezi Herr Brunner, hier ist Khalil aus dem dritten Stock. In unserem Badezimmer tropft seit gestern Wasser von der Decke."],["B","Oh, das ist nicht gut. Wahrscheinlich ist das ein Problem in der Wohnung darüber. Ich rufe sofort den Sanitär an. Sind Sie heute Nachmittag zu Hause?"],["A","Ich nicht, aber meine Frau ist ab zwei Uhr da."],["B","Gut, dann sage ich dem Sanitär, dass er nach zwei Uhr kommen soll."]],"Wer ist am Nachmittag zu Hause, wenn der Sanitär kommt?",["die Frau von Herrn Khalil","Herr Khalil","Herr Brunner"]],
    [[["A","Guten Tag, ich möchte mich für den Kurs «Deutsch für den Beruf» anmelden."],["B","Gern. Der Kurs am Dienstagabend ist leider schon voll. Es gibt aber noch Plätze am Samstagvormittag."],["A","Samstag geht leider nicht, da arbeite ich. Gibt es eine Warteliste für Dienstag?"],["B","Ja, ich kann Sie auf die Warteliste setzen. Wenn jemand absagt, rufe ich Sie an."]],"Was passiert am Ende?",["Die Person kommt auf eine Warteliste.","Die Person meldet sich für Samstag an.","Die Person bekommt einen Platz am Dienstag."]]]},
  {type:"write", title:"Schreiben", min:80, reg:"Sie",
   task:"Sie haben bei einem Sportverein einen Schwimmkurs für Erwachsene gebucht und schon 180 Franken bezahlt. Jetzt hat Ihr Arbeitgeber Ihre Arbeitszeiten geändert und Sie können nicht mehr am Kurs teilnehmen. Schreiben Sie eine E-Mail an die Kursleiterin, Frau Hofer.",
   tr:{ar:"حجزت دورة سباحة للكبار بنادي رياضي ودفعت 180 فرنك. هلق شغلك غيّرلك أوقات الدوام وما عاد فيك تحضر الدورة. اكتب إيميل رسمي لمسؤولة الدورة، السيدة Hofer.",uk:"Ви записалися на курс плавання для дорослих у спортивному клубі й уже заплатили 180 франків. Тепер роботодавець змінив ваш графік, і ви не можете відвідувати курс. Напишіть офіційний лист керівниці курсу, пані Гофер.",tr:"Bir spor kulübünde yetişkinler için yüzme kursuna kaydoldunuz ve 180 frank ödediniz. Şimdi işvereniniz çalışma saatlerinizi değiştirdi ve kursa katılamıyorsunuz. Kurs sorumlusu Bayan Hofer'e resmi bir e-posta yazın.",en:"You booked a swimming course for adults at a sports club and have already paid 180 francs. Now your employer has changed your working hours and you can no longer attend. Write a formal email to the course leader, Ms Hofer."},
   points:["Warum schreiben Sie?","Warum können Sie nicht mehr teilnehmen?","Bitten Sie um die Rückzahlung des Geldes oder um einen Platz in einem anderen Kurs.","Wie und wann kann man Sie erreichen?"],

{
 id:"b1b", title:"Modelltest B1 – 2", level:"B1", minutes:100,
 parts:[
  {type:"rf", title:"Lesen 1", head:"Unser Leben ohne Auto",
   text:"Seit drei Jahren lebt unsere Familie ohne eigenes Auto. Als unser alter Wagen kaputtging, hätte die Reparatur über 3000 Franken gekostet. Mein Mann und ich haben lange diskutiert und dann beschlossen, es einfach einmal ein Jahr lang ohne Auto zu versuchen. Unsere Freunde haben gelacht und gesagt, dass wir es keine drei Monate schaffen.\n\nHeute können wir uns ein Leben mit Auto kaum noch vorstellen. Zur Arbeit fahre ich mit dem Velo, mein Mann nimmt den Zug. Die Kinder gehen zu Fuß zur Schule, was sie am Anfang gar nicht toll fanden. Für den Wocheneinkauf haben wir einen Veloanhänger gekauft. Wenn wir doch einmal ein Auto brauchen, zum Beispiel für einen Ausflug in die Berge oder um große Möbel zu transportieren, mieten wir eins bei einer Carsharing-Organisation. Das Auto steht nur fünf Minuten von unserer Wohnung entfernt und kann einfach mit dem Handy reserviert werden.\n\nNatürlich ist nicht alles perfekt. Im Winter, wenn es dunkel und kalt ist, vermisse ich das Auto manchmal. Und spontane Ausflüge sind schwieriger, weil das Carsharing-Auto am Wochenende oft schon reserviert ist. Wir planen jetzt einfach früher.\n\nAm meisten überrascht hat uns, wie viel Geld wir sparen. Früher haben wir für Versicherung, Benzin, Parkplatz und Reparaturen jedes Jahr fast 8000 Franken ausgegeben. Heute zahlen wir für Generalabonnement, Carsharing und ab und zu ein Taxi weniger als die Hälfte. Mit dem gesparten Geld sind wir letzten Sommer zum ersten Mal mit der ganzen Familie nach Portugal geflogen.\n\nKarin",
   items:[
    ["Die Familie hat das alte Auto nicht reparieren lassen, weil das zu teuer gewesen wäre.",true],
    ["Die Freunde fanden die Idee von Anfang an gut.",false],
    ["Die Kinder waren am Anfang nicht begeistert, zu Fuß zur Schule zu gehen.",true],
    ["Für Ausflüge leiht die Familie das Auto von Freunden.",false],
    ["Am Wochenende ist es nicht immer leicht, ein Carsharing-Auto zu bekommen.",true],
    ["Heute gibt die Familie für Mobilität ungefähr gleich viel Geld aus wie früher.",false]]},
  {type:"mc", title:"Lesen 2", head:"Essen retten statt wegwerfen",
   text:"In der Schweiz landen jedes Jahr rund 2,8 Millionen Tonnen Lebensmittel im Abfall. Das ist ungefähr ein Drittel aller Lebensmittel, die produziert werden. Ein großer Teil davon wird nicht in Restaurants oder Supermärkten weggeworfen, sondern in privaten Haushalten. Viele Menschen kaufen mehr, als sie brauchen, oder werfen Produkte weg, sobald das Datum auf der Packung abgelaufen ist.\n\nGegen dieses Problem kämpfen verschiedene Organisationen. Eine besonders erfolgreiche Idee ist eine App, mit der Bäckereien, Restaurants und Geschäfte am Ende des Tages übrig gebliebenes Essen günstig anbieten. Die Kundinnen und Kunden reservieren über die App eine sogenannte Überraschungstüte und holen sie zu einer bestimmten Zeit ab. Was genau in der Tüte ist, weiß man vorher nicht. Dafür bezahlt man meistens nur etwa ein Drittel des normalen Preises.\n\nDaniela Moser hat eine kleine Bäckerei in Winterthur und macht seit zwei Jahren mit. «Früher mussten wir jeden Abend Brot und Gebäck wegwerfen. Das hat mir jedes Mal wehgetan», sagt sie. Heute verkauft sie fast alles. Reich wird sie dadurch nicht, denn ein Teil des Geldes geht an die Firma, die die App betreibt. «Aber ich habe neue Kunden gewonnen. Viele kommen zuerst wegen der Tüte und später auch tagsüber.»\n\nFachleute betonen aber, dass Apps allein das Problem nicht lösen. Wichtig sei vor allem, zu Hause besser zu planen: eine Einkaufsliste schreiben, Reste einfrieren und Produkte nicht sofort wegwerfen, wenn das Mindesthaltbarkeitsdatum vorbei ist. «Viele Lebensmittel sind noch Tage oder sogar Wochen später gut», erklärt eine Sprecherin der Konsumentenorganisation. «Man sollte sie einfach anschauen, riechen und probieren.»",
   items:[
    ["Wo wird laut Text besonders viel Essen weggeworfen?",["in privaten Haushalten","vor allem in Restaurants","vor allem in Supermärkten"]],
    ["Was ist eine «Überraschungstüte»?",["Essen vom gleichen Tag, das man günstig kaufen kann","ein Geschenk für neue Kunden","eine Tüte mit Produkten aus dem Ausland"]],
    ["Was weiß man vor dem Abholen nicht?",["was in der Tüte ist","wann man die Tüte abholen kann","wie viel die Tüte kostet"]],
    ["Was sagt Daniela Moser über die App?",["Sie hat dadurch neue Kunden bekommen.","Sie verdient damit sehr viel Geld.","Sie muss jetzt mehr Brot backen."]],
    ["Was empfehlen die Fachleute?",["Lebensmittel nach Ablauf des Datums zuerst prüfen","nur noch mit einer App einkaufen","weniger frische Produkte kaufen"]]]},

  {type:"gap", title:"Sprachbausteine",
   text:"Sehr geehrte Frau Graf,\n\nich wohne {1} zwei Jahren in der Wohnung im ersten Stock an der Bahnhofstraße 12. Leider muss ich mich heute {2} ein Problem beschweren. Seit drei Wochen funktioniert die Heizung im Kinderzimmer nicht mehr richtig. Ich habe den Hauswart schon zweimal angerufen, {3} bis jetzt ist niemand gekommen.\n\nDas Zimmer ist nachts nur 15 Grad warm, {4} schläft meine Tochter jetzt im Wohnzimmer. Das ist keine Lösung, {5} sie hat dort keine Ruhe für ihre Hausaufgaben. Außerdem habe ich Angst, {6} sie krank wird.\n\nIch bitte Sie deshalb, das Problem so schnell {7} möglich zu lösen. Bitte teilen Sie mir mit, {8} ein Handwerker kommen kann. Ich bin von Montag bis Freitag ab 16 Uhr zu Hause. Wenn es nur am Vormittag geht, {9} ich auch meine Nachbarin bitten, die Tür zu öffnen.\n\nFalls die Reparatur länger dauert, möchte ich wissen, {10} ich für diese Zeit weniger Miete bezahlen kann.\n\nIch danke Ihnen {11} Ihre Hilfe und freue mich {12} Ihre Antwort.\n\nFreundliche Grüße\nOlena Kovalenko",

  {type:"listen", title:"Hören 1",
   items:[
    ["Achtung, Achtung: Das Freibad schließt heute wegen eines Gewitters bereits um 16 Uhr. Wer ein Saisonabonnement hat, darf morgen ausnahmsweise schon um 8 statt um 9 Uhr kommen. Wir bitten alle Gäste, das Wasser jetzt zu verlassen.","Was gilt morgen für Gäste mit Saisonabonnement?",["Sie dürfen eine Stunde früher kommen.","Sie müssen um 16 Uhr gehen.","Sie bekommen Geld zurück."]],
    ["Guten Tag, hier ist Frau Studer vom Personalbüro der Firma Kessler. Vielen Dank für Ihre Bewerbung als Lagermitarbeiter. Wir möchten Sie gern kennenlernen. Leider ist der Termin am Montag nicht mehr möglich, weil unser Lagerchef krank ist. Können Sie stattdessen am Mittwoch um 14 Uhr kommen? Bringen Sie bitte Ihre Arbeitszeugnisse mit und bestätigen Sie den Termin per E-Mail.","Was soll der Bewerber tun?",["den neuen Termin per E-Mail bestätigen","am Montag zur Firma kommen","seine Zeugnisse per Post schicken"]],
    ["Die Stadt erinnert: Ab dem 1. Oktober kostet ein 35-Liter-Abfallsack nicht mehr 2 Franken, sondern 2 Franken 20. Grund sind die höheren Kosten für die Entsorgung. Papier und Karton werden weiterhin gratis abgeholt, jeden zweiten Dienstag.","Was wird teurer?",["die Abfallsäcke","die Entsorgung von Papier","die Abholung von Karton"]],
    ["Liebe Eltern, der Elternabend der Klasse 4b findet nicht wie geplant am Donnerstag, sondern schon am Dienstag, den 12. März, um 19 Uhr statt. Wir treffen uns im Musikzimmer im Erdgeschoss. Für Eltern, die eine Übersetzung brauchen, organisieren wir gern eine Dolmetscherin. Bitte melden Sie sich dafür bis Freitag.","Bis wann muss man sich melden, wenn man eine Übersetzung braucht?",["bis Freitag","bis Dienstag","bis Donnerstag"]],
    ["Hallo Sara, hier ist Ben. Ich stehe gerade im Baumarkt und finde die Farbe nicht, die du wolltest. Weiß gibt es nur in großen Eimern, und die sind ziemlich teuer. Soll ich lieber den hellgrauen Ton nehmen? Der ist im Angebot. Ruf mich kurz zurück, ich warte an der Kasse.","Warum ruft Ben an?",["Er weiß nicht, welche Farbe er kaufen soll.","Er hat die Farbe schon gekauft.","Der Baumarkt ist geschlossen."]]]},
  {type:"listen", inst:"listen2", title:"Hören 2",
   items:[
    [[["A","Entschuldigung, ist das hier die Schlange für die Wohnsitzbestätigung?"],["B","Nein, hier gibt man nur Formulare ab. Für Bestätigungen müssen Sie eine Nummer ziehen. Der Automat steht neben dem Lift."],["A","Und wie lange muss man ungefähr warten?"],["B","Heute ist viel los, sicher eine halbe Stunde. Sie können die Bestätigung aber auch online bestellen, dann kommt sie in drei Tagen per Post."],["A","Ich brauche sie leider schon morgen. Dann warte ich."]],"Was macht Person A?",["Sie zieht eine Nummer und wartet.","Sie bestellt die Bestätigung online.","Sie gibt ein Formular ab."]],
    [[["A","Na, wie war dein erster Arbeitstag im Spital?"],["B","Anstrengend, aber schön. Die Kolleginnen sind sehr nett. Nur die Schichten sind ein Problem: Nächste Woche habe ich dreimal Nachtdienst."],["A","Und wer schaut dann nach den Kindern?"],["B","Meine Mutter kommt zum Glück für zwei Wochen zu uns. Danach muss ich eine andere Lösung finden."]],"Wer kümmert sich nächste Woche um die Kinder?",["die Mutter von Person B","eine Kollegin aus dem Spital","eine Nachbarin"]],
    [[["A","Guten Abend, ich hätte gern einen Tisch für vier Personen, am Samstag um 19 Uhr."],["B","Am Samstag um sieben sind wir leider ausgebucht. Ich könnte Ihnen einen Tisch um halb sechs oder um neun Uhr anbieten."],["A","Halb sechs ist zu früh, wir kommen direkt von der Arbeit. Dann nehmen wir den Tisch um neun."],["B","Gern. Auf welchen Namen?"]],"Um wie viel Uhr gehen die vier Personen essen?",["um 21 Uhr","um 19 Uhr","um 17.30 Uhr"]],
    [[["A","Hast du gehört? Ab Januar gibt es in unserer Firma keine Gratis-Parkplätze mehr."],["B","Ja, ärgerlich. Aber dafür bezahlt die Firma jetzt die Hälfte vom Zug-Abo."],["A","Für mich ist das schlecht. Mit dem Zug bräuchte ich über eine Stunde."],["B","Du wohnst doch auch in Muri, oder? Wir könnten zusammen mit dem Auto fahren und die Parkgebühr teilen."]],"Was schlägt Person B vor?",["zusammen mit dem Auto zu fahren","mit dem Zug zu fahren","näher an die Firma zu ziehen"]]]},

window.HOEREN = [
["durchsage",[["","Achtung, eine Durchsage für die Fahrgäste nach Basel: Der Intercity um 9 Uhr 15 hat heute etwa 20 Minuten Verspätung. Wir bitten um Entschuldigung."]],"Wie viel Verspätung hat der Zug?",["etwa 20 Minuten","etwa 15 Minuten","etwa 9 Minuten"]],
["durchsage",[["","Liebe Kundinnen und Kunden, unser Geschäft schließt heute schon um 17 Uhr. Morgen sind wir wieder ab 8 Uhr für Sie da."]],"Wann schließt das Geschäft heute?",["um 17 Uhr","um 18 Uhr","um 8 Uhr"]],
["nachricht",[["","Hallo, hier ist Frau Weber von der Schule. Ihre Tochter Lina hat Bauchschmerzen. Können Sie sie bitte abholen? Sie wartet im Sekretariat."]],"Was soll die Mutter tun?",["ihre Tochter abholen","in der Schule anrufen","Medikamente kaufen"]],
["nachricht",[["","Guten Tag, hier ist Keller, Ihr Vermieter. Am Donnerstag zwischen 8 und 12 Uhr kommt der Elektriker in Ihre Wohnung. Bitte sagen Sie mir Bescheid, ob jemand zu Hause ist."]],"Warum ruft Herr Keller an?",["Ein Elektriker kommt in die Wohnung.","Die Miete wird teurer.","Er möchte die Wohnung verkaufen."]],
["gespraech",[["A","Guten Morgen, ich hätte gern vier Brötchen und ein Vollkornbrot."],["B","Gern. Das Vollkornbrot ist leider schon ausverkauft. Möchten Sie ein Roggenbrot?"],["A","Ja, das nehme ich."]],"Was kauft die Kundin?",["vier Brötchen und ein Roggenbrot","vier Brötchen und ein Vollkornbrot","nur ein Roggenbrot"]],
["gespraech",[["A","Praxis Doktor Huber, guten Tag."],["B","Guten Tag, mein Name ist Haddad. Ich brauche einen Termin, ich habe seit drei Tagen Fieber."],["A","Können Sie heute um halb drei kommen?"],["B","Ja, das passt."]],"Wann hat Herr Haddad den Termin?",["heute um 14.30 Uhr","heute um 13.30 Uhr","morgen um 14.30 Uhr"]],
["radio",[["","Und hier die Verkehrsmeldungen: Auf der Autobahn A1 zwischen Bern und Zürich gibt es wegen eines Unfalls einen Stau von fünf Kilometern. Bitte fahren Sie vorsichtig."]],"Warum gibt es einen Stau?",["wegen eines Unfalls","wegen einer Baustelle","wegen Schnee"]],
["nachricht",[["","Hallo Omar, hier ist Lukas. Das Fußballtraining heute fällt aus, weil der Platz zu nass ist. Wir trainieren dafür am Samstag um zehn."]],"Wann ist das nächste Training?",["am Samstag um 10 Uhr","heute Abend","am Sonntag um 10 Uhr"]],
["gespraech",[["A","Entschuldigung, wie komme ich zum Einwohneramt?"],["B","Gehen Sie hier geradeaus bis zur Kirche und dann links. Das Amt ist im zweiten Stock vom grauen Gebäude."]],"Wo ist das Einwohneramt?",["im grauen Gebäude im 2. Stock","neben der Kirche im Erdgeschoss","im grauen Gebäude im 1. Stock"]],
["durchsage",[["","Sehr geehrte Besucherinnen und Besucher, das Museum schließt in fünfzehn Minuten. Bitte gehen Sie langsam zum Ausgang. Vielen Dank für Ihren Besuch."]],"Was sollen die Besucher tun?",["zum Ausgang gehen","Tickets kaufen","im Café warten"]],
["nachricht",[["","Guten Tag, hier spricht Herr Brunner von der Firma Alpenbau. Vielen Dank für Ihre Bewerbung. Wir möchten Sie gern zu einem Vorstellungsgespräch einladen. Bitte rufen Sie mich zurück."]],"Warum ruft Herr Brunner an?",["Er lädt zu einem Vorstellungsgespräch ein.","Die Bewerbung ist nicht vollständig.","Die Stelle ist schon besetzt."]],

<script>
(function(){
"use strict";
// ───── state
const KEY="lmm-state-v1";
let S={lang:"ar",known:{},satz:{},quizDone:0,quizBest:{},tab:"start"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object")S=Object.assign(S,s)}catch(e){}
if(!UI[S.lang])S.lang="ar";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

// ───── answer log → teacher's Google Sheet
const ENDPOINT="https://script.google.com/macros/s/AKfycbzavcsPgjGk1ifesUSixDfenonfHv-AdPO5aVdepfc_7V4eQfZs4mjw2NlGxVlEy3tCmw/exec";
if(!S.dev){S.dev=Math.random().toString(36).slice(2,10);save()}
let OUTQ=[];try{OUTQ=JSON.parse(localStorage.getItem(KEY+"-q")||"[]")||[]}catch(e){OUTQ=[]}
const saveQ=()=>{try{localStorage.setItem(KEY+"-q",JSON.stringify(OUTQ.slice(-500)))}catch(e){}};
let flushing=false;
function flush(){
  if(flushing||!OUTQ.length||!/^https:/.test(ENDPOINT))return;
  flushing=true;const batch=OUTQ.slice(0,25);
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({rows:batch})})
    .then(()=>{OUTQ=OUTQ.slice(batch.length);saveQ();flushing=false;if(OUTQ.length)setTimeout(flush,800)})
    .catch(()=>{flushing=false;setTimeout(flush,15000)});
}
function logAnswer(o){
  if(!S.name)return;
  OUTQ.push(Object.assign({t:new Date().toISOString(),name:S.name,dev:S.dev,lang:S.lang},o));saveQ();flush();
}
window.addEventListener("online",flush);

// ───── helpers
const $=id=>document.getElementById(id);
const L=()=>S.lang;
function t(k,v){let s=(UI[L()]&&UI[L()][k]);if(s==null)s=UI.en[k];if(s==null)s=k;if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s}
const tr=o=>o?(o[L()]!=null?o[L()]:(o.en||"")):"";
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
// In right-to-left text, isolate every Latin run so German examples keep their word order.
const LAT=/(?:-(?=[A-Za-zÄÖÜäöüß])|[*A-Za-zÄÖÜäöüßÉé])[^\u0600-\u06FF<>←→]*[A-Za-zÄÖÜäöüß0-9.?!…)*]|[A-Za-zÄÖÜäöüß]/g;
function isoRun(m){
  if(!/[A-Za-zÄÖÜäöüß]/.test(m))return m;
  let pre="",post="";
  const odd=x=>(x.split("**").length-1)%2===1;
  if(odd(m)&&m.startsWith("**")){pre="**";m=m.slice(2)}
  if(odd(m)&&m.endsWith("**")){post="**";m=m.slice(0,-2)}
  return `${pre}<bdi dir="ltr">${m}</bdi>${post}`;
}
const iso=h=>LANGS[L()].dir==="rtl"?h.replace(LAT,isoRun):h;
const md=s=>iso(esc(s)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuf(a).slice(0,n);
function deHTML(de,pl){
  const m=/^(der|die|das)\s(.+)$/.exec(de);
  if(!m)return esc(de);
  const cls=pl==="Pl."?"pl":m[1];
  return `<span class="a-${cls}">${m[1]}</span> ${esc(m[2])}`;
}

// ───── speech
const canSpeak=("speechSynthesis" in window)&&typeof window.SpeechSynthesisUtterance!=="undefined";
let deVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];deVoice=vs.find(v=>/^de[-_]DE/i.test(v.lang))||vs.find(v=>/^de/i.test(v.lang))||null}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}}
const cleanSay=s=>String(s).replace(/\s*\+\s*(Akk|Dat)\.?/g,"").replace(/…/g,"").replace(/\s{2,}/g," ").trim();
function speak(s){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanSay(s));u.lang="de-DE";if(deVoice)u.voice=deVoice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function speakLines(lines,rate){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();lines.forEach(([sp,txt])=>{const u=new SpeechSynthesisUtterance(cleanSay(txt));u.lang="de-DE";if(deVoice)u.voice=deVoice;u.rate=rate||.95;u.pitch=sp==="A"?1.2:sp==="B"?.8:1;speechSynthesis.speak(u)})}catch(e){}
}
// word-level diff (LCS); returns HTML with <del> for removed and <ins> for added words
function wdiff(a,b){
  const tok=x=>String(x).replace(/\r/g,"").replace(/\n/g," \n ").split(/ +/).filter(w=>w!=="");
  const A=tok(a),B=tok(b),n=A.length,m=B.length;
  if(n*m>250000)return esc(b).replace(/\n/g,"<br>");
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  const w=(x,tag)=>x==="\n"?"<br>":tag?`<${tag}>${esc(x)}</${tag}>`:esc(x);
  while(i<n&&j<m){if(A[i]===B[j]){out.push(w(A[i]));i++;j++}else if(L[i+1][j]>=L[i][j+1])out.push(w(A[i++],"del"));else out.push(w(B[j++],"ins"))}
  while(i<n)out.push(w(A[i++],"del"));while(j<m)out.push(w(B[j++],"ins"));
  return out.join(" ").replace(/ ?<br> ?/g,"<br>");
}

// ───── data
const V=VOCAB.map(r=>({topic:r[0],de:r[1],pl:r[2],tr:{ar:r[3],uk:r[4],tr:r[5],en:r[6]},id:r[0]+"|"+r[1]}));

// ───── spaced review (Leitner boxes: due today, then +1, +3, +7, +14 days)
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const RV_INT=[0,0,1,3,7,14];
if(!S.rv||typeof S.rv!=="object")S.rv={};
if(!S.examBest||typeof S.examBest!=="object")S.examBest={};
["drafts","sent","fb","fbSeen"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});
function rvWrong(k){S.rv[k]={b:1,d:today()};save()}
function rvRight(k){const r=S.rv[k];if(!r||r.d>today())return;r.b++;if(r.b>5)delete S.rv[k];else r.d=today()+RV_INT[r.b];save()}
function rvDue(pre){const d=today();return Object.keys(S.rv).filter(k=>k.startsWith(pre)&&S.rv[k].d<=d)}
function rvLater(){const d=today();return Object.values(S.rv).filter(r=>r.d>d).length}
const rvQ=()=>rvDue("q|").length+rvDue("a|").length+rvDue("p|").length;
function rvQuizItems(){
  const a=rvDue("q|").map(k=>QUIZ.find(r=>r[1]===k.slice(2))).filter(Boolean).map(qGrammarItem);
  const b=rvDue("a|").map(k=>V.find(w=>w.id===k.slice(2))).filter(Boolean).map(qArticleItem);
  const c=rvDue("p|").map(k=>VERBS.find(v=>v[0]===k.slice(2))).filter(Boolean).map(qPartItem);
  return shuf(a.concat(b,c)).slice(0,20);
}
const rvSatz=()=>rvDue("s|").map(k=>SB.find(x=>x.id===k.slice(2))).filter(Boolean);
const rvWords=()=>rvDue("w|").map(k=>V.find(w=>w.id===k.slice(2))).filter(Boolean);

const IC={
 start:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',

// ───── view state (not persisted)
const W={topic:"all",mode:"cards",dir:"de",onlyNew:false,queue:[],idx:0,search:""};
const SZ={topic:"all",list:[],idx:0,placed:[],tiles:[],answered:false,tries:0,right:0,fb:null};

// ───── shell
function applyLang(){
  const d=LANGS[L()].dir;
  document.documentElement.lang=L();document.documentElement.dir=d;
  $("appName").textContent=t("app");$("appLevel").textContent=t("level");
  $("langLbl").textContent=t("lang");
  $("lang").innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===L()?" selected":""}>${v.label}</option>`).join("");
  document.title=t("app");
}
function renderNav(){
  $("nav").style.setProperty("--ntabs",TABS.length);
  $("nav").innerHTML=TABS.map(([k,n])=>`<button data-act="tab" data-tab="${k}"${S.tab===k?' aria-current="page"':""}>${svg(k)}<span>${n}</span></button>`).join("");
}
function vName(){
  return `<section class="welcome gate">
    <div><p class="eyebrow">${esc(t("level"))}</p><h1>${esc(t("name_title"))}</h1><p>${esc(t("name_hint"))}</p></div>
    <img alt="" src="${LOGO}">
  </section>
  <form class="sheet namef" id="namef" novalidate>
    <label for="nameIn" class="eyebrow">${esc(t("name_ph"))}</label>
    <input id="nameIn" class="search" type="text" maxlength="40" autocomplete="name" placeholder="${esc(t("name_ph"))}" value="${esc(S.pendingName||"")}">
    <button class="btn pri" type="submit">${esc(t("name_go"))}</button>
    <p class="muted" style="font-size:.86rem">🔒 ${esc(t("name_note"))}</p>
  </form>`;
}
function render(){
  const v=$("view");
  document.querySelector(".nav").hidden=!S.name;
  if(!S.name){$("nav").innerHTML="";v.innerHTML=`<div class="view">${vName()}</div>`;return}
  renderNav();
  if(!SP_ON&&S.tab==="speak")S.tab="start";
  const f={start:vStart,words:vWords,satz:vSatz,listen:vListen,speak:vSpeak,grammar:vGrammar,quiz:vQuiz,writing:vWriting}[S.tab]||vStart;
  v.innerHTML=`<div class="view">${f()}</div>`;
  if(S.tab==="words"&&W.mode==="list")fillList();
  exTick();
}
function go(tab){S.tab=tab;save();render();window.scrollTo(0,0)}

// ───── START
function vStart(){
  const known=V.filter(w=>S.known[w.id]).length;
  const satz=SB.filter(s=>S.satz[s.id]).length;
  const day=Math.floor(Date.now()/864e5);
  const g=GRAMMAR[day%GRAMMAR.length];
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const secs=[
    ["words","sec_words",t("d_words",{n:V.length})],
    ["satz","sec_sentences",t("d_sentences",{n:SB.length})],
    ["grammar","sec_grammar",t("d_grammar",{n:GRAMMAR.length})],
    ["listen","sec_listen",t("d_listen")],
    ...(SP_ON?[["speak","sec_speak",t("d_speak")]]:[]),
    ["quiz","sec_quiz",t("d_quiz")],
    ["writing","sec_writing",t("d_writing")]];
  return `
  <section class="welcome">
    <div><p class="eyebrow">${esc(t("level"))}</p><h1>${esc(t("app"))}</h1><p>${esc(t("hello_name",{n:S.name}))}</p></div>
    <img alt="" src="${LOGO}">
    <div class="gender"><span class="a-der">der</span><span class="a-die">die</span><span class="a-das">das</span></div>
  </section>
  ${vMomoHi()}
  ${vFbCard()}
  ${vRvCard()}
  ${vExamCard()}
  <section class="sheet">
    <p class="eyebrow">${esc(t("progress"))}</p>
    <div class="stats">
      <div class="stat"><b>${known}<span class="muted" style="font-size:.55em"> / ${V.length}</span></b><div class="bar"><i style="width:${pct(known,V.length)}%"></i></div><small>${esc(t("sec_words"))}</small></div>
      <div class="stat"><b>${satz}<span class="muted" style="font-size:.55em"> / ${SB.length}</span></b><div class="bar"><i style="width:${pct(satz,SB.length)}%"></i></div><small>${esc(t("sec_sentences"))}</small></div>
      <div class="stat"><b>${S.quizDone||0}</b><div class="bar"><i style="width:${Math.min(100,(S.quizDone||0)*10)}%"></i></div><small>${esc(t("sec_quiz"))}</small></div>
    </div>
  </section>
  <section class="sheet">
    <p class="eyebrow">${esc(t("sections"))}</p>
    <div class="menu">${secs.map(([k,n,d],i)=>`<button class="item" data-act="tab" data-tab="${k}"><span class="no">${i+1}</span><span class="txt"><b>${esc(t(n))}</b><small>${esc(d)}</small></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>`).join("")}</div>
  </section>
  <article class="sheet tip" data-act="openG" data-g="${g.id}" style="cursor:pointer">
    <p class="eyebrow">${esc(t("tipTitle"))} · <span class="de">${esc(g.de)}</span></p>
    <p>${md(tr(g.tip))}</p>
  </article>

// ───── SATZBAU diagnosis: compares the learner's tiles with the closest correct answer and names the real mistake.
const DG_W=new Set("was wer wen wem wessen wie wo wann warum woher wohin welche welcher welches welchen worauf wofür womit worüber wozu".split(" "));
const DG_SUB=new Set("weil dass obwohl ob wenn als sodass damit bevor nachdem während falls seit seitdem bis".split(" "));
const DG_REL=new Set("der die das den dem denen dessen deren".split(" "));
const DG_PREP=new Set("mit von zu bei für auf an in über aus".split(" "));
const DG_ADV=new Set("deshalb deswegen darum trotzdem dann daher".split(" "));
const DG_CONN=new Set([...DG_SUB,...DG_ADV,"denn","so","um"]);
const DG_PAIR={"denn|weil":"cn_weil_denn","obwohl|trotzdem":"cn_obwohl_trotzdem","deshalb|weil":"cn_deshalb_weil","denn|deshalb":"cn_denn_deshalb",
  "als|wenn":"cn_als_wenn","dass|ob":"cn_dass_ob","dass|sodass":"cn_dass_sodass","so|sodass":"cn_dass_sodass","damit|um":"cn_damit_um"};
const lc=w=>w.toLowerCase();
function lev(a,b){a=lc(a);b=lc(b);const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const q=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=q}}return d[b.length]}
function lcsLen(a,b){const m=Array(b.length+1).fill(0);for(let i=0;i<a.length;i++){let p=0;for(let j=1;j<=b.length;j++){const q=m[j];m[j]=lc(a[i])===lc(b[j-1])?p+1:Math.max(m[j],m[j-1]);p=q}}return m[b.length]}
function bagMinus(a,b){const r=[...a];b.forEach(w=>{const i=r.findIndex(x=>lc(x)===lc(w));if(i>=0)r.splice(i,1)});return r}
const clauses=ts=>{const r=[[]];ts.forEach(w=>w===","?r.push([]):r[r.length-1].push(w));return r};
function clauseKind(c,i){const f=lc(c[0]||""),f2=lc(c[1]||"");
  if(DG_SUB.has(f))return "sub";if(i>0&&(DG_REL.has(f)||DG_W.has(f)||(DG_PREP.has(f)&&DG_REL.has(f2))))return "sub";
  if(DG_ADV.has(f))return "adv";if(f==="denn")return "denn";return "main"}
function szDiag(s,mine){
  const vars=[s.a,...s.alt].map(a=>a.split(" "));
  const best=vars.map(v=>[v,bagMinus(mine,v).length,lcsLen(mine,v)]).sort((x,y)=>x[1]-y[1]||y[2]-x[2])[0][0];
  const X=new Set(s.x.map(lc)),inBest=new Set(best.map(lc)),msgs=[],line=(k,v)=>msgs.push(md(t(k,v)));
  // 1. wrong words (the trap tiles)
  let missing=bagMinus(best,mine);const fixed=[...mine];
  mine.forEach((w,i)=>{
    if(!X.has(lc(w))||inBest.has(lc(w)))return;
    let y=null;
    const conn=missing.find(m=>DG_CONN.has(lc(m))&&DG_CONN.has(lc(w)));
    if(conn)y=conn;else if(missing.length){const c=missing.map(m=>[m,1-lev(w,m)/Math.max(w.length,m.length)]).sort((a,b)=>b[1]-a[1])[0];if(c[1]>=.34||missing.length===1)y=c[0]}
    if(y){missing=bagMinus(missing,[y]);fixed[i]=y;const pk=[lc(w),lc(y)].sort().join("|");
      line("dg_form",{x:w,y});if(DG_PAIR[pk])line(DG_PAIR[pk])}
    else line("dg_wrong",{x:w});
  });
  const extra=bagMinus(fixed,best);
  if(missing.length)line("dg_missing",{n:missing.length});
  else if(extra.length)line("dg_extra");
  // 2. question word order
  if(s.p==="?"&&fixed.length){
    const yesno=!DG_W.has(lc(best[0]));
    if(lc(fixed[0])!==lc(best[0]))line(yesno?"dg_yesno":"dg_w");
  }
  // 3. clauses: words in the wrong part (meaning), then verb position per clause
  const A=clauses(best),U=clauses(fixed);
  if(!missing.length&&!extra.length&&A.length===U.length&&A.length>1){
    let map=A.map((_,i)=>i);
    if(A.length===2){
      const anchor=A.findIndex(c=>DG_CONN.has(lc(c[0]||"")));
      const ua=anchor<0?-1:U.findIndex(c=>c.some(w=>lc(w)===lc(A[anchor][0])));
      if(anchor>=0&&ua>=0&&ua!==anchor)map=[1,0];
    }
    const shared=new Set(A.map(c=>new Set(c.map(lc))).reduce((x,y)=>[...x].filter(w=>y.has(w))));
    const wrongPart=[];U.forEach((c,i)=>bagMinus(c,A[map[i]]).forEach(w=>{if(!shared.has(lc(w))&&!wrongPart.includes(w))wrongPart.push(w)}));
    if(wrongPart.length>4)line("dg_swapall");else if(wrongPart.length)line("dg_swap",{w:wrongPart.join(" · ")});
    else if(map[0]===0)A.forEach((c,i)=>{
      const u=U[i];if(u.map(lc).join(" ")===c.map(lc).join(" "))return;
      const k=clauseKind(c,i);
      if(k==="sub")line("dg_sub",{c:c[0]});
      else if(k==="adv")line("dg_adv",{c:c[0]});
      else if(k==="denn")line("dg_denn");
      else if(i>0&&clauseKind(A[i-1],i-1)==="sub")line("dg_main");
    });
  }else if(!missing.length&&!extra.length&&A.length===1&&["perfekt","modal","passiv","konjunktiv"].includes(s.g)){
    const last=best[best.length-1];
    if(lc(fixed[fixed.length-1])!==lc(last)&&!(s.p==="?"&&msgs.length)&&best.length>2&&/^[a-zäöü]/.test(last)&&last!==best[1])line("dg_end",{w:last});
  }
  if(!msgs.length)line("dg_order");
  const marks=mine.map((w,i)=>best[i]!=null&&lc(best[i])===lc(w));
  return {msgs,marks};
}
const szRuleTip=s=>(s.p==="?"&&!DG_W.has(lc(s.a.split(" ")[0])))?t("dg_yesno"):tr(GI[s.g].tip);
function szCheck(){
  const s=SZ.list[SZ.idx];if(!SZ.placed.length)return;
  const mineT=SZ.placed.map(i=>SZ.tiles.find(x=>x.i===i).w),mine=mineT.join(" ");

  }

}

function qGrammarItem(r){
  const [g,sent,opts]=r;const correct=opts[0];
  const filled=sent.replace("___",correct);
  return {g,key:"q|"+sent,q:sent,topic:GI[g].de,prompt:`<p class="qtext">${esc(sent).replace("___",'<span class="blank">&nbsp;</span>')}</p>`,
    after:`<p class="qtext">${esc(sent).replace("___",`<span class="blank f">${esc(correct)}</span>`)}</p>`,
    options:shuf(opts),correct,explain:`<p>${md(tr(GI[g].tip))}</p>`,say:filled,review:filled};
}
function qArticleItem(w){
  const m=/^(der|die|das)\s(.+)$/.exec(w.de);
  return {art:true,key:"a|"+w.id,q:m[2]+" ("+tr(w.tr)+")",topic:"der/die/das",prompt:`<p class="qtext center">${esc(m[2])}</p><p class="muted" style="text-align:center">${esc(tr(w.tr))}</p>`,
    after:`<p class="qtext center">${deHTML(w.de,w.pl)}</p><p class="muted" style="text-align:center">${esc(tr(w.tr))}${w.pl?` · <span class="de">die ${esc(w.pl)}</span>`:""}</p>`,
    options:["der","die","das"],correct:m[1],explain:"",say:w.de,review:w.de};
}
function wrongPart(v){
  const [inf,,part]=v;
  if(!/^ge/.test(part))return "ge"+part;
  if(/en$/.test(part)){const stem=inf.replace(/e?n$/,"");return "ge"+stem+"t"}
  if(/et$/.test(part))return part.slice(0,-2)+"en";
  return part.slice(0,-1)+"en";
}
function qPartItem(v){
  const aux=v[3]==="s"?"ist":"hat",other=v[3]==="s"?"hat":"ist";
  const correct=aux+" "+v[2];
  let opts=[correct,other+" "+v[2],aux+" "+wrongPart(v)];
  opts=[...new Set(opts)];
  return {key:"p|"+v[0],q:v[0],topic:"Partizip II",prompt:`<p class="qtext">${esc(t("q_which"))} <b>${esc(v[0])}</b>?</p>`,
    after:`<p class="qtext">${esc(v[0])} – ${esc(v[1])} – <span class="blank f">${esc(correct)}</span></p>`,
    options:shuf(opts),correct,explain:`<p>${md(tr(GI.perfekt.tip))}</p>`,say:`${v[0]}, ${v[1]}, ${correct}`,review:`${v[0]} – ${v[1]} – ${correct}`};
}
function qStart(mode,topic){

  if(mode==="mixed")Q.items=pick(QUIZ.filter(q=>!REC[q[0]]),10).map(qGrammarItem);

const EXV={open:false,result:null,confirm:false,quit:false,tr:{}};
let exTimer=null;
function sshuf(a,seed){let h=7;for(const c of seed)h=(h*31+c.charCodeAt(0))|0;if(!h)h=1;const r=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296};a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const exParts=ex=>ex.parts.filter(p=>p.type!=="write");
const examMax=ex=>exParts(ex).reduce((n,p)=>n+p.items.length,0);
const exById=id=>EXAMS.find(e=>e.id===id);
function exCorrect(p,it){return p.type==="rf"?(it[1]?"r":"f"):p.type==="match"?it[1]:p.type==="gap"?it[0]:p.type==="listen"?it[2][0]:it[1][0]}
const exLabel=(p,v)=>v==null||v===""?"—":p.type==="rf"?(v==="r"?"richtig":"falsch"):p.type==="match"?v.toUpperCase():v;
function exLeft(){const ex=exById(S.exam.id);return Math.max(0,Math.round(ex.minutes*60-(Date.now()-S.exam.start)/1000))}
const mmss=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function exTick(){
  clearInterval(exTimer);exTimer=null;
  if(!S.exam||!EXV.open||S.tab!=="quiz")return;
  exTimer=setInterval(()=>{
    if(!S.exam){clearInterval(exTimer);return}
    const l=exLeft(),el=$("exTime");
    if(el){el.textContent=mmss(l);el.classList.toggle("low",l<300)}
    if(l<=0){clearInterval(exTimer);exSubmit(true)}
  },1000);
}
function exStart(id){

  }
  return "";

function exSubmit(auto){
  if(!S.exam)return;
  const ex=exById(S.exam.id),A=S.exam.ans;let score=0,max=0;const parts=[],mistakes=[];
  ex.parts.forEach((p,pi)=>{
    if(p.type==="write")return;
    let ps=0;
    p.items.forEach((it,i)=>{const c=exCorrect(p,it),v=A[pi+"-"+i];max++;
      if(v===c){ps++;score++}
      else{const q=p.type==="gap"?"Lücke "+(i+1):p.type==="listen"?it[1]:it[0];mistakes.push({part:p.title,q,your:exLabel(p,v),right:exLabel(p,c)})}});
    parts.push({title:p.title,score:ps,max:p.items.length});
  });
  const pct=Math.round(score/max*100),pass=pct>=60,wp=ex.parts.find(p=>p.type==="write");
  const res={id:ex.id,title:ex.title,score,max,pct,pass,parts,mistakes,write:S.exam.write.trim(),task:wp?wp.task:"",auto:!!auto,date:Date.now()};

const spScen=id=>SP_SC.find(s=>s.id===id);
function spOpen(id){
  const sc=spScen(id);if(!sc)return;
  if(!S.sp||S.sp.id!==id||S.sp.final)S.sp={id,msgs:[{r:"a",x:sc.opener,tr:""}],done:false};
  SP.err=null;SP.result=S.sp.final||null;SP.draft="";SP.showTr={};save();render();window.scrollTo(0,0);
  if(!S.sp.final&&S.sp.msgs.length===1)speak(sc.opener);
