window.WRITING = [
{id:"beschwerde", formal:true, groups:["anrede_f","einleitung","problem","bitte","erreichbar","schluss","gruss"],
 t:{de:"Beschwerde: Laptop kaputt",ar:"شكوى: اللابتوب خربان",uk:"Скарга: зламаний ноутбук",tr:"Şikâyet: Dizüstü bilgisayar bozuk",en:"Complaint: broken laptop"},
 task:{de:"Sie haben vor drei Monaten bei der Firma Computech einen neuen Laptop gekauft. Jetzt ist er kaputt. Sie erreichen bei der Firma telefonisch niemanden, deshalb schreiben Sie eine E-Mail.",
  ar:"اشتريت من 3 شهور لابتوب جديد من شركة Computech. هلأ خرب. ما قدرت توصلهم بالتلفون، لهيك عم تكتب إيميل.",
  uk:"Три місяці тому ви купили новий ноутбук у фірмі Computech. Тепер він зламався. Ви не можете додзвонитися до фірми, тому пишете e-mail.",
  tr:"Üç ay önce Computech firmasından yeni bir dizüstü bilgisayar aldınız. Şimdi bozuldu. Firmaya telefonla ulaşamıyorsunuz, bu yüzden bir e-posta yazıyorsunuz.",
  en:"Three months ago you bought a new laptop from the company Computech. Now it is broken. You can't reach anyone by phone, so you write an email."},
 points:[
  {de:"Grund für Ihr Schreiben",ar:"سبب الكتابة",uk:"Причина листа",tr:"Yazma nedeniniz",en:"Reason for writing"},
  {de:"Garantie",ar:"الكفالة",uk:"Гарантія",tr:"Garanti",en:"Warranty"},
  {de:"Reparatur oder neuer Laptop",ar:"تصليح ولا لابتوب جديد",uk:"Ремонт чи новий ноутбук",tr:"Tamir mi, yeni bilgisayar mı",en:"Repair or a new laptop"},
  {de:"Wie Sie erreichbar sind",ar:"كيف يتواصلوا معك",uk:"Як з вами зв'язатися",tr:"Size nasıl ulaşılabileceği",en:"How they can reach you"}],
 sample:"Sehr geehrte Damen und Herren,\n\nich möchte Ihnen mitteilen, dass ich vor drei Monaten bei Ihnen einen neuen Laptop gekauft habe. Leider ist der Laptop jetzt kaputt: Er geht nicht mehr an. Ich habe Sie mehrmals angerufen, aber niemanden erreicht.\n\nDer Laptop hat noch zwei Jahre Garantie. Deshalb möchte ich Sie bitten, ihn kostenlos zu reparieren. Wenn eine Reparatur nicht möglich ist, möchte ich einen neuen Laptop bekommen.\n\nSie erreichen mich per E-Mail oder unter der Nummer 079 123 45 67, am besten nachmittags.\n\nIch freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"حضرات السيدات والسادة،\n\nبحب بلّغكم إني اشتريت من عندكم لابتوب جديد من 3 شهور. للأسف اللابتوب هلأ خربان: ما عاد يشتغل. اتصلت فيكم كذا مرة بس ما رد حدا.\n\nاللابتوب إله لسا سنتين كفالة. لهيك بطلب منكم تصلّحوه ببلاش. وإذا التصليح مش ممكن، بدي آخد لابتوب جديد.\n\nفيكم تتواصلوا معي بالإيميل أو عالرقم 079 123 45 67، أحسن شي بعد الضهر.\n\nبانتظار ردكم.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановні пані та панове,\n\nхочу повідомити вам, що три місяці тому купив у вас новий ноутбук. На жаль, тепер він зламався: він більше не вмикається. Я кілька разів телефонував вам, але ні до кого не додзвонився.\n\nНа ноутбук ще два роки гарантії. Тому прошу вас безкоштовно його відремонтувати. Якщо ремонт неможливий, я хотів би отримати новий ноутбук.\n\nЗі мною можна зв'язатися електронною поштою або за номером 079 123 45 67, найкраще після обіду.\n\nЧекаю на вашу відповідь.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın yetkililer,\n\nüç ay önce sizden yeni bir dizüstü bilgisayar aldığımı bildirmek istiyorum. Maalesef bilgisayar şimdi bozuk: Artık açılmıyor. Sizi birkaç kez aradım ama kimseye ulaşamadım.\n\nBilgisayarın hâlâ iki yıl garantisi var. Bu yüzden onu ücretsiz tamir etmenizi rica ediyorum. Tamir mümkün değilse, yeni bir bilgisayar almak istiyorum.\n\nBana e-postayla veya 079 123 45 67 numarasından, en iyi öğleden sonra ulaşabilirsiniz.\n\nCevabınızı bekliyorum.\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Sir or Madam,\n\nI would like to inform you that I bought a new laptop from you three months ago. Unfortunately, the laptop is now broken: it no longer switches on. I called you several times but couldn't reach anyone.\n\nThe laptop still has a two-year warranty. I would therefore like to ask you to repair it free of charge. If a repair is not possible, I would like to receive a new laptop.\n\nYou can reach me by email or on 079 123 45 67, ideally in the afternoon.\n\nI look forward to your reply.\n\nKind regards\nMuayad Jamal"}},

{id:"absage", formal:true, groups:["anrede_f","entschuldigung","vorschlag","bitte","schluss","gruss"],
 t:{de:"Termin absagen und verschieben",ar:"إلغاء موعد وتأجيله",uk:"Скасувати й перенести прийом",tr:"Randevu iptali ve erteleme",en:"Cancelling and moving an appointment"},
 task:{de:"Sie haben morgen um 9 Uhr einen Termin bei Ihrer Ärztin, Frau Dr. Keller. Sie können nicht kommen. Schreiben Sie eine E-Mail an die Praxis.",
  ar:"عندك بكرا الساعة 9 موعد عند دكتورتك، الدكتورة كيلر. ما بتقدر تروح. اكتب إيميل للعيادة.",
  uk:"Завтра о 9:00 у вас прийом у вашої лікарки, доктора Келлер. Ви не можете прийти. Напишіть e-mail до кабінету.",
  tr:"Yarın saat 9'da doktorunuz Dr. Keller'de randevunuz var. Gidemiyorsunuz. Muayenehaneye bir e-posta yazın.",
  en:"You have an appointment with your doctor, Dr Keller, tomorrow at 9. You can't go. Write an email to the practice."},
 points:[
  {de:"Sich entschuldigen",ar:"تعتذر",uk:"Вибачитися",tr:"Özür dilemek",en:"Apologise"},
  {de:"Grund nennen",ar:"تذكر السبب",uk:"Назвати причину",tr:"Nedeni belirtmek",en:"Give the reason"},
  {de:"Neuen Termin vorschlagen",ar:"تقترح موعد جديد",uk:"Запропонувати новий час",tr:"Yeni randevu önermek",en:"Suggest a new appointment"},
  {de:"Um Antwort bitten",ar:"تطلب رد",uk:"Попросити відповісти",tr:"Cevap istemek",en:"Ask for a reply"}],
 sample:"Sehr geehrte Frau Dr. Keller,\n\nleider kann ich morgen um 9 Uhr nicht zu meinem Termin kommen, weil ich kurzfristig arbeiten muss. Es tut mir sehr leid.\n\nKönnten wir einen neuen Termin vereinbaren? Ich hätte am Donnerstag oder am Freitag Zeit, am besten am Vormittag.\n\nBitte geben Sie mir kurz Bescheid, ob das möglich ist.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"الدكتورة كيلر المحترمة،\n\nللأسف ما بقدر إجي بكرا الساعة 9 على موعدي، لأنه لازم اشتغل بشكل مفاجئ. آسف كتير.\n\nفينا نحدد موعد جديد؟ بيكون عندي وقت يوم الخميس أو الجمعة، أحسن شي قبل الضهر.\n\nخبّروني لو سمحتوا إذا هاد ممكن.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановна пані докторко Келлер,\n\nна жаль, я не зможу прийти завтра о 9:00 на прийом, бо мені терміново треба працювати. Мені дуже шкода.\n\nЧи могли б ми домовитися про новий час? Я маю час у четвер або в п'ятницю, найкраще зранку.\n\nБудь ласка, повідомте мені, чи це можливо.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın Dr. Keller,\n\nmaalesef yarın saat 9'daki randevuma gelemeyeceğim, çünkü kısa süre önce çalışmam gerektiği ortaya çıktı. Çok üzgünüm.\n\nYeni bir randevu ayarlayabilir miyiz? Perşembe veya cuma günü vaktim var, en iyisi öğleden önce.\n\nBunun mümkün olup olmadığını bana kısaca bildirir misiniz?\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Dr Keller,\n\nunfortunately I can't come to my appointment tomorrow at 9 because I have to work at short notice. I am very sorry.\n\nCould we arrange a new appointment? I would have time on Thursday or Friday, ideally in the morning.\n\nPlease let me know whether that is possible.\n\nKind regards\nMuayad Jamal"}},

{id:"einladung", formal:false, groups:["anrede_i","einleitung","vorschlag","entschuldigung","schluss","gruss"],
 t:{de:"Antwort auf eine Einladung",ar:"الرد على عزيمة",uk:"Відповідь на запрошення",tr:"Bir davete cevap",en:"Replying to an invitation"},
 task:{de:"Ihre Freundin Sara hat Sie zu ihrer Geburtstagsparty am Samstag eingeladen. Schreiben Sie ihr eine Nachricht.",
  ar:"صاحبتك سارة عزمتك على حفلة عيد ميلادها يوم السبت. اكتبلها رسالة.",
  uk:"Ваша подруга Сара запросила вас на свою вечірку з нагоди дня народження в суботу. Напишіть їй повідомлення.",
  tr:"Arkadaşınız Sara sizi cumartesi günkü doğum günü partisine davet etti. Ona bir mesaj yazın.",
  en:"Your friend Sara has invited you to her birthday party on Saturday. Write her a message."},
 points:[
  {de:"Sich bedanken",ar:"تشكرها",uk:"Подякувати",tr:"Teşekkür etmek",en:"Say thank you"},
  {de:"Zusagen",ar:"تقبل الدعوة",uk:"Погодитися прийти",tr:"Daveti kabul etmek",en:"Accept"},
  {de:"Fragen, was Sie mitbringen können",ar:"تسأل شو فيك تجيب معك",uk:"Запитати, що принести",tr:"Ne getirebileceğinizi sormak",en:"Ask what you can bring"},
  {de:"Sagen, dass Sie später kommen",ar:"تقول إنك رح تتأخر شوي",uk:"Сказати, що прийдете пізніше",tr:"Biraz geç geleceğinizi söylemek",en:"Say that you'll come later"}],
 sample:"Liebe Sara,\n\nvielen Dank für deine Einladung! Ich komme sehr gern zu deiner Party am Samstag.\n\nSoll ich etwas mitbringen? Ich könnte zum Beispiel einen Salat oder einen Kuchen machen.\n\nLeider muss ich bis 18 Uhr arbeiten, deshalb komme ich etwas später, so gegen 19 Uhr.\n\nIch freue mich schon sehr!\n\nLiebe Grüße\nMuayad",
 sampleT:{
  ar:"عزيزتي سارة،\n\nشكراً كتير على عزيمتك! أكيد رح إجي على حفلتك يوم السبت.\n\nبدّك جيب شي معي؟ مثلاً بقدر أعمل سلطة أو كيكة.\n\nللأسف لازم اشتغل لحد الساعة 6، لهيك رح إجي متأخر شوي، تقريباً الساعة 7.\n\nمتحمّس كتير!\n\nسلامات\nمؤيد",
  uk:"Люба Саро,\n\nдуже дякую за запрошення! Я з радістю прийду на твою вечірку в суботу.\n\nМені щось принести? Наприклад, я міг би зробити салат або спекти пиріг.\n\nНа жаль, я працюю до 18:00, тому прийду трохи пізніше, десь о 19:00.\n\nДуже чекаю!\n\nОбіймаю\nМуаяд",
  tr:"Sevgili Sara,\n\ndavetin için çok teşekkürler! Cumartesi günkü partine seve seve geleceğim.\n\nBir şey getireyim mi? Örneğin bir salata ya da kek yapabilirim.\n\nMaalesef saat 18'e kadar çalışmam gerekiyor, bu yüzden biraz geç geleceğim, saat 19 gibi.\n\nŞimdiden çok heyecanlıyım!\n\nSevgiler\nMuayad",
  en:"Dear Sara,\n\nthank you very much for your invitation! I'd love to come to your party on Saturday.\n\nShall I bring something? I could make a salad or a cake, for example.\n\nUnfortunately I have to work until 6 pm, so I'll come a bit later, around 7.\n\nI'm really looking forward to it!\n\nLove\nMuayad"}},

{id:"information", formal:true, groups:["anrede_f","einleitung","bitte","schluss","gruss"],
 t:{de:"Bitte um Informationen: Deutschkurs",ar:"طلب معلومات: كورس ألماني",uk:"Запит інформації: курс німецької",tr:"Bilgi isteme: Almanca kursu",en:"Asking for information: German course"},
 task:{de:"Sie möchten einen Deutschkurs B1 besuchen. Schreiben Sie eine E-Mail an die Sprachschule.",
  ar:"بدك تسجّل بكورس ألماني B1. اكتب إيميل لمدرسة اللغة.",
  uk:"Ви хочете відвідувати курс німецької B1. Напишіть e-mail до мовної школи.",
  tr:"B1 seviyesinde bir Almanca kursuna katılmak istiyorsunuz. Dil okuluna bir e-posta yazın.",
  en:"You want to attend a B1 German course. Write an email to the language school."},
 points:[
  {de:"Sich kurz vorstellen",ar:"تعرّف عن حالك باختصار",uk:"Коротко представитися",tr:"Kendinizi kısaca tanıtmak",en:"Briefly introduce yourself"},
  {de:"Nach den Kurszeiten fragen",ar:"تسأل عن أوقات الكورس",uk:"Запитати про розклад",tr:"Kurs saatlerini sormak",en:"Ask about course times"},
  {de:"Nach dem Preis fragen",ar:"تسأل عن السعر",uk:"Запитати про ціну",tr:"Fiyatı sormak",en:"Ask about the price"},
  {de:"Nach der Prüfung fragen",ar:"تسأل عن الامتحان",uk:"Запитати про іспит",tr:"Sınavı sormak",en:"Ask about the exam"}],
 sample:"Sehr geehrte Damen und Herren,\n\nmein Name ist Muayad Jamal und ich wohne seit einem Jahr in der Schweiz. Ich habe Ihre Anzeige im Internet gelesen und interessiere mich für Ihren Deutschkurs B1.\n\nKönnten Sie mir bitte sagen, an welchen Tagen und um wie viel Uhr der Kurs stattfindet? Ich arbeite tagsüber, deshalb wäre ein Abendkurs ideal für mich.\n\nAußerdem möchte ich wissen, wie viel der Kurs kostet und ob man am Ende eine Prüfung machen kann.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"حضرات السيدات والسادة،\n\nاسمي مؤيد جمال وساكن بسويسرا من سنة. قريت إعلانكم عالإنترنت وأنا مهتم بكورس الألماني B1 عندكم.\n\nممكن تقولولي بأي أيام وأي ساعة الكورس؟ أنا بشتغل بالنهار، لهيك كورس بالمسا بيكون مثالي إلي.\n\nوكمان بدي اعرف قديش سعر الكورس وإذا فيه امتحان بالآخر.\n\nشكراً سلفاً.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановні пані та панове,\n\nмене звати Муаяд Джамаль, я живу у Швейцарії вже рік. Я прочитав ваше оголошення в інтернеті й цікавлюся вашим курсом німецької B1.\n\nЧи не могли б ви сказати, в які дні та о котрій годині відбувається курс? Я працюю вдень, тому вечірній курс був би для мене ідеальним.\n\nКрім того, я хотів би знати, скільки коштує курс і чи можна в кінці скласти іспит.\n\nЗаздалегідь дякую.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın yetkililer,\n\nadım Muayad Jamal, bir yıldır İsviçre'de yaşıyorum. İnternetteki ilanınızı okudum ve B1 Almanca kursunuzla ilgileniyorum.\n\nKursun hangi günlerde ve saat kaçta yapıldığını söyleyebilir misiniz lütfen? Gündüz çalışıyorum, bu yüzden akşam kursu benim için ideal olur.\n\nAyrıca kursun ne kadar olduğunu ve sonunda sınava girilip girilemeyeceğini öğrenmek istiyorum.\n\nŞimdiden teşekkür ederim.\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Sir or Madam,\n\nmy name is Muayad Jamal and I have been living in Switzerland for a year. I read your advertisement online and I am interested in your B1 German course.\n\nCould you please tell me on which days and at what time the course takes place? I work during the day, so an evening course would be ideal for me.\n\nI would also like to know how much the course costs and whether you can take an exam at the end.\n\nThank you in advance.\n\nKind regards\nMuayad Jamal"}},

{id:"vermieter", formal:true, groups:["anrede_f","problem","bitte","erreichbar","schluss","gruss"],
 t:{de:"Nachricht an den Vermieter: Heizung kaputt",ar:"رسالة لصاحب البيت: التدفئة خربانة",uk:"Лист орендодавцю: не працює опалення",tr:"Ev sahibine mesaj: Kalorifer bozuk",en:"Message to the landlord: heating broken"},
 task:{de:"In Ihrer Wohnung funktioniert die Heizung seit drei Tagen nicht. Schreiben Sie eine E-Mail an Ihren Vermieter, Herrn Keller.",
  ar:"التدفئة بشقتك ما عم تشتغل من 3 أيام. اكتب إيميل لصاحب البيت، السيد كيلر.",
  uk:"У вашій квартирі вже три дні не працює опалення. Напишіть e-mail своєму орендодавцю, пану Келлеру.",
  tr:"Dairenizde kalorifer üç gündür çalışmıyor. Ev sahibiniz Bay Keller'e bir e-posta yazın.",
  en:"The heating in your flat hasn't worked for three days. Write an email to your landlord, Mr Keller."},
 points:[
  {de:"Problem beschreiben",ar:"توصف المشكلة",uk:"Описати проблему",tr:"Sorunu anlatmak",en:"Describe the problem"},
  {de:"Seit wann?",ar:"من إيمتى؟",uk:"Відколи?",tr:"Ne zamandan beri?",en:"Since when?"},
  {de:"Um schnelle Reparatur bitten",ar:"تطلب تصليح سريع",uk:"Попросити швидко відремонтувати",tr:"Hızlı tamir rica etmek",en:"Ask for a quick repair"},
  {de:"Sagen, wann Sie zu Hause sind",ar:"تقول إيمتى بتكون بالبيت",uk:"Сказати, коли ви вдома",tr:"Ne zaman evde olduğunuzu söylemek",en:"Say when you are at home"}],
 sample:"Sehr geehrter Herr Keller,\n\nich wohne in der Wohnung im 2. Stock an der Bahnhofstrasse 12. Leider funktioniert die Heizung seit drei Tagen nicht mehr. Es ist sehr kalt in der Wohnung, besonders in der Nacht.\n\nIch möchte Sie bitten, die Heizung so schnell wie möglich reparieren zu lassen.\n\nIch bin jeden Tag ab 17 Uhr zu Hause, am Samstag den ganzen Tag. Sie erreichen mich unter der Nummer 079 123 45 67.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\nMuayad Jamal",
 sampleT:{
  ar:"السيد كيلر المحترم،\n\nأنا ساكن بالشقة بالطابق التاني بشارع Bahnhofstrasse رقم 12. للأسف التدفئة ما عم تشتغل من 3 أيام. الشقة باردة كتير، خصوصاً بالليل.\n\nبطلب منك تبعت حدا يصلّح التدفئة بأسرع وقت.\n\nأنا بالبيت كل يوم من الساعة 5 المسا، ويوم السبت طول النهار. فيك تتصل فيي عالرقم 079 123 45 67.\n\nشكراً سلفاً.\n\nمع التحيات\nمؤيد جمال",
  uk:"Шановний пане Келлер,\n\nя живу в квартирі на 2-му поверсі на Bahnhofstrasse, 12. На жаль, уже три дні не працює опалення. У квартирі дуже холодно, особливо вночі.\n\nПрошу вас якнайшвидше організувати ремонт опалення.\n\nЯ щодня вдома з 17:00, а в суботу — цілий день. Зі мною можна зв'язатися за номером 079 123 45 67.\n\nЗаздалегідь дякую.\n\nЗ повагою\nМуаяд Джамаль",
  tr:"Sayın Bay Keller,\n\nBahnhofstrasse 12 numarada, 2. kattaki dairede oturuyorum. Maalesef kalorifer üç gündür çalışmıyor. Daire çok soğuk, özellikle geceleri.\n\nKaloriferi mümkün olan en kısa sürede tamir ettirmenizi rica ediyorum.\n\nHer gün saat 17'den sonra evdeyim, cumartesi ise bütün gün. Bana 079 123 45 67 numarasından ulaşabilirsiniz.\n\nŞimdiden teşekkür ederim.\n\nSaygılarımla\nMuayad Jamal",
  en:"Dear Mr Keller,\n\nI live in the flat on the 2nd floor at Bahnhofstrasse 12. Unfortunately, the heating hasn't worked for three days. It is very cold in the flat, especially at night.\n\nI would like to ask you to have the heating repaired as quickly as possible.\n\nI am at home every day from 5 pm, and all day on Saturday. You can reach me on 079 123 45 67.\n\nThank you in advance.\n\nKind regards\nMuayad Jamal"}},

{id:"meinung", formal:false, groups:["meinung"],
 t:{de:"Meinung im Forum: Smart Home",ar:"رأيك بالمنتدى: البيت الذكي",uk:"Думка на форумі: розумний будинок",tr:"Forumda görüş: Akıllı ev",en:"Forum opinion: smart homes"},
 task:{de:"Im Forum wird diskutiert: «Smart Home – ist das eine gute Idee?» Schreiben Sie Ihre Meinung (ca. 80 Wörter).",
  ar:"بالمنتدى عم يناقشوا: «البيت الذكي، فكرة منيحة؟» اكتب رأيك (حوالي 80 كلمة).",
  uk:"На форумі обговорюють: «Розумний будинок — це добра ідея?» Напишіть свою думку (близько 80 слів).",
  tr:"Forumda tartışılıyor: «Akıllı ev iyi bir fikir mi?» Görüşünüzü yazın (yaklaşık 80 kelime).",
  en:"A forum is discussing: 'Smart homes – a good idea?' Write your opinion (about 80 words)."},
 points:[
  {de:"Ihre Meinung",ar:"رأيك",uk:"Ваша думка",tr:"Görüşünüz",en:"Your opinion"},
  {de:"Ein Vorteil",ar:"إيجابية وحدة",uk:"Одна перевага",tr:"Bir avantaj",en:"One advantage"},
  {de:"Ein Nachteil",ar:"سلبية وحدة",uk:"Один недолік",tr:"Bir dezavantaj",en:"One disadvantage"},
  {de:"Ein Beispiel oder Ihre Erfahrung",ar:"مثال أو تجربتك",uk:"Приклад або ваш досвід",tr:"Bir örnek ya da deneyiminiz",en:"An example or your experience"}],
 sample:"Ich finde Smart Homes interessant, aber ich bin auch skeptisch.\n\nEinerseits ist die Technik sehr praktisch. Man kann zum Beispiel die Heizung per Handy steuern und so Energie sparen.\n\nAndererseits sind die Geräte oft teuer. Außerdem mache ich mir Sorgen um meine Daten, denn ich weiß nicht, wer sie bekommt.\n\nMeiner Meinung nach braucht man nicht so viel Technik, um gemütlich zu wohnen. Deshalb würde ich nur ein paar smarte Geräte kaufen.",
 sampleT:{
  ar:"بلاقي البيوت الذكية شي مثير للاهتمام، بس عندي شكوك كمان.\n\nمن جهة، التكنولوجيا عملية كتير. مثلاً فيك تتحكّم بالتدفئة بالموبايل وهيك بتوفّر طاقة.\n\nومن جهة تانية، الأجهزة غالباً غالية. وكمان أنا قلقان على بياناتي، لأني ما بعرف مين بياخدها.\n\nبرأيي ما بيلزم هالقد تكنولوجيا لتعيش براحة. لهيك كنت رح اشتري بس كم جهاز ذكي.",
  uk:"Я вважаю розумні будинки цікавими, але ставлюся до них і скептично.\n\nЗ одного боку, техніка дуже практична. Наприклад, можна керувати опаленням через телефон і так економити енергію.\n\nЗ іншого боку, пристрої часто дорогі. Крім того, я хвилююся за свої дані, бо не знаю, хто їх отримує.\n\nНа мою думку, щоб жити затишно, не потрібно стільки техніки. Тому я купив би лише кілька розумних пристроїв.",
  tr:"Akıllı evleri ilginç buluyorum, ama biraz da şüpheliyim.\n\nBir yandan teknoloji çok pratik. Örneğin kaloriferi telefonla kontrol edip böylece enerji tasarrufu yapabilirsiniz.\n\nÖte yandan cihazlar genellikle pahalı. Ayrıca verilerim konusunda endişeleniyorum, çünkü onları kimin aldığını bilmiyorum.\n\nBence rahat yaşamak için bu kadar teknolojiye gerek yok. Bu yüzden sadece birkaç akıllı cihaz alırdım.",
  en:"I find smart homes interesting, but I'm also sceptical.\n\nOn the one hand, the technology is very practical. For example, you can control the heating with your phone and save energy that way.\n\nOn the other hand, the devices are often expensive. I'm also worried about my data, because I don't know who gets it.\n\nIn my opinion you don't need so much technology to live comfortably. That's why I would only buy a few smart devices."}}
];

const LAT=/(?:-(?=[A-Za-zÄÖÜäöüß])|[*A-Za-zÄÖÜäöüßÉé])[^\u0600-\u06FF<>←→]*[A-Za-zÄÖÜäöüß0-9.?!…)*]|[A-Za-zÄÖÜäöüß]/g;

  if(!/[A-Za-zÄÖÜäöüß]/.test(m))return m;

  if(odd(m)&&m.startsWith("**")){pre="**";m=m.slice(2)}
  if(odd(m)&&m.endsWith("**")){post="**";m=m.slice(0,-2)}

// word-level diff (LCS); returns HTML with <del> for removed and <ins> for added words
function wdiff(a,b){
  const tok=x=>String(x).replace(/\r/g,"").replace(/\n/g," \n ").split(/ +/).filter(w=>w!=="");
  const A=tok(a),B=tok(b),n=A.length,m=B.length;
  if(n*m>250000)return esc(b).replace(/\n/g,"<br>");
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  const w=(x,tag)=>x==="\n"?"<br>":tag?`<${tag}>${esc(x)}</${tag}>`:esc(x);

  while(i<n)out.push(w(A[i++],"del"));while(j<m)out.push(w(B[j++],"ins"));

// ───── view state (not persisted)
const W={topic:"all",mode:"cards",dir:"de",onlyNew:false,queue:[],idx:0,search:""};
const SZ={topic:"all",list:[],idx:0,placed:[],tiles:[],answered:false,tries:0,right:0,fb:null};
const G={open:null};
const Q={running:false,mode:null,topic:null,items:[],idx:0,picked:null,score:0,wrong:[],done:false};

let confirmReset=false;

// ───── shell
function applyLang(){
  const d=LANGS[L()].dir;
  document.documentElement.lang=L();document.documentElement.dir=d;
  $("appName").textContent=t("app");$("appLevel").textContent=t("level");
  $("langLbl").textContent=t("lang");
  $("lang").innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===L()?" selected":""}>${v.label}</option>`).join("");
  document.title=t("app");
}
function renderNav(){
  $("nav").innerHTML=TABS.map(([k,n])=>`<button data-act="tab" data-tab="${k}"${S.tab===k?' aria-current="page"':""}>${svg(k)}<span>${n}</span></button>`).join("");
}
function vName(){
  return `<section class="welcome gate">
    <div><p class="eyebrow">${esc(t("level"))}</p><h1>${esc(t("name_title"))}</h1><p>${esc(t("name_hint"))}</p></div>
    <img alt="" src="${LOGO}">
  </section>
  <form class="sheet namef" id="namef" novalidate>
    <label for="nameIn" class="eyebrow">${esc(t("name_ph"))}</label>
    <input id="nameIn" class="search" type="text" maxlength="40" autocomplete="name" placeholder="${esc(t("name_ph"))}" value="${esc(S.pendingName||"")}">
    <button class="btn pri" type="submit">${esc(t("name_go"))}</button>
    <p class="muted" style="font-size:.86rem">🔒 ${esc(t("name_note"))}</p>
  </form>`;
}
function render(){
  const v=$("view");
  document.querySelector(".nav").hidden=!S.name;
  if(!S.name){$("nav").innerHTML="";v.innerHTML=`<div class="view">${vName()}</div>`;return}
  renderNav();
  const f={start:vStart,words:vWords,satz:vSatz,listen:vListen,grammar:vGrammar,quiz:vQuiz,writing:vWriting}[S.tab]||vStart;
  v.innerHTML=`<div class="view">${f()}</div>`;
  if(S.tab==="words"&&W.mode==="list")fillList();
  exTick();
}
function go(tab){S.tab=tab;save();render();window.scrollTo(0,0)}

// ───── START
function vStart(){
  const known=V.filter(w=>S.known[w.id]).length;
  const satz=SB.filter(s=>S.satz[s.id]).length;
  const day=Math.floor(Date.now()/864e5);
  const g=GRAMMAR[day%GRAMMAR.length];
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const secs=[
    ["words","sec_words",t("d_words",{n:V.length})],
    ["satz","sec_sentences",t("d_sentences",{n:SB.length})],
    ["grammar","sec_grammar",t("d_grammar",{n:GRAMMAR.length})],
    ["listen","sec_listen",t("d_listen")],
    ["quiz","sec_quiz",t("d_quiz")],
    ["writing","sec_writing",t("d_writing")]];
  return `
  <section class="welcome">
    <div><p class="eyebrow">${esc(t("level"))}</p><h1>${esc(t("app"))}</h1><p>${esc(t("hello_name",{n:S.name}))}</p></div>
    <img alt="" src="${LOGO}">
    <div class="gender"><span class="a-der">der</span><span class="a-die">die</span><span class="a-das">das</span></div>
  </section>
  ${vFbCard()}
  ${vRvCard()}
  ${vExamCard()}
  <section class="sheet">
    <p class="eyebrow">${esc(t("progress"))}</p>
    <div class="stats">
      <div class="stat"><b>${known}<span class="muted" style="font-size:.55em"> / ${V.length}</span></b><div class="bar"><i style="width:${pct(known,V.length)}%"></i></div><small>${esc(t("sec_words"))}</small></div>
      <div class="stat"><b>${satz}<span class="muted" style="font-size:.55em"> / ${SB.length}</span></b><div class="bar"><i style="width:${pct(satz,SB.length)}%"></i></div><small>${esc(t("sec_sentences"))}</small></div>
      <div class="stat"><b>${S.quizDone||0}</b><div class="bar"><i style="width:${Math.min(100,(S.quizDone||0)*10)}%"></i></div><small>${esc(t("sec_quiz"))}</small></div>
    </div>
  </section>
  <section class="sheet">
    <p class="eyebrow">${esc(t("sections"))}</p>
    <div class="menu">${secs.map(([k,n,d],i)=>`<button class="item" data-act="tab" data-tab="${k}"><span class="no">${i+1}</span><span class="txt"><b>${esc(t(n))}</b><small>${esc(d)}</small></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>`).join("")}</div>
  </section>
  <article class="sheet tip" data-act="openG" data-g="${g.id}" style="cursor:pointer">
    <p class="eyebrow">${esc(t("tipTitle"))} · <span class="de">${esc(g.de)}</span></p>
    <p>${md(tr(g.tip))}</p>
  </article>
  <div class="reset">${confirmReset
    ?`<p>${esc(t("resetQ"))}</p><div class="row"><button class="btn" data-act="resetNo">${esc(t("no"))}</button><button class="btn again" data-act="resetYes">${esc(t("yes"))}</button></div>`
    :`<button class="linkish" data-act="changeName">${esc(t("change_name"))}</button><button class="linkish" data-act="resetAsk">${esc(t("reset"))}</button>`}</div>`;
}

function szStart(){

function szLoad(){
  SZ.placed=[];SZ.answered=false;SZ.tries=0;SZ.fb=null;
  const s=SZ.list[SZ.idx];if(!s)return;
  SZ.tiles=shuf([...s.a.split(" "),...s.x]).map((w,i)=>({w,i}));
}
const norm=s=>s.toLowerCase().replace(/\s+/g," ").trim();
const pretty=(s,p)=>{s=s.replace(/ ,/g,",");return s.charAt(0).toUpperCase()+s.slice(1)+p};
function vSatz(){
  if(!SZ.list.length)szStart();

  if(SZ.idx>=SZ.list.length){

  }
  const s=SZ.list[SZ.idx];
  const placed=SZ.placed.map(i=>SZ.tiles.find(x=>x.i===i));
  const railCls=SZ.fb?(SZ.fb.kind==="ok"?" ok":(SZ.fb.kind==="bad"&&SZ.fb.final!==undefined?" bad":"")):"";
  h+=`<div class="panel prompt">
      <div class="meta"><span class="de">${esc(GI[s.g].de)}</span><span style="font-variant-numeric:tabular-nums">${SZ.idx+1} / ${SZ.list.length}</span></div>
      <p class="q">${esc(tr(s.tr))}</p></div>
    <div class="rail${railCls}" dir="ltr" aria-label="${esc(t("tapWords"))}">${placed.length?placed.map(o=>`<button class="tile${o.w===","?" p":""}" data-act="szUn" data-i="${o.i}">${esc(o.w)}</button>`).join(""):`<span class="ph">${esc(t("tapWords"))}</span>`}</div>

  if(SZ.fb)h+=SZ.fb.html;
  h+=`<div class="trio">
      <button class="btn" data-act="szHint"${SZ.answered?" disabled":""}>${esc(t("hint"))} 💡</button>
      <button class="btn" data-act="szClear"${SZ.answered?" disabled":""}>${esc(t("clear"))}</button>
      ${SZ.answered?`<button class="btn ok wide" data-act="szNext">${esc(t("next"))} →</button>`:`<button class="btn pri wide" data-act="szCheck">${esc(t("check"))} ✓</button>`}
    </div>`;
  return h;
}
function szCheck(){
  const s=SZ.list[SZ.idx];if(!SZ.placed.length)return;
  const mine=SZ.placed.map(i=>SZ.tiles.find(x=>x.i===i).w).join(" ");
  const ok=[s.a,...s.alt].some(a=>norm(a)===norm(mine));
  SZ.tries++;
  const tip=`<p>${md(tr(GI[s.g].tip))}</p>`;
  if(ok){
    SZ.answered=true;if(SZ.tries===1){SZ.right++;rvRight("s|"+s.id)}else rvWrong("s|"+s.id);S.satz[s.id]=1;save();
    logAnswer({section:"Satzbau",topic:GI[s.g].de,q:tr(s.tr),a:pretty(mine,s.p),ok:true,right:pretty(s.a,s.p),tries:SZ.tries});
    const full=pretty(mine,s.p);
    SZ.fb={kind:"ok",html:`<div class="fb ok"><span class="t">${esc(t("correct"))}</span><div class="line"><span class="de">${esc(full)}</span>${sayBtn(full)}</div>${tip}</div>`};
  }else if(SZ.tries<2){
    SZ.fb={kind:"bad",html:`<div class="fb bad"><span class="t">${esc(t("tryAgain"))}</span>${tip}</div>`};
  }else{
    SZ.answered=true;const full=pretty(s.a,s.p);rvWrong("s|"+s.id);
    logAnswer({section:"Satzbau",topic:GI[s.g].de,q:tr(s.tr),a:pretty(mine,s.p),ok:false,right:full,tries:SZ.tries});
    SZ.list.push(s);
    SZ.fb={kind:"bad",final:true,html:`<div class="fb bad"><span class="t">${esc(t("answerIs"))}</span><div class="line"><span class="de">${esc(full)}</span>${sayBtn(full)}</div>${tip}</div>`};
  }
  render();
}

function qArticleItem(w){
  const m=/^(der|die|das)\s(.+)$/.exec(w.de);
  return {art:true,key:"a|"+w.id,q:m[2]+" ("+tr(w.tr)+")",topic:"der/die/das",prompt:`<p class="qtext center">${esc(m[2])}</p><p class="muted" style="text-align:center">${esc(tr(w.tr))}</p>`,

function wrongPart(v){
  const [inf,,part]=v;
  if(!/^ge/.test(part))return "ge"+part;
  if(/en$/.test(part)){const stem=inf.replace(/e?n$/,"");return "ge"+stem+"t"}
  if(/et$/.test(part))return part.slice(0,-2)+"en";
  return part.slice(0,-1)+"en";
}
function qPartItem(v){
  const aux=v[3]==="s"?"ist":"hat",other=v[3]==="s"?"hat":"ist";
  const correct=aux+" "+v[2];
  let opts=[correct,other+" "+v[2],aux+" "+wrongPart(v)];
  opts=[...new Set(opts)];
  return {key:"p|"+v[0],q:v[0],topic:"Partizip II",prompt:`<p class="qtext">${esc(t("q_which"))} <b>${esc(v[0])}</b>?</p>`,
    after:`<p class="qtext">${esc(v[0])} – ${esc(v[1])} – <span class="blank f">${esc(correct)}</span></p>`,
    options:shuf(opts),correct,explain:`<p>${md(tr(GI.perfekt.tip))}</p>`,say:`${v[0]}, ${v[1]}, ${correct}`,review:`${v[0]} – ${v[1]} – ${correct}`};
}

// ───── EXAM
const EXV={open:false,result:null,confirm:false,quit:false,tr:{}};
let exTimer=null;
function sshuf(a,seed){let h=7;for(const c of seed)h=(h*31+c.charCodeAt(0))|0;if(!h)h=1;const r=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296};a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const exParts=ex=>ex.parts.filter(p=>p.type!=="write");
const examMax=ex=>exParts(ex).reduce((n,p)=>n+p.items.length,0);
const exById=id=>EXAMS.find(e=>e.id===id);
function exCorrect(p,it){return p.type==="rf"?(it[1]?"r":"f"):p.type==="match"?it[1]:p.type==="gap"?it[0]:p.type==="listen"?it[2][0]:it[1][0]}
const exLabel=(p,v)=>v==null||v===""?"—":p.type==="rf"?(v==="r"?"richtig":"falsch"):p.type==="match"?v.toUpperCase():v;
function exLeft(){const ex=exById(S.exam.id);return Math.max(0,Math.round(ex.minutes*60-(Date.now()-S.exam.start)/1000))}
const mmss=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function exTick(){
  clearInterval(exTimer);exTimer=null;
  if(!S.exam||!EXV.open||S.tab!=="quiz")return;
  exTimer=setInterval(()=>{
    if(!S.exam){clearInterval(exTimer);return}
    const l=exLeft(),el=$("exTime");
    if(el){el.textContent=mmss(l);el.classList.toggle("low",l<300)}
    if(l<=0){clearInterval(exTimer);exSubmit(true)}
  },1000);
}
function exStart(id){
  if(!S.exam||S.exam.id!==id)S.exam={id,start:Date.now(),part:0,ans:{},plays:{},write:""};
  EXV.open=true;EXV.result=null;EXV.confirm=false;EXV.quit=false;save();
}
function vExamPart(p,pi){
  const A=S.exam.ans,k=i=>pi+"-"+i,sel=(i,v)=>A[k(i)]===v;
  const opt=(i,v,label,cls)=>`<button class="xo${cls?" "+cls:""}" data-act="exAns" data-k="${k(i)}" data-v="${esc(v)}" aria-pressed="${sel(i,v)}">${esc(label)}</button>`;
  const textBox=()=>`<article class="xtext">${p.head?`<h3 class="de">${esc(p.head)}</h3>`:""}${p.text.split("\n\n").map(x=>`<p>${esc(x).replace(/\n/g,"<br>")}</p>`).join("")}</article>`;
  if(p.type==="rf")return textBox()+`<ol class="xitems">${p.items.map((it,i)=>`<li><p class="de">${esc(it[0])}</p><div class="xrow">${opt(i,"r","richtig")}${opt(i,"f","falsch")}</div></li>`).join("")}</ol>`;
  if(p.type==="mc")return textBox()+`<ol class="xitems">${p.items.map((it,i)=>`<li><p class="de"><b>${esc(it[0])}</b></p><div class="xcol">${sshuf(it[1],S.exam.id+pi+i).map(o=>opt(i,o,o)).join("")}</div></li>`).join("")}</ol>`;
  if(p.type==="match")return `<div class="xads">${p.ads.map(a=>`<div class="xad"><span class="xl">${a[0].toUpperCase()}</span><p class="de">${esc(a[1])}</p></div>`).join("")}</div>
    <ol class="xitems">${p.items.map((it,i)=>`<li><p class="de">${esc(it[0])}</p><div class="xrow wrap">${p.ads.map(a=>opt(i,a[0],a[0].toUpperCase(),"sq")).join("")}${opt(i,"x","X","sq")}</div></li>`).join("")}</ol>
    <p class="muted" style="font-size:.85rem">X = ${esc(t("ex_none"))}</p>`;
  if(p.type==="gap"){
    const txt=esc(p.text).replace(/\{(\d+)\}/g,(m,n)=>{const v=A[k(+n-1)];return `<span class="gapmk${v?" f":""}"><sup>${n}</sup>${v?esc(v):"……"}</span>`}).split("\n\n").map(x=>`<p>${x.replace(/\n/g,"<br>")}</p>`).join("");
    return `<article class="xtext">${txt}</article><ol class="xitems gaps">${p.items.map((it,i)=>`<li><div class="xrow wrap">${sshuf(it,S.exam.id+pi+i).map(o=>opt(i,o,o)).join("")}</div></li>`).join("")}</ol>`;
  }
  if(p.type==="listen")return `${canSpeak?"":`<p class="fb bad">${esc(t("ex_noaudio"))}</p>`}<ol class="xitems">${p.items.map((it,i)=>{const pl=S.exam.plays[k(i)]||0,show=!canSpeak||EXV.tr[k(i)];
    return `<li><div class="xrow">${canSpeak?`<button class="btn xplay" data-act="exPlay" data-k="${k(i)}" data-i="${i}" data-p="${pi}"${pl>=2?" disabled":""}>▶ ${esc(t("listen"))}</button><small class="muted">${esc(t("ex_plays",{n:pl}))}</small>`:""}${!canSpeak||pl<2?"":`<button class="linkish" data-act="exTr" data-k="${k(i)}">${esc(t("ex_transcript"))}</button>`}</div>
    ${show?`<p class="de xtr">${esc(it[0])}</p>`:""}<p class="de"><b>${esc(it[1])}</b></p><div class="xcol">${sshuf(it[2],S.exam.id+pi+i).map(o=>opt(i,o,o)).join("")}</div></li>`}).join("")}</ol>`;
  if(p.type==="write"){
    const wc=(S.exam.write.trim().match(/\S+/g)||[]).length;
    return `<article class="xtext"><p class="de">${esc(p.task)}</p></article>
    <p class="eyebrow">${esc(t("ex_check"))}</p><ul class="points">${p.points.map(x=>`<li class="de">${esc(x)}</li>`).join("")}</ul>
    <textarea id="exWrite" class="xwrite" lang="de" dir="ltr" spellcheck="false" placeholder="${esc(t("ex_writehere"))}">${esc(S.exam.write)}</textarea>
    <p class="muted" style="font-size:.85rem"><span id="exWc">${esc(t("ex_words",{n:wc}))}</span> · ${esc(t("ex_min",{n:p.min}))}</p>`;
  }
  return "";

function exSubmit(auto){
  if(!S.exam)return;
  const ex=exById(S.exam.id),A=S.exam.ans;let score=0,max=0;const parts=[],mistakes=[];
  ex.parts.forEach((p,pi)=>{
    if(p.type==="write")return;
    let ps=0;
    p.items.forEach((it,i)=>{const c=exCorrect(p,it),v=A[pi+"-"+i];max++;
      if(v===c){ps++;score++}
      else{const q=p.type==="gap"?"Lücke "+(i+1):p.type==="listen"?it[1]:it[0];mistakes.push({part:p.title,q,your:exLabel(p,v),right:exLabel(p,c)})}});
    parts.push({title:p.title,score:ps,max:p.items.length});
  });
  const pct=Math.round(score/max*100),pass=pct>=60,wp=ex.parts.find(p=>p.type==="write");
  const res={id:ex.id,title:ex.title,score,max,pct,pass,parts,mistakes,write:S.exam.write.trim(),task:wp?wp.task:"",auto:!!auto,date:Date.now()};
  S.examBest[ex.id]=Math.max(S.examBest[ex.id]||0,pct);S.examLast=res;S.exam=null;save();
  logAnswer({section:"Prüfung",topic:ex.title,q:parts.map(x=>x.title+" "+x.score+"/"+x.max).join(" · "),a:score+" / "+max+" ("+pct+"%)",ok:pass,tries:auto?"Zeit abgelaufen":""});
  if(res.write){const wid=newWid();S.sent[wid]={task:"exam:"+ex.id,topic:ex.title+" · Schreiben",text:res.write,t:Date.now()};save();
    logAnswer({section:"Prüfung-Schreiben",topic:ex.title,q:res.task,a:res.write,ok:"",right:"W:"+wid,tries:(res.write.match(/\S+/g)||[]).length+" Wörter"})}
  mistakes.forEach(m=>logAnswer({section:"Prüfung",topic:ex.title+" · "+m.part,q:m.q,a:m.your,ok:false,right:m.right}));
  clearInterval(exTimer);EXV.open=false;EXV.result=res;EXV.confirm=false;
  if(S.tab==="quiz")render();window.scrollTo(0,0);
}

const H={mode:null,items:[],idx:0,picked:null,res:null,score:0,done:false,show:false,rate:.95};
const rnd=n=>Math.floor(Math.random()*n);
function zzItem(){
  const k=["time","price","num","tel"][rnd(4)];
  if(k==="time"){const h=rnd(24),m=[0,5,10,15,20,25,30,35,40,45,50,55,7,13,48][rnd(15)];return {k,say:m?h+" Uhr "+m:h+" Uhr",ans:h+":"+String(m).padStart(2,"0"),hint:"h_hint_time"}}
  if(k==="price"){const f=rnd(90)+1,r=[0,5,10,20,25,40,50,60,75,80,90,95][rnd(12)];return {k,say:r?f+" Franken "+r:f+" Franken",ans:f+"."+String(r).padStart(2,"0"),hint:"h_hint_price"}}
  if(k==="num"){const n=[13+rnd(87),100+rnd(900),1000+rnd(9000),1900+rnd(130)][rnd(4)];return {k,say:String(n),ans:String(n),hint:"h_hint_num"}}
  const d=()=>rnd(10),p=()=>10+rnd(90);const a="07"+[6,7,8,9][rnd(4)],b=""+d()+d()+d(),c=p(),e=p();
  return {k,say:a.split("").join(" ")+", "+b.split("").join(" ")+", "+c+", "+e,ans:a+" "+b+" "+c+" "+e,hint:"h_hint_tel"};
}
function zzOk(it,v){
  v=String(v).trim();
  if(it.k==="time"){const m=v.match(/(\d{1,2})\s*[:.hH ]?\s*(\d{2})?/);if(!m)return false;const [h,mm]=it.ans.split(":").map(Number);return +m[1]===h&&(m[2]!=null?+m[2]:0)===mm}
  if(it.k==="price"){const x=parseFloat(v.replace(/(CHF|Fr\.?|Franken|\s)/gi,"").replace(/[.,]–$/,"").replace(",","."));return Math.abs(x-parseFloat(it.ans))<.001}
  return v.replace(/\D/g,"")===it.ans.replace(/\D/g,"");
}
const dkTok=x=>String(x).replace(/[.,!?;:«»"„“()–-]/g," ").split(/\s+/).filter(Boolean);

}

function hCheck(){

let fbLast=0;
function fbLoad(force){
  if(!/^https:/.test(ENDPOINT)||!S.dev||!Object.keys(S.sent).length)return;
  if(!force&&Date.now()-fbLast<30000)return;fbLast=Date.now();
  fetch(ENDPOINT+"?action=feedback&dev="+encodeURIComponent(S.dev),{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(!j||!j.ok||!Array.isArray(j.items))return;let ch=false;
    j.items.forEach(it=>{const o=S.fb[it.wid];if(!o||o.t!==it.t){S.fb[it.wid]=it;ch=true}});
    if(ch){save();if(S.tab==="start"||S.tab==="writing")render()}
  }).catch(()=>{});
}

  ${f?`${f.points!==""&&f.points!=null?`<section class="welcome xres ${+f.points>=12?"pass":"fail"}"><div><p class="eyebrow">${esc(t("wr_points"))}</p><h1 dir="ltr" style="text-align:start">${esc(f.points)} / 20</h1></div><span class="xstamp">✎</span></section>`:""}
    ${f.comment?`<section class="sheet tip"><p class="eyebrow">${esc(t("wr_comment"))}</p><p style="white-space:pre-wrap" dir="auto">${esc(f.comment)}</p></section>`:""}
    <section class="sheet"><p class="eyebrow">${esc(t("wr_fixed"))}</p><p class="muted" style="font-size:.82rem;margin-bottom:8px">${esc(t("wr_diff"))}</p><div class="letter diff">${wdiff(s.text,f.corrected||s.text)}</div></section>`
   :`<p class="fb">${esc(t("wr_pending"))} ⏳</p>`}
  <section class="sheet"><p class="eyebrow">${esc(t("wr_orig"))}</p><pre class="letter">${esc(s.text)}</pre></section>`;
}

// ───── WRITING
function phraseGroup(k){
  const g=PHRASES[k];
  return `<section class="panel pgroup"><h3>${esc(tr(g.n))}</h3>${g.p.map(([de,o])=>`<div class="phr"><div class="txt"><span class="de block">${esc(de)}</span><small>${esc(tr(o))}</small></div>${sayBtn(de)}</div>`).join("")}</section>`;
}
function vWriting(){
  if(WR.open==="corr")return WR.corr?vCorr(WR.corr):vCorrList();
  if(WR.open==="phrases")return `<button class="back" data-act="closeW">${BACK_IC}${esc(t("back"))}</button><h2>${esc(t("phrases"))}</h2>${Object.keys(PHRASES).map(phraseGroup).join("")}`;
  const w=WRITING.find(x=>x.id===WR.open);
  if(w){
    return `<button class="back" data-act="closeW">${BACK_IC}${esc(t("back"))}</button>
    <div><span class="badge">${esc(w.formal?t("formal"):t("informal"))}</span><h2 style="margin-top:6px">${esc(tr(w.t))}</h2><p class="de block muted">${esc(w.t.de)}</p></div>
    <section class="panel task"><p class="eyebrow">${esc(t("task"))}</p><p class="de block">${esc(w.task.de)}</p><p class="muted">${esc(tr(w.task))}</p></section>
    <section class="panel task"><p class="eyebrow">${esc(t("points"))}</p><ul class="points">${w.points.map(p=>`<li><span class="de">${esc(p.de)}</span> <small class="muted">· ${esc(tr(p))}</small></li>`).join("")}</ul></section>
    <section class="sheet wrme"><h3>✍️ ${esc(t("wr_mine"))}</h3><p class="muted" style="font-size:.88rem">${esc(t("wr_mine_d"))}</p>
      <textarea id="wrIn" data-id="${w.id}" class="xwrite" lang="de" dir="ltr" spellcheck="false" placeholder="${esc(t("ex_writehere"))}">${esc(S.drafts[w.id]||"")}</textarea>
      <p class="muted" style="font-size:.85rem"><span id="wrWc">${esc(t("ex_words",{n:((S.drafts[w.id]||"").trim().match(/\S+/g)||[]).length}))}</span> · ${esc(t("ex_min",{n:80}))}</p>
      ${WR.msg==="short"?`<p class="fb bad">${esc(t("wr_short",{n:30}))}</p>`:WR.msg==="sent"?`<p class="fb ok">${esc(t("wr_sent"))}</p>`:""}
      <button class="btn gold" data-act="wrSend" data-id="${w.id}">${esc(t("wr_send"))} ✉</button>
      ${Object.keys(S.sent).filter(k=>S.sent[k].task===w.id).length?`<button class="linkish" data-act="corrList">${esc(t("wr_corr"))} (${Object.keys(S.sent).filter(k=>S.sent[k].task===w.id).length})</button>`:""}
    </section>
    <div class="row" style="justify-content:space-between"><h3>${esc(t("sample"))}</h3><div class="row"><button class="tog" data-act="wrTr" aria-pressed="${WR.showTr}">${esc(WR.showTr?t("hideTr"):t("showTr"))}</button><button class="tog" data-act="wrCopy" id="copyBtn">${esc(t("copy"))}</button></div></div>
    <pre class="letter" id="letter">${esc(w.sample)}</pre>
    ${WR.showTr?`<pre class="letter trn">${esc(tr(w.sampleT))}</pre>`:""}
    <h3>${esc(t("phrases"))}</h3>
    ${w.groups.map(phraseGroup).join("")}`;
  }
  const nSent=Object.keys(S.sent).length,nNew=Object.keys(S.fb).filter(k=>S.sent[k]&&!S.fbSeen[k]).length;
  return `<h2>${esc(t("sec_writing"))}</h2>
  ${vFbCard()}
  ${nSent?`<button class="mode" data-act="corrList"><span class="ic">✉</span><span class="txt"><b>${esc(t("wr_corr"))}</b><small>${nSent}</small></span>${nNew?`<span class="badge newb">${nNew}</span>`:""}</button>`:""}
  <div class="wlist2">${WRITING.map(w=>`<button class="mode" data-act="openW" data-w="${w.id}"><span class="ic">${svg("writing")}</span><span class="txt"><b>${esc(tr(w.t))}</b><small class="de">${esc(w.t.de)}</small><small>${esc(w.formal?t("formal"):t("informal"))}</small></span></button>`).join("")}
  <button class="mode" data-act="openW" data-w="phrases"><span class="ic de">Aa</span><span class="txt"><b>${esc(t("phrases"))}</b><small class="de">Redemittel</small></span></button></div>`;
}

// ───── events
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="say"){e.stopPropagation();speak(el.dataset.say);return}
  switch(a){
    case "tab":confirmReset=false;if(el.dataset.tab==="writing"){fbLoad();if(S.tab==="writing")WR.open=null}if(el.dataset.tab==="listen"&&S.tab==="listen")H.mode=null;if(el.dataset.tab==="grammar"&&S.tab==="grammar")G.open=null;if(el.dataset.tab==="writing"&&S.tab==="writing")WR.open=null;if(el.dataset.tab==="quiz"&&S.tab==="quiz"){if(Q.done)Q.running=false;EXV.result=null}go(el.dataset.tab);break;
    case "hStart":hStart(el.dataset.m);if(S.tab!=="listen")S.tab="listen";save();render();window.scrollTo(0,0);break;
    case "hMenu":H.mode=null;render();window.scrollTo(0,0);break;
    case "hPlay":{const it=H.items[H.idx];if(it)speakLines(it.lines,+el.dataset.r);break}
    case "hShow":H.show=!H.show;render();break;
    case "hPick":{if(H.picked!=null)return;const it=H.items[H.idx];H.picked=el.dataset.v;const ok=H.picked===it.right;if(ok)H.score++;logAnswer({section:"Hören",topic:"Hörverstehen",q:it.q,a:H.picked,ok,right:it.right});render();break}
    case "hNext":H.idx++;H.picked=null;H.res=null;H.show=false;if(H.idx>=H.items.length)H.done=true;render();if(!H.done){const i=$("hIn");if(i)i.focus()}break;
    case "wrSend":{const id=el.dataset.id,w=WRITING.find(x=>x.id===id),txt=(S.drafts[id]||"").trim(),wc=(txt.match(/\S+/g)||[]).length;
      if(wc<30){WR.msg="short";render();break}
      const wid=newWid();S.sent[wid]={task:id,topic:w.t.de,text:txt,t:Date.now()};delete S.drafts[id];save();
      logAnswer({section:"Schreiben",topic:w.t.de,q:w.task.de,a:txt,ok:"",right:"W:"+wid,tries:wc+" Wörter"});
      WR.msg="sent";render();break}
    case "corrList":WR.open="corr";WR.corr=null;fbLoad(true);if(S.tab!=="writing")S.tab="writing";save();render();window.scrollTo(0,0);break;
    case "corrOpen":WR.open="corr";WR.corr=el.dataset.w;S.fbSeen[el.dataset.w]=1;if(S.tab!=="writing")S.tab="writing";save();render();window.scrollTo(0,0);break;
    case "rvGo":{const k=el.dataset.k;if(k==="q"){qStart("review");go("quiz")}else if(k==="s"){SZ.topic="review";szStart();go("satz")}else{W.topic="review";W.mode="cards";wBuild(false);go("words")}break}
    case "exMenu":EXV.result=null;Q.running=false;if(S.exam)EXV.open=true;go("quiz");break;
    case "exStart":exStart(el.dataset.id);S.tab="quiz";save();render();window.scrollTo(0,0);break;
    case "exGo":{const i=+el.dataset.i,ex=S.exam&&exById(S.exam.id);if(!ex||i<0||i>=ex.parts.length)return;S.exam.part=i;EXV.confirm=false;save();render();window.scrollTo(0,0);break}
    case "exAns":{if(!S.exam)return;S.exam.ans[el.dataset.k]=el.dataset.v;save();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case "exPlay":{if(!S.exam)return;const k=el.dataset.k,ex=exById(S.exam.id),it=ex.parts[+el.dataset.p].items[+el.dataset.i];const n=S.exam.plays[k]||0;if(n>=2)return;S.exam.plays[k]=n+1;save();speak(it[0]);const y=window.scrollY;render();window.scrollTo(0,y);break}
    case "exTr":{EXV.tr[el.dataset.k]=!EXV.tr[el.dataset.k];const y=window.scrollY;render();window.scrollTo(0,y);break}
    case "exAsk":EXV.confirm=true;render();break;
    case "exNo":EXV.confirm=false;render();break;
    case "exDo":exSubmit(false);break;
    case "exQuit":EXV.quit=true;render();break;
    case "exQuitNo":EXV.quit=false;render();break;
    case "exQuitYes":S.exam=null;EXV.open=false;EXV.quit=false;save();render();window.scrollTo(0,0);break;
    case "exBack":EXV.result=null;Q.running=false;render();window.scrollTo(0,0);break;
    case "changeName":S.name="";save();render();window.scrollTo(0,0);break;
    case "resetAsk":confirmReset=true;render();break;
    case "resetNo":confirmReset=false;render();break;
    case "resetYes":S.known={};S.satz={};S.quizDone=0;S.quizBest={};save();confirmReset=false;W.queue=[];W.idx=0;render();break;
    // words
    case "wTopic":W.topic=el.dataset.k;wBuild(false);render();break;
    case "wMode":W.mode=el.dataset.m;render();break;
    case "wDir":W.dir=W.dir==="de"?"my":"de";render();break;
    case "wOnlyNew":W.onlyNew=!W.onlyNew;wBuild(false);render();break;
    case "wShuffle":wBuild(true);render();break;
    case "wRestart":wBuild(false);render();break;
    case "wFlip":el.classList.toggle("flip");break;
    case "wKnow":{const w=W.queue[W.idx];if(w){S.known[w.id]=1;rvRight("w|"+w.id);save()}W.idx++;render();break}
    case "wAgain":{const w=W.queue.splice(W.idx,1)[0];if(w){W.queue.push(w);rvWrong("w|"+w.id);if(S.known[w.id]){delete S.known[w.id];save()}}render();break}
    case "wToggle":{const id=el.dataset.id;if(S.known[id])delete S.known[id];else S.known[id]=1;save();el.setAttribute("aria-pressed",!!S.known[id]);break}
    // satzbau
    case "szTopic":SZ.topic=el.dataset.k;szStart();render();break;
    case "szRestart":szStart();render();break;
    case "szPut":{if(SZ.answered)return;const i=+el.dataset.i;if(!SZ.placed.includes(i)){SZ.placed.push(i);if(SZ.fb&&SZ.fb.kind==="bad")SZ.fb=null;render()}break}
    case "szUn":{if(SZ.answered)return;const i=+el.dataset.i;SZ.placed=SZ.placed.filter(x=>x!==i);if(SZ.fb&&SZ.fb.kind==="bad")SZ.fb=null;render();break}
    case "szClear":if(!SZ.answered){SZ.placed=[];SZ.fb=null;render()}break;
    case "szHint":{const s=SZ.list[SZ.idx];SZ.fb={kind:"hint",html:`<div class="fb bad"><span class="t">${esc(t("hint"))} 💡</span><p>${md(tr(GI[s.g].tip))}</p><p>${esc(t("firstWord"))} <b class="de">${esc(pretty(s.a.split(" ")[0],""))}</b></p></div>`};render();break}
    case "szCheck":szCheck();break;
    case "szNext":SZ.idx++;szLoad();render();break;
    // grammar
    case "openG":G.open=el.dataset.g;if(S.tab!=="grammar")S.tab="grammar";save();render();window.scrollTo(0,0);break;
    case "closeG":G.open=null;render();window.scrollTo(0,0);break;
    case "practiceQ":qStart("topic",el.dataset.g);go("quiz");break;
    case "practiceS":SZ.topic=el.dataset.g;szStart();go("satz");break;
    // quiz
    case "qStart":qStart(el.dataset.m,el.dataset.g);if(S.tab!=="quiz")S.tab="quiz";save();render();window.scrollTo(0,0);break;
    case "qPick":{if(Q.picked!=null)return;const it=Q.items[Q.idx];Q.picked=el.dataset.v;logAnswer({section:"Quiz",topic:it.topic,q:it.q,a:Q.picked,ok:Q.picked===it.correct,right:it.correct,tries:1});if(Q.picked===it.correct){Q.score++;rvRight(it.key)}else{Q.wrong.push({review:it.review,picked:Q.picked});rvWrong(it.key)}render();break}
    case "qNext":Q.idx++;Q.picked=null;if(Q.idx>=Q.items.length){Q.done=true;S.quizDone=(S.quizDone||0)+1;const k=Q.mode==="topic"?"t:"+Q.topic:Q.mode;if(Q.items.length===10||Q.mode==="topic"){S.quizBest[k]=Math.max(S.quizBest[k]||0,Q.score)}save();logAnswer({section:"Quiz-Ergebnis",topic:Q.mode==="topic"?GI[Q.topic].de:Q.mode,q:"",a:Q.score+" / "+Q.items.length,ok:""})}render();window.scrollTo(0,0);break;
    case "qRedo":qStart(Q.mode,Q.topic);render();break;
    case "qMenu":Q.running=false;render();break;
    // writing
    case "openW":WR.open=el.dataset.w;WR.showTr=false;WR.msg=null;render();window.scrollTo(0,0);break;
    case "closeW":WR.open=null;render();window.scrollTo(0,0);break;
    case "wrTr":WR.showTr=!WR.showTr;render();break;
    case "wrCopy":{
      const w=WRITING.find(x=>x.id===WR.open);if(!w)return;
      const done=()=>{el.textContent=t("copied");setTimeout(()=>{if(el.isConnected)el.textContent=t("copy")},1600)};
      const fallback=()=>{const p=$("letter");if(!p)return;const r=document.createRange();r.selectNodeContents(p);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)};
      try{navigator.clipboard.writeText(w.sample).then(done,fallback)}catch(err){fallback()}
      break}
  }
});
document.addEventListener("keydown",e=>{const el=e.target;if(el&&el.id==="wcard"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();el.classList.toggle("flip")}});
document.addEventListener("submit",e=>{
  if(e.target.id==="hForm"){e.preventDefault();hCheck();return}
  if(e.target.id!=="namef")return;e.preventDefault();
  const v=($("nameIn").value||"").replace(/\s+/g," ").trim().slice(0,40);
  if(v.length<2){$("nameIn").focus();$("nameIn").setAttribute("aria-invalid","true");return}
  S.name=v;S.tab="start";save();logAnswer({section:"Start",topic:"",q:"",a:"",ok:""});render();window.scrollTo(0,0);
});
document.addEventListener("input",e=>{
  if(e.target.id==="wrIn"){const id=e.target.dataset.id;S.drafts[id]=e.target.value;save();const wc=(e.target.value.trim().match(/\S+/g)||[]).length,el=$("wrWc");if(el)el.textContent=t("ex_words",{n:wc});return}
  if(e.target.id==="exWrite"&&S.exam){S.exam.write=e.target.value;save();const wc=(e.target.value.trim().match(/\S+/g)||[]).length,el=$("exWc");if(el)el.textContent=t("ex_words",{n:wc});return}if(e.target.id==="wsearch"){W.search=e.target.value;fillList()}});
$("lang").addEventListener("change",e=>{S.lang=e.target.value;save();applyLang();render()});

applyLang();render();flush();fbLoad(true);
})();
</script>
