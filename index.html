<style>
/* Layout: formal language-institute — dark band header carrying the badge, a black/red/gold rule under it,
   white sheets on a cool grey ground, serif display, gold numerals. der/die/das stay blue/red/green. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --ink:#16181d; --muted:#5d636e; --line:#dcdfe5;
  --band:#121316; --band-ink:#ffffff; --band-muted:#a9adb5; --gold:#c9900a; --flag-red:#d0102b; --flag-gold:#f2b705;
  --accent:#16181d; --accent-ink:#ffffff; --ok:#1e7f4f; --ok-bg:#e1f2e8; --bad:#c0392b; --bad-bg:#fbe6e3;
  --der:#2459b8; --die:#c11f3f; --das:#1e8a52; --pl:#6b4fd8;
  --f-ui:"Golos Text","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Golos Text",system-ui,sans-serif;
  --f-de:"Golos Text",system-ui,sans-serif;
  --f-disp:"Source Serif 4","IBM Plex Sans Arabic",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --surface:#17191d; --surface-2:#20232a; --ink:#eceef2; --muted:#9aa0aa; --line:#2b2f37;
  --band:#08090a; --band-ink:#ffffff; --band-muted:#9aa0aa; --gold:#f0b429;
  --accent:#f0b429; --accent-ink:#121316; --ok:#4cc38a; --ok-bg:#15291f; --bad:#f07a6c; --bad-bg:#33201e;
  --der:#74a6ff; --die:#ff7d96; --das:#5bd391; --pl:#a990ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17191d; --surface-2:#20232a; --ink:#eceef2; --muted:#9aa0aa; --line:#2b2f37;
  --band:#08090a; --band-ink:#ffffff; --band-muted:#9aa0aa; --gold:#f0b429;
  --accent:#f0b429; --accent-ink:#121316; --ok:#4cc38a; --ok-bg:#15291f; --bad:#f07a6c; --bad-bg:#33201e;
  --der:#74a6ff; --die:#ff7d96; --das:#5bd391; --pl:#a990ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
html[lang="ar"] body{font-family:var(--f-ar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,#000 0 33.3%,var(--flag-red) 33.3% 66.6%,var(--flag-gold) 66.6%)}
.top-in{max-width:720px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:start}
.mark{width:42px;height:42px;border-radius:50%;flex:none;display:block;background:#000}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:1.08rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brand small{display:block;color:var(--band-muted);font-size:.78rem;line-height:1.2}
.langsel{position:relative;flex:none}
.langsel select option{color:#16181d;background:#fff}
.langsel select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.07);color:var(--band-ink);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:7px 30px 7px 12px;font-size:.88rem;max-width:44vw}
html[dir="rtl"] .langsel select{padding:7px 12px 7px 30px}
.langsel svg{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--band-muted)}
html[dir="rtl"] .langsel svg{inset-inline-end:auto;inset-inline-start:10px}

/* main */
main{max-width:720px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.4rem;letter-spacing:-.005em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.de{font-family:var(--f-de);direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .de.block{text-align:right}
.a-der{color:var(--der);font-weight:700}.a-die{color:var(--die);font-weight:700}.a-das{color:var(--das);font-weight:700}.a-pl{color:var(--pl);font-weight:700}
b{font-weight:700}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--ntabs,7),1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--f-de);font-size:.58rem;letter-spacing:-.02em;font-weight:500;min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--gold);font-weight:700}
.nav button[aria-current="page"] svg{color:var(--gold)}
.nav svg{width:24px;height:24px}

/* generic */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:4px;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;font-size:.8em;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;border-radius:4px;font-size:.86rem}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:var(--r);font-weight:600;font-size:.98rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#121316}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.say{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);display:inline-grid;place-items:center;color:var(--ink);padding:0}
.say svg{width:18px;height:18px}
.back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}

/* start */
.welcome{background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:22px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,#000 0 33.3%,var(--flag-red) 33.3% 66.6%,var(--flag-gold) 66.6%)}
.welcome .eyebrow{color:var(--flag-gold)}
.welcome h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.15;margin:4px 0}
.welcome p{color:var(--band-muted)}
.welcome img{width:84px;height:84px;border-radius:50%}
.welcome .gender{display:flex;gap:6px;margin-top:12px;direction:ltr;font-family:var(--f-de);font-size:.8rem;font-weight:700;grid-column:1/-1}
.welcome .gender span{padding:2px 10px;border-radius:3px;background:#fff}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet .eyebrow{margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-family:var(--f-disp);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:.8rem;line-height:1.25}
.stat .bar{height:3px;border-radius:0}
.stat .bar i{background:var(--gold)}
.menu{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;text-align:start;width:100%}
.item:first-child{border-top:0;padding-top:4px}
.item .no{font-family:var(--f-disp);color:var(--gold);font-weight:700;font-size:1.25rem;width:26px;flex:none;font-variant-numeric:tabular-nums}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .txt b{font-size:1rem}
.item .txt small{color:var(--muted);font-size:.85rem}
.item .chev{color:var(--muted);flex:none}
html[dir="rtl"] .item .chev{transform:scaleX(-1)}
.tip .eyebrow{margin-bottom:6px}
.reset{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.86rem;padding:6px}

.namef{display:flex;flex-direction:column;gap:12px}
.namef .search{font-size:1.1rem;padding:13px 14px}
.namef .search[aria-invalid="true"]{border-color:var(--bad)}
.gate{grid-template-columns:1fr auto}

/* review + exam cards */
.rvcard{display:flex;flex-direction:column;gap:8px}
.duebadge{background:var(--flag-red);color:#fff;font-weight:700;border-radius:3px;padding:1px 8px;font-size:.82rem;font-variant-numeric:tabular-nums}
.rvbtns{display:flex;gap:8px;flex-wrap:wrap}
.rvbtn{padding:9px 14px;font-weight:500}.rvbtn b{font-family:var(--f-disp);color:var(--gold);margin-inline-end:4px}
.okline{color:var(--ok);font-weight:600}
.rvchip{border-color:var(--gold)}
.excard{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--flag-red);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.excard h3{font-family:var(--f-disp);font-size:1.25rem;margin:2px 0}
.excard p{color:var(--muted);font-size:.9rem}
.excard small{color:var(--muted)}
.excard .btn{align-self:flex-start}
.exmode .badge{flex:none}
/* exam */
.xbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:12px 14px}
.xbar .eyebrow{color:var(--flag-gold)}
.xtime{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.xtime small{color:var(--band-muted);font-size:.72rem}
.xtime b{font-family:var(--f-de);font-size:1.4rem;font-variant-numeric:tabular-nums;direction:ltr}
.xtime b.low{color:var(--flag-red)}
.xsteps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.xsteps::-webkit-scrollbar{display:none}
.xstep{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 10px;font-size:.82rem;font-family:var(--f-disp);font-weight:700;color:var(--gold)}
.xstep span{font-family:var(--f-de);font-weight:600;color:var(--muted)}
.xstep[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.xstep[aria-current="true"] span{color:var(--bg)}
.xinst{display:flex;flex-direction:column;gap:4px;border-inline-start:3px solid var(--gold)}
.xtext{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;direction:ltr;text-align:left;font-family:var(--f-de);line-height:1.7;font-size:1rem}
.xtext h3{font-family:var(--f-disp);margin-bottom:8px}
.xtext p+p{margin-top:10px}
.xitems{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:xi;direction:ltr;text-align:left}
.xitems>li{display:flex;flex-direction:column;gap:8px;position:relative;padding-left:30px;counter-increment:xi}
.xitems>li::before{content:counter(xi);position:absolute;left:0;top:1px;width:22px;height:22px;display:grid;place-items:center;background:var(--band);color:var(--flag-gold);font-family:var(--f-de);font-weight:700;font-size:.78rem;border-radius:3px}
.xitems.gaps{gap:8px}
.xrow{display:flex;gap:8px;align-items:center}
.xrow.wrap{flex-wrap:wrap}
.xcol{display:flex;flex-direction:column;gap:6px}
.xo{border:1px solid var(--line);border-bottom-width:2px;background:var(--surface);border-radius:var(--r);padding:10px 14px;font-family:var(--f-de);font-weight:500;text-align:left}
.xrow .xo{flex:1}
.xrow.wrap .xo{flex:0 0 auto}
.xo.sq{min-width:38px;padding:9px 0;text-align:center;font-weight:700}
.xrow.wrap{gap:6px}
.xo[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xads{display:grid;grid-template-columns:1fr;gap:8px;direction:ltr}
.xad{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left}
.xl{flex:none;width:28px;height:28px;display:grid;place-items:center;background:var(--band);color:var(--flag-gold);font-family:var(--f-disp);font-weight:700;border-radius:3px}
.xad p{font-size:.92rem;line-height:1.5}
.gapmk{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--line);padding:0 4px;text-align:center;color:var(--muted)}
.gapmk.f{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.gapmk sup{color:var(--gold);font-weight:700;margin-inline-end:3px}
.xplay{padding:8px 14px}
.xtr{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:.95rem}
.xwrite{width:100%;min-height:240px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:var(--f-de);font-size:1rem;line-height:1.6;resize:vertical}
.xnav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.xres{grid-template-columns:1fr auto}
.xres h1{font-size:clamp(2.4rem,11vw,3.2rem)}
.xstamp{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:700;border:3px solid currentColor}
.xres.pass .xstamp{color:#4cc38a}.xres.fail .xstamp{color:var(--flag-red)}
.xparts{display:flex;flex-direction:column;gap:10px}
.xpart{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.xpart .bar i{background:var(--gold)}
.xpart b{font-variant-numeric:tabular-nums;font-family:var(--f-de)}
.xbad{color:var(--bad)}.xgood{color:var(--ok)}

/* listening */
.hplayer{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hbig{font-size:1.1rem;padding:14px 26px}
.hscript{display:flex;flex-direction:column;gap:6px;text-align:left;direction:ltr;background:var(--surface-2);border-radius:var(--r);padding:12px;width:100%}
.hform{display:flex;gap:8px}
.hin{flex:1;font-family:var(--f-de);font-size:1.1rem;padding:12px 14px}
.diff del,.letter.diff del{color:var(--bad);text-decoration:line-through;background:var(--bad-bg);border-radius:3px;padding:0 2px}
.diff ins,.letter.diff ins{color:var(--ok);text-decoration:none;background:var(--ok-bg);border-radius:3px;padding:0 2px;font-weight:600}
.letter.diff{white-space:normal;line-height:1.9;direction:ltr;text-align:left}
/* writing correction */
.wrme{display:flex;flex-direction:column;gap:10px}
.wrme .btn{align-self:flex-start}
.fbcard{display:flex;flex-direction:column;gap:8px;border-inline-start:3px solid var(--ok)}
.fbcard .btn{align-self:flex-start}
.badge.newb{background:var(--flag-red);color:#fff}

/* flashcards */
.card{perspective:1200px;width:100%;text-align:center;display:block;cursor:pointer;border-radius:var(--r)}
.inner{position:relative;min-height:290px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 18px 40px}
.back-f{transform:rotateY(180deg)}
.face .tag{position:absolute;top:12px;inset-inline-start:14px;font-size:.78rem;color:var(--muted)}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.face .say{position:absolute;top:10px;inset-inline-end:10px}
.big-de{font-family:var(--f-de);direction:ltr;font-size:clamp(1.5rem,6.4vw,2.1rem);font-weight:700;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.big-tr{font-size:clamp(1.3rem,5.6vw,1.8rem);font-weight:600;line-height:1.4;text-wrap:balance}
.plural{font-family:var(--f-de);direction:ltr;color:var(--muted);font-size:.95rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.again{color:var(--bad);border-color:var(--bad);background:transparent}
.done{text-align:center;padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.wlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.wrow .txt .de{font-weight:600}
.wrow .txt small{color:var(--muted)}
.kn{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;color:transparent;font-weight:700}
.kn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.search{width:100%;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}

/* satzbau */
.prompt{display:flex;flex-direction:column;gap:6px}
.prompt .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.prompt .q{font-size:1.3rem;font-weight:600;line-height:1.5;text-wrap:balance}
.rail{min-height:64px;border:2px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--surface-2)}
.rail.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.rail.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.rail .ph{color:var(--muted);width:100%;text-align:center;align-self:center;font-size:.92rem;font-family:var(--f-ui)}
html[lang="ar"] .rail .ph{direction:rtl;font-family:var(--f-ar)}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px}
.tile{font-family:var(--f-de);font-size:1.08rem;padding:9px 13px;border-radius:var(--r);border:1px solid var(--line);border-bottom-width:2px;background:var(--surface);line-height:1}
.tile.used{visibility:hidden}
.tile.mk-ok{border-color:var(--ok,#2e7d4f);box-shadow:inset 0 -3px 0 var(--ok,#2e7d4f)}
.tile.mk-bad{border-color:var(--bad,#c0392b);box-shadow:inset 0 -3px 0 var(--bad,#c0392b)}
.recb{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;margin-inline-start:4px}
.sphero .sp-big{font-size:2.6rem;line-height:1}
.sp-ic{font-size:1.3rem}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;border-radius:16px;padding:10px 13px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.bub .bt{font-size:1.02rem}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-start-start-radius:4px}
[dir="rtl"] .bub.ai{align-self:flex-end}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:4px}
[dir="rtl"] .bub.me{align-self:flex-start}
.bub .bt.de{direction:ltr;text-align:left}
.bacts{display:flex;align-items:center;gap:10px}
.btr{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.bfix{background:var(--ok-bg);color:var(--ink);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.bfix .de{color:var(--ok);font-weight:600;direction:ltr;text-align:left}
.bfix small{color:var(--muted)}
.bfix .say{align-self:flex-start}
.bok{font-size:.8rem;opacity:.85}
.typing{flex-direction:row;align-items:center;gap:5px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.typing small{margin-inline-start:6px;color:var(--muted)}
@keyframes tp{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.spbar{display:flex;flex-direction:column;gap:6px;position:sticky;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:3;background:var(--bg);padding:8px 0 12px;margin-top:-6px}
.spfin{align-self:center}
.spsend{flex:none;width:48px;padding:0;font-size:1.1rem}
[dir="rtl"] .spsend{transform:scaleX(-1)}
.mic{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:#121316;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.mic:disabled{opacity:.5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(208,16,43,.45)}70%{box-shadow:0 0 0 16px rgba(208,16,43,0)}100%{box-shadow:0 0 0 0 rgba(208,16,43,0)}}
.micl{margin:0;font-size:.85rem;color:var(--bad);text-align:center;font-weight:600}
.spform{display:flex;gap:8px;width:100%}
.spform input{flex:1;min-width:0}
.spideas{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.spideas .chip{cursor:default}
@media (prefers-reduced-motion:reduce){.mic.on,.typing span{animation:none}}
.momo{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px}
.mo-head{display:flex;align-items:flex-end;gap:10px}
.mo-av{height:96px;width:auto;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.mo-bub{position:relative;background:var(--surface-2);border-radius:14px;padding:10px 12px;flex:1;margin-bottom:18px}
.mo-bub b{display:block;font-size:.8rem;color:var(--gold)}
.mo-bub p{margin:2px 0 0}
.mo-map{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px}
.mo-row{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.mo-lbl{margin:0;font-size:.82rem;font-weight:700}
.tk{--rc:var(--line);display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tk-w{font-family:var(--f-de);font-size:1rem;border:1.5px solid var(--line);border-bottom:4px solid var(--rc);border-radius:9px;padding:5px 9px;background:var(--surface);white-space:nowrap}
.tk-top{font-size:.66rem;color:var(--muted);font-weight:600;white-space:nowrap}
.tk-role{font-size:.64rem;color:var(--rc);font-weight:700;white-space:nowrap}
.r-S{--rc:#2563eb}.r-V{--rc:#c9900a}.r-E{--rc:#ea580c}.r-A{--rc:#16a34a}.r-D{--rc:#7c3aed}.r-G{--rc:#0d9488}.r-K{--rc:#64748b}.r-T{--rc:#8b919c}
.tk.x .tk-w{background:var(--bad-bg);border-color:var(--bad);border-bottom-color:var(--bad)}
.tk.x .tk-w b{color:var(--bad)}
.tk.x .tk-top{color:var(--bad)}
.tk.ok .tk-w{background:var(--ok-bg);border-color:var(--ok);border-bottom-color:var(--rc)}
.tk.ok .tk-w b{color:var(--ok)}
.tk.ok .tk-top{color:var(--ok)}
.mo-steps{margin:0;padding:0;list-style:none;counter-reset:ms;display:flex;flex-direction:column;gap:8px}
.mo-steps li>span{flex:1;min-width:0}
.mo-steps li{counter-increment:ms;display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.mo-steps li::before{content:counter(ms);flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#121316;font-weight:800;font-size:.8rem;display:grid;place-items:center;margin-top:1px}
.mo-steps li.new{animation:moin .35s ease}
@keyframes moin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mo-box{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mo-box p{margin:0;line-height:1.55}
.mo-box.good{background:var(--ok-bg)}
.mo-box.rule{background:var(--surface-2)}
.mo-box.chk{border:1.5px dashed var(--gold)}
.mo-opts{display:flex;flex-wrap:wrap;gap:8px}
.mo-opts .opt{flex:1 1 auto;min-width:72px}
.mo-hi{display:flex;align-items:center;gap:12px}
.mo-hi .mo-av{height:84px}
.mo-hi p{margin:4px 0 0;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.mo-steps li.new{animation:none}}
.fb ul.dg{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:4px}
.tile.p{min-width:34px;font-weight:700}
.trio{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
.fb{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb .t{font-weight:700}
.fb .line{display:flex;align-items:center;gap:8px}
.fb .line .de{font-weight:700;font-size:1.05rem;flex:1;min-width:0}

/* grammar */
.glist{display:grid;grid-template-columns:1fr;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.gitem .num{flex:none;width:30px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums}
.gitem .txt{flex:1;min-width:0}
.gitem .txt b{display:block;font-family:var(--f-de)}
.gitem .txt small{color:var(--muted)}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
.rules b{background:color-mix(in srgb,var(--gold) 22%,transparent);padding:0 3px;border-radius:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--f-de);font-size:.9rem;direction:ltr}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--surface-2);font-weight:700}
.tbl td:first-child{color:var(--muted);font-weight:600}
.tbl caption{caption-side:top;text-align:left;padding:8px 10px;font-weight:700;font-size:.85rem;color:var(--muted)}
.exs{display:flex;flex-direction:column;gap:10px}
.ex{display:flex;gap:10px;align-items:flex-start}
.ex .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex .de{font-weight:600}
.ex small{color:var(--muted);font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* quiz */
.modes{display:grid;grid-template-columns:1fr;gap:10px}
.mode{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;width:100%}
.mode .ic{width:42px;height:42px;border-radius:var(--r);background:var(--surface-2);display:grid;place-items:center;flex:none;font-family:var(--f-de);font-weight:700;font-size:.8rem}
.mode .txt{flex:1;min-width:0}
.mode small{color:var(--muted);display:block}
.qcard{display:flex;flex-direction:column;gap:10px}
.qtext{font-family:var(--f-de);direction:ltr;font-size:1.25rem;font-weight:600;line-height:1.5}
html[dir="rtl"] .qtext{text-align:right}
.qtext.center{text-align:center !important;font-size:1.8rem}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);text-align:center}
.blank.f{border-bottom-color:var(--ok);color:var(--ok)}
.opts{display:grid;gap:8px}
.opt{font-family:var(--f-de);direction:ltr;text-align:center;padding:13px;border-radius:var(--r);border:1px solid var(--line);border-bottom-width:2px;background:var(--surface);font-size:1.05rem;font-weight:600}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opts.art{grid-template-columns:repeat(3,1fr)}
.opts.art .opt[data-v="der"]{color:var(--der)}.opts.art .opt[data-v="die"]{color:var(--die)}.opts.art .opt[data-v="das"]{color:var(--das)}
.score{font-family:var(--f-disp);font-weight:700;font-size:2.4rem;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:8px}
.review .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}

/* writing */
.wlist2{display:flex;flex-direction:column;gap:8px}
.task{display:flex;flex-direction:column;gap:8px}
.points{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.letter{font-family:var(--f-de);direction:ltr;white-space:pre-wrap;line-height:1.65;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0;font-size:.98rem;overflow-wrap:anywhere}
.letter.trn{font-family:var(--f-ui);direction:inherit;background:var(--surface-2);border-style:dashed}
html[lang="ar"] .letter.trn{font-family:var(--f-ar);direction:rtl}
.pgroup{display:flex;flex-direction:column;gap:6px}
.phr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.phr:first-of-type{border-top:0}
.phr .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.phr .de{font-weight:600}
.phr small{color:var(--muted)}

@media (min-width:640px){
  .glist{grid-template-columns:1fr 1fr}
  .modes{grid-template-columns:1fr 1fr}
}
@media (max-width:370px){
  .trio{grid-template-columns:1fr 1fr}.trio .wide{grid-column:1/-1}
  .stats{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.bar i{transition:none}}
</style>

{id:"perfekt", de:"Perfekt",
 n:{ar:"الماضي (Perfekt)",uk:"Перфект (минулий час)",tr:"Perfekt (geçmiş zaman)",en:"Perfect tense"},
 tip:{ar:"haben/sein بالمكان التاني + Partizip II بآخر الجملة.",uk:"haben/sein на 2-му місці + Partizip II в кінці речення.",tr:"haben/sein 2. sırada + Partizip II cümlenin sonunda.",en:"haben/sein in position 2 + past participle at the end."},
 rules:{
  ar:["الـ Perfekt هو الماضي اللي بيستعملوه بالحكي اليومي.","التركيبة: **haben / sein** مصرّف + **Partizip II** بالآخر: Ich **habe** Pizza **gegessen**.","**sein** مع أفعال الحركة (gehen, fahren, fliegen) وتغيّر الحالة (aufstehen, einschlafen) ومع sein, bleiben, passieren, begegnen, gelingen. أغلب الباقي **haben**.","Partizip II: المنتظم ge…t (gemacht)، الأفعال القوية ge…en (geschrieben)، بس في أفعال شاذة بتخلص بـ -t (gedacht, gebracht)، المنفصل ge بالنص (eingekauft)، و be-/ver-/er- و -ieren بدون ge (verstanden, studiert)."],
  uk:["Perfekt — минулий час, який вживають у розмовній мові.","Будова: відмінюване **haben / sein** + **Partizip II** в кінці: Ich **habe** Pizza **gegessen**.","**sein** — з дієсловами руху (gehen, fahren, fliegen), зміни стану (aufstehen, einschlafen), а також sein, bleiben, passieren, begegnen, gelingen. Більшість інших — **haben**.","Partizip II: слабкі ge…t (gemacht), сильні ge…en (geschrieben), але деякі неправильні закінчуються на -t (gedacht, gebracht), відокремлювані — ge всередині (eingekauft), з be-/ver-/er- та на -ieren — без ge (verstanden, studiert)."],
  tr:["Perfekt, günlük konuşmada kullanılan geçmiş zamandır.","Yapı: çekimli **haben / sein** + sonda **Partizip II**: Ich **habe** Pizza **gegessen**.","**sein**: hareket fiilleri (gehen, fahren, fliegen), durum değişikliği (aufstehen, einschlafen) ve sein, bleiben, passieren, begegnen, gelingen ile. Diğerlerinin çoğu **haben** alır.","Partizip II: düzenli ge…t (gemacht), güçlü fiiller ge…en (geschrieben), ama bazı düzensiz fiiller -t ile biter (gedacht, gebracht), ayrılabilen fiillerde ge ortada (eingekauft), be-/ver-/er- ve -ieren fiillerinde ge yok (verstanden, studiert)."],
  en:["The Perfekt is the past tense used in everyday speech.","Form: conjugated **haben / sein** + **past participle** at the end: Ich **habe** Pizza **gegessen**.","Use **sein** with verbs of movement (gehen, fahren, fliegen), change of state (aufstehen, einschlafen) and with sein, bleiben, passieren, begegnen, gelingen. Most others take **haben**.","Participle: regular ge…t (gemacht), strong verbs ge…en (geschrieben), but some irregular verbs end in -t (gedacht, gebracht), separable verbs put ge in the middle (eingekauft), be-/ver-/er- and -ieren verbs take no ge (verstanden, studiert)."]},
 tables:[{cap:"Partizip II",rows:[["Infinitiv","Partizip II","Hilfsverb"],["machen","gemacht","haben"],["gehen","gegangen","sein"],["einkaufen","eingekauft","haben"],["aufstehen","aufgestanden","sein"],["verstehen","verstanden","haben"],["studieren","studiert","haben"]]}],
 ex:[
  ["Ich habe gestern Pizza gegessen.",{ar:"أكلت مبارح بيتزا.",uk:"Учора я їв піцу.",tr:"Dün pizza yedim.",en:"I ate pizza yesterday."}],
  ["Wir sind nach Berlin gefahren.",{ar:"سافرنا على برلين.",uk:"Ми поїхали до Берліна.",tr:"Berlin'e gittik.",en:"We went to Berlin."}],
  ["Hast du die Hausaufgaben schon gemacht?",{ar:"عملت الوظيفة؟",uk:"Ти вже зробив домашнє завдання?",tr:"Ödevleri yaptın mı?",en:"Have you done the homework yet?"}]]},

{id:"praeteritum", de:"Präteritum",
 n:{ar:"الماضي البسيط (Präteritum)",uk:"Претерит (простий минулий)",tr:"Präteritum (di'li geçmiş)",en:"Simple past"},
 tip:{ar:"بالكتابة والقصص: sein ← war، haben ← hatte، können ← konnte.",uk:"У письмі й розповідях: sein → war, haben → hatte, können → konnte.",tr:"Yazıda ve hikâyelerde: sein → war, haben → hatte, können → konnte.",en:"In writing and stories: sein → war, haben → hatte, können → konnte."},
 rules:{
  ar:["الـ Präteritum ماضي كمان، بس بيستعملوه أكتر بالكتابة (قصص، أخبار).","بالحكي بيستعملوه مع **sein, haben** والـ **Modalverben**: Ich **war** müde. Ich **konnte** nicht kommen.","الأفعال المنتظمة: الجذر + **(e)te**: machen → machte، arbeiten → arbeitete (‎-ete بعد d/t).","الأفعال الشاذة لازم تنحفظ: gehen → ging، kommen → kam، sehen → sah. ومع ich و er ما بتاخد نهاية: ich ging، er ging."],
  uk:["Präteritum — теж минулий час, але переважно в письмовій мові (розповіді, новини).","В усній мові його вживають із **sein, haben** і **модальними дієсловами**: Ich **war** müde. Ich **konnte** nicht kommen.","Слабкі дієслова: основа + **(e)te**: machen → machte, arbeiten → arbeitete (-ete після d/t).","Сильні дієслова треба запам'ятати: gehen → ging, kommen → kam, sehen → sah. З ich та er вони не мають закінчення: ich ging, er ging."],
  tr:["Präteritum da bir geçmiş zamandır, ama daha çok yazı dilinde (hikâyeler, haberler) kullanılır.","Konuşmada **sein, haben** ve **modal fiillerle** kullanılır: Ich **war** müde. Ich **konnte** nicht kommen.","Düzenli fiiller: kök + **(e)te**: machen → machte, arbeiten → arbeitete (d/t'den sonra -ete).","Düzensiz fiiller ezberlenmelidir: gehen → ging, kommen → kam, sehen → sah. ich ve er ile ek almazlar: ich ging, er ging."],
  en:["The Präteritum is also a past tense, used mostly in writing (stories, news).","In speech it is used with **sein, haben** and the **modal verbs**: Ich **war** müde. Ich **konnte** nicht kommen.","Regular verbs: stem + **(e)te**: machen → machte, arbeiten → arbeitete (-ete after d/t).","Irregular verbs must be learned: gehen → ging, kommen → kam, sehen → sah. With ich and er they have no ending: ich ging, er ging."]},
 tables:[{cap:"Präteritum",rows:[["","sein","haben","können","machen","gehen"],["ich","war","hatte","konnte","machte","ging"],["du","warst","hattest","konntest","machtest","gingst"],["er/sie/es","war","hatte","konnte","machte","ging"],["wir","waren","hatten","konnten","machten","gingen"],["ihr","wart","hattet","konntet","machtet","gingt"],["sie/Sie","waren","hatten","konnten","machten","gingen"]]}],
 ex:[
  ["Gestern war ich sehr müde.",{ar:"مبارح كنت تعبان كتير.",uk:"Учора я був дуже втомлений.",tr:"Dün çok yorgundum.",en:"Yesterday I was very tired."}],
  ["Wir hatten keine Zeit.",{ar:"ما كان عنا وقت.",uk:"У нас не було часу.",tr:"Vaktimiz yoktu.",en:"We had no time."}],
  ["Er konnte nicht kommen, weil er krank war.",{ar:"ما قدر يجي لأنه كان مريض.",uk:"Він не зміг прийти, бо був хворий.",tr:"Hasta olduğu için gelemedi.",en:"He couldn't come because he was ill."}]]},

{id:"modal", de:"Modalverben",
 n:{ar:"الأفعال المساعدة (Modalverben)",uk:"Модальні дієслова",tr:"Modal fiiller",en:"Modal verbs"},
 tip:{ar:"الـ Modalverb بالمكان التاني، والفعل التاني Infinitiv بالآخر.",uk:"Модальне дієслово на 2-му місці, інфінітив — у кінці.",tr:"Modal fiil 2. sırada, mastar sonda.",en:"Modal verb in position 2, infinitive at the end."},
 rules:{
  ar:["können (يقدر)، müssen (لازم)، wollen (بدّه)، dürfen (مسموح)، sollen (المفروض)، möchten (بحب / بدي بأدب).","الترتيب: Ich **kann** heute nicht **kommen**.","بالمفرد (ich, du, er) أغلب الـ Modalverben الحرف بيتغيّر: können → ich kann، müssen → ich muss (بس: sollen → ich soll). ومع wir/ihr/sie بيرجع: wir können، ihr könnt.","ich و er/sie/es **نفس الشكل** وبدون t: ich kann، er kann. ومع wer الفعل مفرد: **Wer will** mitkommen?"],
  uk:["können (могти), müssen (мусити), wollen (хотіти), dürfen (мати дозвіл), sollen (мати, слід), möchten (хотів би).","Порядок слів: Ich **kann** heute nicht **kommen**.","В однині (ich, du, er) у більшості модальних голосна змінюється: können → ich kann, müssen → ich muss (але: sollen → ich soll). З wir/ihr/sie — як в інфінітиві: wir können, ihr könnt.","ich і er/sie/es мають **однакову форму** без -t: ich kann, er kann. Після wer дієслово в однині: **Wer will** mitkommen?"],
  tr:["können (-ebilmek), müssen (zorunda olmak), wollen (istemek), dürfen (izinli olmak), sollen (-meli), möchten (istemek, kibar).","Sıra: Ich **kann** heute nicht **kommen**.","Tekilde (ich, du, er) çoğu modal fiilde ünlü değişir: können → ich kann, müssen → ich muss (ama: sollen → ich soll). wir/ihr/sie ile mastar gibidir: wir können, ihr könnt.","ich ve er/sie/es **aynı biçimdedir**, -t almaz: ich kann, er kann. wer ile fiil tekildir: **Wer will** mitkommen?"],
  en:["können (can), müssen (must, have to), wollen (want to), dürfen (may, be allowed to), sollen (should, be supposed to), möchten (would like).","Word order: Ich **kann** heute nicht **kommen**.","In the singular (ich, du, er) most modals change the vowel: können → ich kann, müssen → ich muss (but: sollen → ich soll). With wir/ihr/sie it returns: wir können, ihr könnt.","ich and er/sie/es have **the same form**, without -t: ich kann, er kann. After wer the verb is singular: **Wer will** mitkommen?"]},
 tables:[{cap:"Präsens",rows:[["","können","müssen","wollen","dürfen","sollen","möchten"],["ich","kann","muss","will","darf","soll","möchte"],["du","kannst","musst","willst","darfst","sollst","möchtest"],["er/sie/es","kann","muss","will","darf","soll","möchte"],["wir","können","müssen","wollen","dürfen","sollen","möchten"],["ihr","könnt","müsst","wollt","dürft","sollt","möchtet"],["sie/Sie","können","müssen","wollen","dürfen","sollen","möchten"]]}],
 ex:[
  ["An meiner Arbeitsstelle darf ich nicht im Internet surfen.",{ar:"بشغلي ممنوع أتصفّح الإنترنت.",uk:"На роботі мені не можна сидіти в інтернеті.",tr:"İş yerimde internette gezinmem yasak.",en:"At work I'm not allowed to surf the internet."}],
  ["Man muss auf den Preis achten.",{ar:"لازم الواحد ينتبه عالسعر.",uk:"Треба звертати увагу на ціну.",tr:"Fiyata dikkat etmek gerekir.",en:"You have to pay attention to the price."}],
  ["Wollt ihr heute Abend ins Kino gehen?",{ar:"بدكن تروحوا عالسينما الليلة؟",uk:"Хочете сьогодні ввечері піти в кіно?",tr:"Bu akşam sinemaya gitmek ister misiniz?",en:"Do you want to go to the cinema tonight?"}]]},

{id:"nebensatz", de:"Nebensätze: weil, dass, obwohl, ob",
 n:{ar:"الجمل الفرعية: weil, dass, obwohl, ob",uk:"Підрядні речення: weil, dass, obwohl, ob",tr:"Yan cümleler: weil, dass, obwohl, ob",en:"Subordinate clauses: weil, dass, obwohl, ob"},
 tip:{ar:"بالجملة الفرعية الفعل المصرّف بيروح لآخر الجملة.",uk:"У підрядному реченні відмінюване дієслово стоїть у кінці.",tr:"Yan cümlede çekimli fiil en sona gider.",en:"In a subordinate clause the conjugated verb goes to the end."},
 rules:{
  ar:["weil (لأنه)، dass (إنّه)، obwohl (مع إنه)، ob (إذا) بيعملوا جملة فرعية.","الفعل المصرّف بيروح **للآخر**: …, weil ich krank **bin**.","مع فعلين: الـ Modalverb أو haben/sein بيكون **آخر شي**: …, dass man online einkaufen **kann**. / …, dass ich einen Laptop gekauft **habe**.","إذا بلّشت بالجملة الفرعية، الفعل الرئيسي بيجي بعد الفاصلة مباشرة: **Weil** ich krank bin, **bleibe** ich zu Hause.","**ob** للأسئلة اللي جوابها نعم/لا: Ich weiß nicht, **ob** er kommt."],
  uk:["weil (бо), dass (що), obwohl (хоча), ob (чи) вводять підрядне речення.","Відмінюване дієслово йде **в кінець**: …, weil ich krank **bin**.","Якщо дієслів два, модальне або haben/sein стоїть **останнім**: …, dass man online einkaufen **kann**. / …, dass ich einen Laptop gekauft **habe**.","Якщо речення починається з підрядного, головне дієслово стоїть одразу після коми: **Weil** ich krank bin, **bleibe** ich zu Hause.","**ob** — для питань «так/ні»: Ich weiß nicht, **ob** er kommt."],
  tr:["weil (çünkü), dass (-dığı), obwohl (-e rağmen), ob (-ip -mediği) yan cümle başlatır.","Çekimli fiil **sona** gider: …, weil ich krank **bin**.","İki fiil varsa modal fiil veya haben/sein **en sonda** olur: …, dass man online einkaufen **kann**. / …, dass ich einen Laptop gekauft **habe**.","Cümle yan cümleyle başlarsa ana fiil virgülden hemen sonra gelir: **Weil** ich krank bin, **bleibe** ich zu Hause.","**ob** evet/hayır soruları içindir: Ich weiß nicht, **ob** er kommt."],
  en:["weil (because), dass (that), obwohl (although), ob (whether) start a subordinate clause.","The conjugated verb goes **to the end**: …, weil ich krank **bin**.","With two verbs, the modal or haben/sein comes **last**: …, dass man online einkaufen **kann**. / …, dass ich einen Laptop gekauft **habe**.","If you start with the subordinate clause, the main verb comes right after the comma: **Weil** ich krank bin, **bleibe** ich zu Hause.","**ob** is for yes/no questions: Ich weiß nicht, **ob** er kommt."]},
 ex:[
  ["Ich bleibe zu Hause, weil ich krank bin.",{ar:"بضل بالبيت لأني مريض.",uk:"Я залишаюся вдома, бо я хворий.",tr:"Hasta olduğum için evde kalıyorum.",en:"I'm staying at home because I'm ill."}],
  ["Obwohl es regnet, gehe ich spazieren.",{ar:"مع إنها عم تشتي، بطلع اتمشّى.",uk:"Хоча йде дощ, я йду гуляти.",tr:"Yağmur yağmasına rağmen yürüyüşe çıkıyorum.",en:"Although it's raining, I'm going for a walk."}],
  ["Können Sie mir sagen, ob der Zug pünktlich ist?",{ar:"فيك تقلّي إذا القطار عالوقت؟",uk:"Ви можете сказати, чи потяг прибуде вчасно?",tr:"Trenin zamanında olup olmadığını söyleyebilir misiniz?",en:"Can you tell me whether the train is on time?"}]]},

{id:"wennals", de:"wenn oder als?",
 n:{ar:"wenn ولا als؟",uk:"wenn чи als?",tr:"wenn mi als mı?",en:"wenn or als?"},
 tip:{ar:"als = مرة وحدة بالماضي. wenn = الحاضر/المستقبل، أو كل مرة بالماضي.",uk:"als — один раз у минулому; wenn — теперішнє/майбутнє або щоразу в минулому.",tr:"als: geçmişte bir kez. wenn: şimdi/gelecek ya da geçmişte her seferinde.",en:"als = once in the past. wenn = present/future, or every time in the past."},
 rules:{
  ar:["**als** لحدث صار **مرة وحدة** بالماضي: **Als** ich ein Kind war, wohnte ich in einem kleinen Dorf.","**wenn** للحاضر والمستقبل: **Wenn** ich Zeit habe, rufe ich dich an.","**wenn** كمان لشي كان يتكرّر بالماضي (كل مرة): **Wenn** es regnete, blieben wir zu Hause.","**wenn** كمان بمعنى «إذا» (شرط): **Wenn** du willst, helfe ich dir.","التنين بيعملوا جملة فرعية: الفعل بالآخر."],
  uk:["**als** — для події, що сталася **один раз** у минулому: **Als** ich ein Kind war, wohnte ich in einem kleinen Dorf.","**wenn** — для теперішнього і майбутнього: **Wenn** ich Zeit habe, rufe ich dich an.","**wenn** — також для повторюваних дій у минулому (щоразу): **Wenn** es regnete, blieben wir zu Hause.","**wenn** також означає «якщо» (умова): **Wenn** du willst, helfe ich dir.","Обидва вводять підрядне речення: дієслово в кінці."],
  tr:["**als** geçmişte **bir kez** olan olay için: **Als** ich ein Kind war, wohnte ich in einem kleinen Dorf.","**wenn** şimdiki zaman ve gelecek için: **Wenn** ich Zeit habe, rufe ich dich an.","**wenn** geçmişte tekrarlanan olaylar için de kullanılır (her seferinde): **Wenn** es regnete, blieben wir zu Hause.","**wenn** «eğer» (koşul) anlamına da gelir: **Wenn** du willst, helfe ich dir.","İkisi de yan cümle başlatır: fiil sonda."],
  en:["**als** for something that happened **once** in the past: **Als** ich ein Kind war, wohnte ich in einem kleinen Dorf.","**wenn** for the present and future: **Wenn** ich Zeit habe, rufe ich dich an.","**wenn** also for repeated events in the past (every time): **Wenn** es regnete, blieben wir zu Hause.","**wenn** also means 'if' (condition): **Wenn** du willst, helfe ich dir.","Both start a subordinate clause: verb at the end."]},
 ex:[
  ["Als ich in die Schweiz gekommen bin, konnte ich kein Deutsch.",{ar:"لما إجيت على سويسرا، ما كنت بعرف ألماني.",uk:"Коли я приїхав до Швейцарії, я не знав німецької.",tr:"İsviçre'ye geldiğimde hiç Almanca bilmiyordum.",en:"When I came to Switzerland, I didn't speak any German."}],
  ["Wenn ich Zeit habe, lerne ich jeden Tag zehn Wörter.",{ar:"لما يكون عندي وقت، بتعلّم كل يوم عشر كلمات.",uk:"Коли маю час, я щодня вчу десять слів.",tr:"Vaktim olduğunda her gün on kelime öğreniyorum.",en:"When I have time, I learn ten words every day."}],
  ["Wenn es regnete, blieben wir immer zu Hause.",{ar:"لما كانت تشتي، كنا دايماً نضل بالبيت.",uk:"Коли йшов дощ, ми завжди залишалися вдома.",tr:"Yağmur yağdığında hep evde kalırdık.",en:"Whenever it rained, we always stayed at home."}]]},

{id:"konnektoren", de:"deshalb, trotzdem, denn",
 n:{ar:"deshalb و trotzdem و denn",uk:"deshalb, trotzdem, denn",tr:"deshalb, trotzdem, denn",en:"deshalb, trotzdem, denn"},
 tip:{ar:"deshalb / trotzdem (بالأول) + فعل + فاعل. denn + فاعل + فعل.",uk:"deshalb / trotzdem (на 1-му місці) + дієслово + підмет. denn + підмет + дієслово.",tr:"deshalb / trotzdem (1. sırada) + fiil + özne. denn + özne + fiil.",en:"deshalb / trotzdem (1st position) + verb + subject. denn + subject + verb."},
 rules:{
  ar:["**deshalb / deswegen / darum / daher** = لهيك (نتيجة).","**trotzdem** = رغم هيك (عكس المتوقع).","إذا إجوا بالأول، بعدهن **الفعل مباشرة** وبعدين الفاعل: Es regnet, **deshalb bleibe ich** zu Hause. (وكمان ممكن: Ich bleibe deshalb zu Hause.)","**denn** = لأنه، بس الترتيب عادي (فاعل + فعل): Ich bleibe zu Hause, **denn ich bin** krank.","قارن: **weil** → الفعل بالآخر | **denn** → ترتيب عادي | **deshalb** → الفعل أول شي."],
  uk:["**deshalb / deswegen / darum / daher** = тому (наслідок).","**trotzdem** = попри це (всупереч очікуванню).","На початку після них **одразу дієслово**, потім підмет: Es regnet, **deshalb bleibe ich** zu Hause. (Також можна: Ich bleibe deshalb zu Hause.)","**denn** = бо, але порядок звичайний (підмет + дієслово): Ich bleibe zu Hause, **denn ich bin** krank.","Порівняй: **weil** → дієслово в кінці | **denn** → звичайний порядок | **deshalb** → дієслово одразу."],
  tr:["**deshalb / deswegen / darum / daher** = bu yüzden (sonuç).","**trotzdem** = yine de (beklenenin tersi).","Başta olduklarında hemen ardından **fiil**, sonra özne gelir: Es regnet, **deshalb bleibe ich** zu Hause. (Şu da olur: Ich bleibe deshalb zu Hause.)","**denn** = çünkü, ama sıra normaldir (özne + fiil): Ich bleibe zu Hause, **denn ich bin** krank.","Karşılaştır: **weil** → fiil sonda | **denn** → normal sıra | **deshalb** → fiil hemen gelir."],
  en:["**deshalb / deswegen / darum / daher** = therefore (result).","**trotzdem** = nevertheless (against expectation).","At the start, they are followed **directly by the verb**, then the subject: Es regnet, **deshalb bleibe ich** zu Hause. (Also possible: Ich bleibe deshalb zu Hause.)","**denn** = because, but with normal word order (subject + verb): Ich bleibe zu Hause, **denn ich bin** krank.","Compare: **weil** → verb at the end | **denn** → normal order | **deshalb** → verb first."]},
 ex:[
  ["Mein Handy ist alt, deshalb kaufe ich ein neues.",{ar:"موبايلي قديم، لهيك رح اشتري واحد جديد.",uk:"Мій телефон старий, тому я куплю новий.",tr:"Telefonum eski, bu yüzden yenisini alacağım.",en:"My phone is old, so I'm going to buy a new one."}],
  ["Es ist kalt. Trotzdem gehen wir schwimmen.",{ar:"الدنيا برد. رغم هيك رايحين نسبح.",uk:"Холодно. Попри це ми йдемо плавати.",tr:"Hava soğuk. Yine de yüzmeye gidiyoruz.",en:"It's cold. Nevertheless, we're going swimming."}],
  ["Ich lerne Deutsch, denn ich möchte hier arbeiten.",{ar:"بتعلّم ألماني، لأني بدي اشتغل هون.",uk:"Я вчу німецьку, бо хочу тут працювати.",tr:"Almanca öğreniyorum, çünkü burada çalışmak istiyorum.",en:"I'm learning German because I want to work here."}]]},

{id:"sodass", de:"sodass / so … dass",
 n:{ar:"sodass و so … dass",uk:"sodass / so … dass",tr:"sodass / so … dass",en:"sodass / so … dass"},
 tip:{ar:"في so قبل الصفة؟ ← dass. ما في so؟ ← sodass. والفعل بالآخر.",uk:"Є so перед прикметником → dass. Немає so → sodass. Дієслово в кінці.",tr:"Sıfattan önce so var mı? → dass. Yoksa → sodass. Fiil sonda.",en:"so before the adjective? → dass. No so? → sodass. Verb at the end."},
 rules:{
  ar:["الاتنين بيعبّروا عن **نتيجة**.","**so + صفة … dass** (لدرجة إنه): Das Essen ist **so gut, dass** ich jeden Tag komme.","**sodass** (فـ / بالتالي) لما ما في so: Ich war krank, **sodass** ich nicht arbeiten konnte.","بالاتنين الفعل المصرّف **بالآخر**."],
  uk:["Обидва виражають **наслідок**.","**so + прикметник … dass** (настільки…, що): Das Essen ist **so gut, dass** ich jeden Tag komme.","**sodass** (так що), коли немає so: Ich war krank, **sodass** ich nicht arbeiten konnte.","В обох випадках відмінюване дієслово **в кінці**."],
  tr:["İkisi de **sonuç** bildirir.","**so + sıfat … dass** (o kadar … ki): Das Essen ist **so gut, dass** ich jeden Tag komme.","so yoksa **sodass** (bu yüzden, böylece): Ich war krank, **sodass** ich nicht arbeiten konnte.","İkisinde de çekimli fiil **sonda**."],
  en:["Both express a **result**.","**so + adjective … dass** (so … that): Das Essen ist **so gut, dass** ich jeden Tag komme.","**sodass** (so, as a result) when there is no so: Ich war krank, **sodass** ich nicht arbeiten konnte.","In both, the conjugated verb goes **to the end**."]},
 ex:[
  ["Der Kopfhörer war so teuer, dass sie lange sparen musste.",{ar:"السماعات كانت غالية لدرجة إنها اضطرت تجمّع مصاري لمدة طويلة.",uk:"Навушники були такі дорогі, що їй довелося довго збирати гроші.",tr:"Kulaklık o kadar pahalıydı ki uzun süre para biriktirmek zorunda kaldı.",en:"The headphones were so expensive that she had to save for a long time."}],
  ["Der Bus kam nicht, sodass ich zu spät war.",{ar:"الباص ما إجا، فتأخّرت.",uk:"Автобус не приїхав, тож я запізнився.",tr:"Otobüs gelmedi, bu yüzden geç kaldım.",en:"The bus didn't come, so I was late."}],
  ["Ich habe das Lied so oft gehört, dass ich es auswendig kann.",{ar:"سمعت الغنية كتير لدرجة إني صرت بحفظها.",uk:"Я так часто слухав цю пісню, що знаю її напам'ять.",tr:"Şarkıyı o kadar çok dinledim ki ezbere biliyorum.",en:"I've heard the song so often that I know it by heart."}]]},

{id:"genitiv", de:"Genitiv",
 n:{ar:"حالة الإضافة (Genitiv)",uk:"Родовий відмінок (Genitiv)",tr:"Genitiv (-in hâli)",en:"Genitive"},
 tip:{ar:"der و das ← des، والاسم بياخد -s أو -es. die والجمع ← der. والصفة بتخلص بـ -en.",uk:"der/das → des + іменник -s/-es. die/множина → der. Прикметник -en.",tr:"der/das → des + isim -s/-es. die/çoğul → der. Sıfat -en.",en:"der/das → des + noun -s/-es. die/plural → der. Adjective -en."},
 rules:{
  ar:["الـ Genitiv للملكية (تبع مين؟ ← **wessen?**): das Auto **des Mannes** = سيارة الرجّال.","مذكر ومحايد: **des / eines / meines** + الاسم بياخد **-s** (des Gartens)، أو **-es** للكلمات القصيرة واللي بتخلص بـ s/ß/z (des Hauses). استثناء: الأسماء الضعيفة بتاخد -(e)n: des Kollegen، des Herrn.","مؤنث وجمع: **der / einer / meiner** + الاسم ما بيتغيّر (der Küche، der Wände).","مع أسماء الأشخاص: الاسم أول شي + **s**: **Yazans** Bruder، **Marias** Handy.","بالحكي كتير بيقولوا **von + Dativ**: die Wohnung **von meinem** Freund."],
  uk:["Genitiv виражає належність (чий? → **wessen?**): das Auto **des Mannes** = машина чоловіка.","Чоловічий і середній рід: **des / eines / meines** + іменник із **-s** (des Gartens) або **-es** у коротких словах і після s/ß/z (des Hauses). Виняток: n-іменники мають -(e)n: des Kollegen, des Herrn.","Жіночий рід і множина: **der / einer / meiner** + іменник без змін (der Küche, der Wände).","З іменами людей: ім'я + **s** попереду: **Yazans** Bruder, **Marias** Handy.","У розмові часто кажуть **von + Dativ**: die Wohnung **von meinem** Freund."],
  tr:["Genitiv aitlik bildirir (kimin? → **wessen?**): das Auto **des Mannes** = adamın arabası.","Eril ve nötr: **des / eines / meines** + isim **-s** alır (des Gartens); kısa kelimelerde ve s/ß/z ile bitenlerde **-es** (des Hauses). İstisna: n-isimleri -(e)n alır: des Kollegen, des Herrn.","Dişil ve çoğul: **der / einer / meiner** + isim değişmez (der Küche, der Wände).","Kişi adlarında: ad + **s** önde: **Yazans** Bruder, **Marias** Handy.","Konuşmada sık sık **von + Dativ** kullanılır: die Wohnung **von meinem** Freund."],
  en:["The genitive shows possession (whose? → **wessen?**): das Auto **des Mannes** = the man's car.","Masculine and neuter: **des / eines / meines** + noun with **-s** (des Gartens), or **-es** for short words and after s/ß/z (des Hauses). Exception: n-nouns take -(e)n: des Kollegen, des Herrn.","Feminine and plural: **der / einer / meiner** + noun unchanged (der Küche, der Wände).","With people's names: name + **s** in front: **Yazans** Bruder, **Marias** Handy.","In speech people often use **von + dative**: die Wohnung **von meinem** Freund."]},
 tables:[{cap:"Genitiv",rows:[["","maskulin","neutral","feminin","Plural"],["bestimmt","des Mannes","des Kindes","der Frau","der Kinder"],["unbestimmt","eines Mannes","eines Kindes","einer Frau","—"],["Possessiv","meines Mannes","meines Kindes","meiner Frau","meiner Kinder"],["Negation","keines Mannes","keines Kindes","keiner Frau","keiner Kinder"]]}],
 ex:[
  ["Die Miete der Wohnung ist sehr teuer.",{ar:"إيجار الشقة غالي كتير.",uk:"Оренда квартири дуже дорога.",tr:"Dairenin kirası çok pahalı.",en:"The rent for the flat is very expensive."}],
  ["Hast du die Rede des Ministers gehört?",{ar:"سمعت خطاب الوزير؟",uk:"Ти чув промову міністра?",tr:"Bakanın konuşmasını dinledin mi?",en:"Did you hear the minister's speech?"}],
  ["Die Eltern der Freundin meines Bruders wohnen in Biel.",{ar:"أهل صاحبة أخوي ساكنين ببيل.",uk:"Батьки подруги мого брата живуть у Білі.",tr:"Kardeşimin kız arkadaşının ailesi Biel'de oturuyor.",en:"My brother's girlfriend's parents live in Biel."}]]},

{id:"wegentrotz", de:"wegen / trotz",
 n:{ar:"wegen (بسبب) و trotz (رغم)",uk:"wegen (через) і trotz (попри)",tr:"wegen (yüzünden) ve trotz (rağmen)",en:"wegen (because of) and trotz (despite)"},
 tip:{ar:"wegen = بسبب، trotz = رغم. بعدهن Genitiv والصفة -en.",uk:"wegen = через, trotz = попри. Після них Genitiv, прикметник -en.",tr:"wegen = yüzünden, trotz = -e rağmen. Ardından Genitiv, sıfat -en.",en:"wegen = because of, trotz = despite. Then genitive, adjective -en."},
 rules:{
  ar:["**wegen** = بسبب (متل weil)، **trotz** = رغم (متل obwohl).","بعدهن **اسم بالـ Genitiv**، مش جملة: **wegen des Regens**، **trotz der Kälte**.","الصفة بعد الأداة بالـ Genitiv دايماً **-en**: wegen der hoh**en** Kosten، trotz des neu**en** Handys.","فيك تحطهن بالأول (والفعل بعدهن مباشرة) أو بالنص: **Wegen des Regens bleibe ich** zu Hause. / Ich bleibe **wegen des Regens** zu Hause.","مع الضمائر بالحكي بيقولوا Dativ: wegen **dir**، wegen **ihm** (بالكتابة: deinetwegen، seinetwegen)."],
  uk:["**wegen** = через (як weil), **trotz** = попри (як obwohl).","Після них **іменник у Genitiv**, а не речення: **wegen des Regens**, **trotz der Kälte**.","Прикметник після артикля в Genitiv завжди **-en**: wegen der hoh**en** Kosten, trotz des neu**en** Handys.","Можна поставити на початок (тоді одразу дієслово) або в середину: **Wegen des Regens bleibe ich** zu Hause. / Ich bleibe **wegen des Regens** zu Hause.","Із займенниками в розмові — Dativ: wegen **dir**, wegen **ihm** (письмово: deinetwegen, seinetwegen)."],
  tr:["**wegen** = yüzünden (weil gibi), **trotz** = -e rağmen (obwohl gibi).","Ardından cümle değil, **Genitiv'de bir isim** gelir: **wegen des Regens**, **trotz der Kälte**.","Genitiv'de artikelden sonra sıfat her zaman **-en** alır: wegen der hoh**en** Kosten, trotz des neu**en** Handys.","Başa (fiil hemen ardından gelir) ya da ortaya konabilir: **Wegen des Regens bleibe ich** zu Hause. / Ich bleibe **wegen des Regens** zu Hause.","Zamirlerle konuşmada Dativ kullanılır: wegen **dir**, wegen **ihm** (yazıda: deinetwegen, seinetwegen)."],
  en:["**wegen** = because of (like weil), **trotz** = despite (like obwohl).","They are followed by a **noun in the genitive**, not a clause: **wegen des Regens**, **trotz der Kälte**.","After an article in the genitive the adjective always ends in **-en**: wegen der hoh**en** Kosten, trotz des neu**en** Handys.","Put them first (the verb comes right after) or in the middle: **Wegen des Regens bleibe ich** zu Hause. / Ich bleibe **wegen des Regens** zu Hause.","With pronouns, people say wegen + dative in speech: wegen **dir**, wegen **ihm** (written: deinetwegen, seinetwegen)."]},
 ex:[
  ["Wegen des Staus komme ich zu spät.",{ar:"بسبب العجقة رح اتأخّر.",uk:"Через затор я запізнюся.",tr:"Trafik sıkışıklığı yüzünden geç kalacağım.",en:"Because of the traffic jam I'll be late."}],
  ["Trotz der teuren Miete will ich nicht umziehen.",{ar:"رغم الإيجار الغالي ما بدي انتقل.",uk:"Попри дорогу оренду я не хочу переїжджати.",tr:"Pahalı kiraya rağmen taşınmak istemiyorum.",en:"Despite the expensive rent I don't want to move."}],
  ["Frau Brem braucht wegen des neuen Handys keine Kamera mehr.",{ar:"السيدة بريم ما عادت بحاجة كاميرا بسبب الموبايل الجديد.",uk:"Через новий телефон пані Брем більше не потрібна камера.",tr:"Bayan Brem yeni telefonu sayesinde artık fotoğraf makinesine ihtiyaç duymuyor.",en:"Because of her new phone, Ms Brem doesn't need a camera any more."}]]},

{id:"relativ", de:"Relativsätze",
 n:{ar:"الجمل الموصولة (Relativsätze)",uk:"Відносні речення",tr:"İlgi cümleleri",en:"Relative clauses"},
 tip:{ar:"الضمير الموصول بياخد جنس الاسم، وحالته من الجملة الموصولة. الفعل بالآخر.",uk:"Відносний займенник має рід іменника, а відмінок — з підрядного речення. Дієслово в кінці.",tr:"İlgi zamiri ismin cinsini alır, hâli yan cümleden gelir. Fiil sonda.",en:"Relative pronoun: gender from the noun, case from the relative clause. Verb at the end."},
 rules:{
  ar:["الجملة الموصولة بتوصف اسم (متل «اللي» بالعربي): Das ist der Mann, **der** neben mir wohnt.","**الجنس** والعدد من الاسم اللي قبلها (der Mann → der).","**الحالة** من دوره جوّا الجملة الموصولة: فاعل → Nominativ (der)، مفعول به → Akkusativ (den)، بعد mit/bei… أو فعل Dativ → Dativ (dem).","الفعل المصرّف **بالآخر**، وفي فاصلة قبل الجملة."],
  uk:["Відносне речення описує іменник (як «який» в українській): Das ist der Mann, **der** neben mir wohnt.","**Рід** і число — від іменника перед ним (der Mann → der).","**Відмінок** — від ролі в підрядному реченні: підмет → Nominativ (der), додаток → Akkusativ (den), після mit/bei… чи дієслова з Dativ → Dativ (dem).","Відмінюване дієслово **в кінці**, перед реченням ставиться кома."],
  tr:["İlgi cümlesi bir ismi niteler (Türkçedeki «-en/-an, -dığı» gibi): Das ist der Mann, **der** neben mir wohnt.","**Cins** ve sayı önceki isimden gelir (der Mann → der).","**Hâl**, yan cümledeki göreve göre belirlenir: özne → Nominativ (der), nesne → Akkusativ (den), mit/bei… veya Dativ fiilinden sonra → Dativ (dem).","Çekimli fiil **sonda** olur, cümleden önce virgül konur."],
  en:["A relative clause describes a noun (like 'who/which/that'): Das ist der Mann, **der** neben mir wohnt.","**Gender** and number come from the noun before it (der Mann → der).","**Case** comes from its role inside the relative clause: subject → nominative (der), object → accusative (den), after mit/bei… or a dative verb → dative (dem).","The conjugated verb goes **to the end**; put a comma before the clause."]},
 tables:[{cap:"Relativpronomen",rows:[["","maskulin","neutral","feminin","Plural"],["Nominativ","der","das","die","die"],["Akkusativ","den","das","die","die"],["Dativ","dem","dem","der","denen"]]}],
 ex:[
  ["Das ist der Kollege, der mir immer hilft.",{ar:"هاد الزميل اللي دايماً بيساعدني.",uk:"Це колега, який мені завжди допомагає.",tr:"Bu, bana hep yardım eden iş arkadaşı.",en:"This is the colleague who always helps me."}],
  ["Die Wohnung, die wir gesehen haben, war zu teuer.",{ar:"الشقة اللي شفناها كانت غالية زيادة عن اللزوم.",uk:"Квартира, яку ми бачили, була задорогою.",tr:"Gördüğümüz daire fazla pahalıydı.",en:"The flat that we saw was too expensive."}],
  ["Das ist die Frau, mit der ich arbeite.",{ar:"هاي الست اللي بشتغل معها.",uk:"Це жінка, з якою я працюю.",tr:"Bu, birlikte çalıştığım kadın.",en:"This is the woman I work with."}]]},

{id:"passiv", de:"Passiv",
 n:{ar:"المبني للمجهول (Passiv)",uk:"Пасивний стан",tr:"Edilgen yapı (Passiv)",en:"Passive voice"},
 tip:{ar:"werden + Partizip II. مين عمل الشي مش مهم.",uk:"werden + Partizip II. Хто виконує дію — неважливо.",tr:"werden + Partizip II. İşi kimin yaptığı önemli değil.",en:"werden + past participle. Who does it isn't important."},
 rules:{
  ar:["الـ Passiv لما **الفعل نفسه** أهم من اللي عمله: Das Haus **wird gebaut**. (البيت عم ينبنى)","Präsens: **werden** مصرّف + **Partizip II** بالآخر: Die Post **wird** um 9 Uhr **gebracht**.","Präteritum: **wurde** + Partizip II: Das Auto **wurde** gestern **repariert**.","إذا بدك تذكر مين عمله: **von + Dativ**: Das Haus wurde **von meinem Vater** gebaut.","مع Modalverb: الـ Modalverb + Partizip II + **werden** بالآخر: Das Formular **muss** unterschrieben **werden**."],
  uk:["Пасив вживають, коли **сама дія** важливіша за виконавця: Das Haus **wird gebaut**. (Будинок будують)","Präsens: відмінюване **werden** + **Partizip II** в кінці: Die Post **wird** um 9 Uhr **gebracht**.","Präteritum: **wurde** + Partizip II: Das Auto **wurde** gestern **repariert**.","Якщо треба назвати виконавця: **von + Dativ**: Das Haus wurde **von meinem Vater** gebaut.","З модальним дієсловом: модальне + Partizip II + **werden** в кінці: Das Formular **muss** unterschrieben **werden**."],
  tr:["Edilgen yapı, **eylemin kendisi** yapandan daha önemli olduğunda kullanılır: Das Haus **wird gebaut**. (Ev inşa ediliyor)","Präsens: çekimli **werden** + sonda **Partizip II**: Die Post **wird** um 9 Uhr **gebracht**.","Präteritum: **wurde** + Partizip II: Das Auto **wurde** gestern **repariert**.","Yapanı söylemek için: **von + Dativ**: Das Haus wurde **von meinem Vater** gebaut.","Modal fiille: modal + Partizip II + sonda **werden**: Das Formular **muss** unterschrieben **werden**."],
  en:["Use the passive when **the action** matters more than who does it: Das Haus **wird gebaut**. (The house is being built)","Present: conjugated **werden** + **past participle** at the end: Die Post **wird** um 9 Uhr **gebracht**.","Simple past: **wurde** + participle: Das Auto **wurde** gestern **repariert**.","To say who did it: **von + dative**: Das Haus wurde **von meinem Vater** gebaut.","With a modal: modal + participle + **werden** at the end: Das Formular **muss** unterschrieben **werden**."]},
 tables:[{cap:"Passiv",rows:[["","Präsens","Präteritum"],["ich","werde gefragt","wurde gefragt"],["du","wirst gefragt","wurdest gefragt"],["er/sie/es","wird gefragt","wurde gefragt"],["wir","werden gefragt","wurden gefragt"],["ihr","werdet gefragt","wurdet gefragt"],["sie/Sie","werden gefragt","wurden gefragt"]]}],
 ex:[
  ["In der Schweiz wird der Müll getrennt.",{ar:"بسويسرا الزبالة بتنفرز.",uk:"У Швейцарії сміття сортують.",tr:"İsviçre'de çöpler ayrıştırılır.",en:"In Switzerland, rubbish is separated."}],
  ["Das Auto wurde gestern repariert.",{ar:"السيارة تصلّحت مبارح.",uk:"Машину відремонтували вчора.",tr:"Araba dün tamir edildi.",en:"The car was repaired yesterday."}],
  ["Das Formular muss bis Freitag ausgefüllt werden.",{ar:"الاستمارة لازم تنعبّى لحد الجمعة.",uk:"Формуляр треба заповнити до п'ятниці.",tr:"Formun cumaya kadar doldurulması gerekiyor.",en:"The form has to be filled in by Friday."}]]},

{id:"konjunktiv", de:"Konjunktiv II",
 n:{ar:"صيغة التمنّي (Konjunktiv II)",uk:"Умовний спосіб (Konjunktiv II)",tr:"Dilek kipi (Konjunktiv II)",en:"Subjunctive II (would, could)"},
 tip:{ar:"würde + Infinitiv، و hätte / wäre / könnte للأمنيات والطلب المؤدّب.",uk:"würde + інфінітив; hätte / wäre / könnte — для побажань і ввічливих прохань.",tr:"würde + mastar; dilek ve kibar ricalarda hätte / wäre / könnte.",en:"würde + infinitive; hätte / wäre / könnte for wishes and polite requests."},
 rules:{
  ar:["الـ Konjunktiv II للأمنيات، والأشياء غير الحقيقية، والطلب المؤدّب.","أغلب الأفعال: **würde + Infinitiv** بالآخر: Ich **würde** gern in Zürich **wohnen**.","haben → **hätte**، sein → **wäre**، können → **könnte**، müssen → **müsste**: Ich **hätte** gern mehr Zeit.","طلب مؤدّب: **Könnten** Sie mir bitte helfen? / Ich **hätte** gern einen Kaffee.","شرط غير حقيقي: **Wenn** ich Zeit **hätte**, **würde** ich mehr lesen.","نصيحة: An deiner Stelle **würde** ich zum Arzt gehen."],
  uk:["Konjunktiv II вживають для побажань, нереальних ситуацій і ввічливих прохань.","Більшість дієслів: **würde + інфінітив** у кінці: Ich **würde** gern in Zürich **wohnen**.","haben → **hätte**, sein → **wäre**, können → **könnte**, müssen → **müsste**: Ich **hätte** gern mehr Zeit.","Ввічливе прохання: **Könnten** Sie mir bitte helfen? / Ich **hätte** gern einen Kaffee.","Нереальна умова: **Wenn** ich Zeit **hätte**, **würde** ich mehr lesen.","Порада: An deiner Stelle **würde** ich zum Arzt gehen."],
  tr:["Konjunktiv II dilekler, gerçek olmayan durumlar ve kibar ricalar için kullanılır.","Çoğu fiil: sonda **würde + mastar**: Ich **würde** gern in Zürich **wohnen**.","haben → **hätte**, sein → **wäre**, können → **könnte**, müssen → **müsste**: Ich **hätte** gern mehr Zeit.","Kibar rica: **Könnten** Sie mir bitte helfen? / Ich **hätte** gern einen Kaffee.","Gerçek dışı koşul: **Wenn** ich Zeit **hätte**, **würde** ich mehr lesen.","Tavsiye: An deiner Stelle **würde** ich zum Arzt gehen."],
  en:["Konjunktiv II is used for wishes, unreal situations and polite requests.","Most verbs: **würde + infinitive** at the end: Ich **würde** gern in Zürich **wohnen**.","haben → **hätte**, sein → **wäre**, können → **könnte**, müssen → **müsste**: Ich **hätte** gern mehr Zeit.","Polite request: **Könnten** Sie mir bitte helfen? / Ich **hätte** gern einen Kaffee.","Unreal condition: **Wenn** ich Zeit **hätte**, **würde** ich mehr lesen.","Advice: An deiner Stelle **würde** ich zum Arzt gehen."]},

 ex:[
  ["Wenn ich mehr Geld hätte, würde ich eine größere Wohnung mieten.",{ar:"لو معي مصاري أكتر، كنت استأجرت شقة أكبر.",uk:"Якби в мене було більше грошей, я б орендував більшу квартиру.",tr:"Daha çok param olsaydı, daha büyük bir daire kiralardım.",en:"If I had more money, I would rent a bigger flat."}],
  ["Könnten Sie mir bitte sagen, wo der Bahnhof ist?",{ar:"ممكن تقلّي وين المحطة لو سمحت؟",uk:"Чи не могли б ви сказати, де вокзал?",tr:"Garın nerede olduğunu söyleyebilir misiniz lütfen?",en:"Could you please tell me where the station is?"}],
  ["An deiner Stelle würde ich zum Arzt gehen.",{ar:"لو كنت محلّك كنت رحت عالدكتور.",uk:"На твоєму місці я б пішов до лікаря.",tr:"Senin yerinde olsam doktora giderdim.",en:"If I were you, I'd go to the doctor."}]]},

{id:"adjektiv", de:"Adjektivendungen",
 n:{ar:"نهايات الصفات",uk:"Закінчення прикметників",tr:"Sıfat ekleri",en:"Adjective endings"},
 tip:{ar:"بعد der/die/das: -e أو -en. بعد ein اللي ما إلها نهاية: الصفة بتاخد -er / -es.",uk:"Після der/die/das: -e або -en. Після ein без закінчення прикметник отримує -er / -es.",tr:"der/die/das'tan sonra: -e veya -en. Eksiz ein'dan sonra sıfat -er / -es alır.",en:"After der/die/das: -e or -en. After ein with no ending, the adjective takes -er / -es."},
 rules:{
  ar:["الصفة قبل الاسم بتاخد نهاية؛ بعد الفعل لأ: Das Auto ist **neu**. / das **neue** Auto.","بعد **der / die / das** (و dieser، jeder): Nominativ مفرد و Akkusativ (die / das) → **-e**، والباقي كله → **-en**.","بعد **ein / kein / mein**: إذا الأداة ما وضّحت الجنس، الصفة بتوضّحه: ein neu**er** Tisch (der)، ein neu**es** Auto (das).","**Dativ و Genitiv** دايماً **-en**: mit dem neu**en** Auto، wegen des neu**en** Handys.","الجمع بعد die / keine / meine → **-en**: die neu**en** Stühle."],
  uk:["Прикметник перед іменником має закінчення; після дієслова — ні: Das Auto ist **neu**. / das **neue** Auto.","Після **der / die / das** (і dieser, jeder): Nominativ однини та Akkusativ (die / das) → **-e**, решта → **-en**.","Після **ein / kein / mein**: якщо артикль не показує рід, це робить прикметник: ein neu**er** Tisch (der), ein neu**es** Auto (das).","**Dativ і Genitiv** — завжди **-en**: mit dem neu**en** Auto, wegen des neu**en** Handys.","Множина після die / keine / meine → **-en**: die neu**en** Stühle."],
  tr:["İsimden önceki sıfat ek alır; fiilden sonra almaz: Das Auto ist **neu**. / das **neue** Auto.","**der / die / das** (ve dieser, jeder) sonrası: tekil Nominativ ve Akkusativ (die / das) → **-e**, gerisi → **-en**.","**ein / kein / mein** sonrası: artikel cinsi göstermiyorsa sıfat gösterir: ein neu**er** Tisch (der), ein neu**es** Auto (das).","**Dativ ve Genitiv** her zaman **-en**: mit dem neu**en** Auto, wegen des neu**en** Handys.","Çoğulda die / keine / meine sonrası → **-en**: die neu**en** Stühle."],
  en:["An adjective before a noun takes an ending; after a verb it doesn't: Das Auto ist **neu**. / das **neue** Auto.","After **der / die / das** (and dieser, jeder): nominative singular and accusative die / das → **-e**, everything else → **-en**.","After **ein / kein / mein**: if the article doesn't show the gender, the adjective does: ein neu**er** Tisch (der), ein neu**es** Auto (das).","**Dative and genitive** are always **-en**: mit dem neu**en** Auto, wegen des neu**en** Handys.","Plural after die / keine / meine → **-en**: die neu**en** Stühle."]},
 tables:[
  {cap:"der / die / das + Adjektiv",rows:[["","der","das","die","Plural"],["Nom.","der neue Tisch","das neue Auto","die neue Lampe","die neuen Stühle"],["Akk.","den neuen Tisch","das neue Auto","die neue Lampe","die neuen Stühle"],["Dat.","dem neuen Tisch","dem neuen Auto","der neuen Lampe","den neuen Stühlen"],["Gen.","des neuen Tisches","des neuen Autos","der neuen Lampe","der neuen Stühle"]]},
